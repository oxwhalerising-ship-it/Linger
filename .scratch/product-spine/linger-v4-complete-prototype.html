<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵儿 v4 · 沉浸聚焦、习惯看板与全天数据可视化原型（PROTOTYPE）</title>
<style>
/* ==========================================================================
   灵儿 v4 · 白 / 蓝 / 黑 主基调 + 低饱和和谐 7 类时间色系（PROTOTYPE）
   ========================================================================== */
:root {
  --bg-app: #f6f7f9;
  --bg-sidebar: #fafafb;
  --bg-main: #ffffff;
  --bg-surface: #ffffff;
  --bg-subtle: #f2f4f7;
  --bg-hover: #eef1f5;
  --bg-track: #e9ecf1;

  --border: #e6e8ec;
  --border-hover: #cfd5df;
  --border-strong: #bfc7d5;

  --ink-primary: #111318;
  --ink-secondary: #4b5563;
  --ink-muted: #8a94a6;
  --ink-inverse: #ffffff;

  --blue-primary: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-mid: #60a5fa;
  --blue-soft: #93c5fd;
  --blue-light: #dbeafe;
  --blue-tint: #eff6ff;
  --blue-ring: rgba(37, 99, 235, 0.20);

  /* 7 大时间分类 · 统一克制低饱和色系（和谐耐看，不花哨） */
  --cat-sleep: #475569;      /* 1. 睡觉：沉静石板夜蓝 */
  --cat-meal: #d9822b;       /* 2. 吃饭：温润暖麦琥珀 */
  --cat-rest: #2a9d8f;       /* 3. 休息：舒缓雾感青绿 */
  --cat-work: #2563eb;       /* 4. 学习/工作：品牌主钴蓝 */
  --cat-exercise: #0284c7;   /* 5. 运动：清冽天空蓝 */
  --cat-wash: #7c6cf0;       /* 6. 洗漱：淡雅薰衣紫 */
  --cat-leisure: #cf6a87;    /* 7. 娱乐/休闲：低饱和柔玫 */

  --overlay-bg: rgba(246, 247, 249, 0.72);
  --focus-bg: rgba(255, 255, 255, 0.94);

  --shadow-card: 0 1px 2px rgba(17, 19, 24, 0.03);
  --shadow-active: 0 1px 3px rgba(17, 19, 24, 0.06), 0 1px 1px rgba(17, 19, 24, 0.03);
  --shadow-popover: 0 14px 36px rgba(17, 19, 24, 0.12), 0 0 0 1px rgba(17, 19, 24, 0.06);
  --shadow-modal: 0 24px 64px rgba(17, 19, 24, 0.14), 0 0 0 1px rgba(17, 19, 24, 0.06);

  --radius-2xl: 20px;
  --radius-xl: 14px;
  --radius-lg: 12px;
  --radius-md: 9px;
  --radius-sm: 7px;
  --radius-pill: 999px;

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

html.dark {
  --bg-app: #080a0f;
  --bg-sidebar: #0e1118;
  --bg-main: #0b0d12;
  --bg-surface: #131722;
  --bg-subtle: #1b2130;
  --bg-hover: #22293b;
  --bg-track: #1f2636;

  --border: #232a3b;
  --border-hover: #333e56;
  --border-strong: #435170;

  --ink-primary: #f3f4f6;
  --ink-secondary: #a1aab8;
  --ink-muted: #667289;
  --ink-inverse: #0b0d12;

  --blue-primary: #3b82f6;
  --blue-hover: #60a5fa;
  --blue-mid: #2563eb;
  --blue-soft: #1d4ed8;
  --blue-light: rgba(59, 130, 246, 0.24);
  --blue-tint: rgba(59, 130, 246, 0.13);
  --blue-ring: rgba(59, 130, 246, 0.34);

  --cat-sleep: #64748b;
  --cat-meal: #e0913d;
  --cat-rest: #34b3a3;
  --cat-work: #3b82f6;
  --cat-exercise: #38bdf8;
  --cat-wash: #9385f5;
  --cat-leisure: #df7d98;

  --overlay-bg: rgba(8, 10, 15, 0.74);
  --focus-bg: rgba(11, 13, 18, 0.96);

  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-active: 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-popover: 0 18px 42px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --shadow-modal: 0 28px 72px rgba(0, 0, 0, 0.62), 0 0 0 1px rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-primary);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  overflow: hidden;
}
.tnum { font-variant-numeric: tabular-nums; }
button, input, textarea, select { font: inherit; color: inherit; outline: none; }
button { cursor: pointer; border: none; background: transparent; }

/* ==================== 桌面骨架 & 模糊动效 ==================== */
.app-shell {
  display: grid;
  grid-template-columns: 234px 1fr;
  height: 100vh;
  max-width: 1700px;
  margin: 0 auto;
  background: var(--bg-main);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  transition: filter 0.42s var(--ease-out-expo), transform 0.42s var(--ease-out-expo);
  will-change: filter, transform;
}
.app-shell.blurred {
  filter: blur(11px) saturate(0.92);
  transform: scale(0.992);
  pointer-events: none;
  user-select: none;
}

/* ==================== 左侧栏 ==================== */
.sidebar {
  display: flex; flex-direction: column;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 14px 12px 12px;
  gap: 12px;
  overflow-y: auto;
}

.brand-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 4px 6px;
}
.brand-left { display: flex; align-items: center; gap: 10px; }
.brand-avatar-wrap {
  width: 34px; height: 34px; border-radius: 11px;
  overflow: hidden; border: 1.5px solid var(--blue-light);
  background: var(--blue-tint); flex-shrink: 0;
  box-shadow: 0 3px 10px rgba(37, 99, 235, 0.14);
}
.brand-avatar-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
.brand-name { font-size: 14.5px; font-weight: 700; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--ink-muted); }

/* 独立的时间 / 星期 / 天气微件卡片 */
.ambient-widget {
  padding: 11px 12px;
  border-radius: var(--radius-lg);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  display: flex; flex-direction: column; gap: 6px;
}
.ambient-clock-row {
  display: flex; align-items: baseline; justify-content: space-between;
}
.ambient-time {
  font-size: 21px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.1;
  color: var(--ink-primary);
}
.ambient-weekday {
  font-size: 11.5px; font-weight: 600; color: var(--blue-primary);
  background: var(--blue-tint); padding: 2px 7px; border-radius: var(--radius-pill);
}
.ambient-date-weather {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; color: var(--ink-secondary);
  padding-top: 5px; border-top: 1px dashed var(--border);
}
.weather-pill {
  display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--ink-primary);
}

.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); padding: 2px 8px; }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: var(--radius-md);
  color: var(--ink-secondary); border: 1px solid transparent;
  transition: all 0.15s ease;
}
.nav-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
.nav-item.active {
  background: var(--bg-surface); color: var(--ink-primary);
  font-weight: 600; border-color: var(--border); box-shadow: var(--shadow-active);
}
.nav-item-left { display: flex; align-items: center; gap: 9px; }
.nav-item svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.7; fill: none; color: var(--ink-muted); }
.nav-item.active svg { color: var(--blue-primary); }
.nav-pill {
  font-size: 11px; font-weight: 600; padding: 1px 7px;
  border-radius: var(--radius-pill); background: var(--bg-subtle); color: var(--ink-secondary);
}
.nav-pill.blue { background: var(--blue-tint); color: var(--blue-primary); }

.side-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 11px 12px;
  display: flex; flex-direction: column; gap: 7px;
}
.side-card-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600; color: var(--ink-secondary);
}
.side-quick-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 6.5px 9px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 12px; font-weight: 500; color: var(--ink-primary);
  transition: all 0.15s ease;
}
.side-quick-btn:hover { border-color: var(--border-hover); background: var(--bg-subtle); }
.side-quick-btn.blue-accent {
  border-color: var(--blue-light); background: var(--blue-tint); color: var(--blue-primary);
}
.side-quick-btn .hint { font-size: 10.5px; color: var(--ink-muted); }

.progress-track { height: 5px; border-radius: var(--radius-pill); background: var(--bg-track); overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue-primary); border-radius: var(--radius-pill); transition: width 0.35s var(--ease-out-expo); }

.sidebar-footer {
  margin-top: auto; display: flex; align-items: center; justify-content: space-between;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.owner-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-secondary); }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-tint); }
.icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-surface);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-secondary); transition: all 0.15s ease;
}
.icon-btn:hover { border-color: var(--border-hover); color: var(--ink-primary); background: var(--bg-subtle); }
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.7; fill: none; }

/* ==================== 主区域与顶栏 ==================== */
.main-area {
  display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-app);
}
.active-timer-banner {
  display: none; align-items: center; justify-content: space-between;
  padding: 8px 24px; background: var(--ink-primary); color: var(--ink-inverse); font-size: 12.5px;
}
.active-timer-banner.visible { display: flex; animation: slideDown 0.28s var(--ease-out-expo); }
.banner-left { display: flex; align-items: center; gap: 10px; }
.pulse-dot {
  width: 8px; height: 8px; border-radius: 50%; background: var(--blue-mid);
  animation: pulseRing 1.6s infinite;
}
@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.65); }
  70% { box-shadow: 0 0 0 7px rgba(96, 165, 250, 0); }
  100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
}
.banner-actions { display: flex; align-items: center; gap: 8px; }
.banner-btn {
  padding: 4px 11px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600; background: var(--blue-primary); color: #ffffff;
}
.banner-btn.ghost { background: rgba(255, 255, 255, 0.15); color: var(--ink-inverse); }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 13px 24px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
  gap: 12px; flex-shrink: 0;
}
.topbar-left { display: flex; align-items: center; gap: 16px; }
.topbar-title { font-size: 18.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.topbar-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* 顶栏紧凑天气+日期胶囊 */
.topbar-ambient-pill {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 5px 11px; border-radius: var(--radius-pill);
  background: var(--bg-subtle); border: 1px solid var(--border);
  font-size: 12px; color: var(--ink-secondary);
}
.topbar-ambient-pill strong { color: var(--ink-primary); font-weight: 650; }

.segmented {
  display: inline-flex; padding: 3px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius-md); gap: 2px;
}
.seg-btn {
  padding: 5px 12px; border-radius: 6px;
  font-size: 12.5px; font-weight: 500; color: var(--ink-secondary);
  transition: all 0.15s ease;
}
.seg-btn.active {
  background: var(--bg-surface); color: var(--ink-primary);
  font-weight: 600; box-shadow: var(--shadow-active);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600; transition: all 0.16s ease; white-space: nowrap;
}
.btn-primary { background: var(--ink-primary); color: var(--ink-inverse); }
.btn-primary:hover { opacity: 0.9; transform: translateY(-0.5px); }
.btn-blue { background: var(--blue-primary); color: #ffffff; }
.btn-blue:hover { background: var(--blue-hover); transform: translateY(-0.5px); }
.btn-secondary { background: var(--bg-surface); color: var(--ink-primary); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--border-hover); background: var(--bg-subtle); }
.btn-tint { background: var(--blue-tint); color: var(--blue-primary); border: 1px solid var(--blue-light); }
.btn-tint:hover { background: var(--blue-light); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 11.5px; font-weight: 600; background: var(--bg-subtle); color: var(--ink-secondary);
}
.badge.blue { background: var(--blue-tint); color: var(--blue-primary); }

/* ==================== 主体内容区 ==================== */
.content-scroll { flex: 1; overflow-y: auto; padding: 18px 24px 36px; }
.workspace-grid {
  display: grid; grid-template-columns: minmax(0, 1.52fr) minmax(350px, 1fr);
  gap: 18px; align-items: start;
}
@media (max-width: 1180px) { .workspace-grid { grid-template-columns: 1fr; } }

.col-stack { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 16px 18px; box-shadow: var(--shadow-card);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
}
.card-title { font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 12px; color: var(--ink-muted); }

/* 昨日调整轻条 */
.adj-strip {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; background: var(--blue-tint);
  border: 1px solid var(--blue-light); border-left: 3px solid var(--blue-primary);
  border-radius: var(--radius-lg);
}
.adj-label { font-size: 11px; font-weight: 650; color: var(--blue-primary); }
.adj-text { font-size: 13px; font-weight: 600; color: var(--ink-primary); margin-top: 1px; }

/* ==================== 番茄专注钟 ==================== */
.pomo-card { display: flex; flex-direction: column; gap: 13px; }
.pomo-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pomo-task-editor {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 210px;
  padding: 6px 10px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: var(--bg-subtle); transition: all 0.16s ease;
}
.pomo-task-editor:focus-within {
  border-color: var(--blue-primary); background: var(--bg-surface); box-shadow: 0 0 0 3px var(--blue-ring);
}
.pomo-task-input { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 600; }
.pomo-body { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pomo-digits { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
.pomo-presets { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.preset-chip {
  padding: 4px 10px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 12px; font-weight: 600; color: var(--ink-secondary); transition: all 0.14s ease;
}
.preset-chip:hover { border-color: var(--border-hover); color: var(--ink-primary); }
.preset-chip.active { background: var(--blue-tint); border-color: var(--blue-primary); color: var(--blue-primary); }
.custom-min-wrap {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: var(--radius-pill);
  border: 1px dashed var(--border-strong); background: var(--bg-subtle); font-size: 12px;
}
.custom-min-wrap input { width: 36px; border: none; background: transparent; text-align: center; font-weight: 650; }

/* ==================== 每日习惯看板（此刻焦点新增小板块） ==================== */
.habit-board-grid {
  display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px;
}
@media (max-width: 720px) { .habit-board-grid { grid-template-columns: 1fr; } }
.habit-tile {
  display: flex; flex-direction: column; gap: 8px;
  padding: 11px 13px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  transition: all 0.16s ease;
}
.habit-tile.done { border-color: var(--blue-light); background: var(--blue-tint); }
.habit-tile-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.habit-name { font-size: 13.5px; font-weight: 650; color: var(--ink-primary); display: flex; align-items: center; gap: 6px; }
.habit-dots { display: flex; gap: 4px; align-items: center; }
.h-dot { width: 8px; height: 8px; border-radius: 3px; background: var(--bg-track); }
.h-dot.done { background: var(--blue-primary); }
.h-dot.partial { background: var(--blue-soft); }
.habit-state-bar { display: flex; gap: 4px; }
.h-pill {
  flex: 1; padding: 4px 0; border-radius: 6px;
  font-size: 11.5px; font-weight: 600; color: var(--ink-secondary);
  background: var(--bg-subtle); border: 1px solid transparent; transition: all 0.14s ease;
}
.h-pill:hover { border-color: var(--border-hover); color: var(--ink-primary); }
.h-pill.active-done { background: var(--ink-primary); color: var(--ink-inverse); }
.h-pill.active-partial { background: var(--blue-light); color: var(--blue-primary); border-color: var(--blue-soft); }
.h-pill.active-missed { background: var(--bg-track); color: var(--ink-primary); border-color: var(--border-strong); }

/* ==================== 临时离开座位一键计时（含 7 类映射） ==================== */
.away-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
@media (max-width: 900px) { .away-grid { grid-template-columns: repeat(3, 1fr); } }
.away-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 5px;
  padding: 10px 11px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  text-align: left; transition: all 0.16s ease;
}
.away-btn:hover { border-color: var(--blue-primary); background: var(--blue-tint); transform: translateY(-1px); }
.away-dot { width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
.away-title { font-size: 13px; font-weight: 650; color: var(--ink-primary); }
.away-meta { font-size: 11px; color: var(--ink-muted); }

/* ==================== 今日待办队列 ==================== */
.task-add-row { display: flex; gap: 8px; margin-bottom: 10px; }
.input-field {
  flex: 1; padding: 8px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-subtle);
  font-size: 13px; color: var(--ink-primary); transition: all 0.15s ease;
}
.input-field:focus { background: var(--bg-surface); border-color: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-ring); }
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 9px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-surface); transition: all 0.15s ease;
}
.task-row:hover { border-color: var(--border-hover); }
.task-row.focused-task { border-color: var(--blue-light); background: var(--blue-tint); }
.task-left { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; cursor: pointer; }
.checkbox {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--border-strong); background: var(--bg-surface);
  display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.checkbox.checked { background: var(--ink-primary); border-color: var(--ink-primary); color: var(--ink-inverse); }
.task-text { font-size: 13.5px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.done-divider {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 0 7px; font-size: 11.5px; font-weight: 600; color: var(--ink-muted);
}
.done-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.task-row.done-row { background: var(--bg-subtle); border-color: transparent; cursor: pointer; }
.task-row.done-row:hover { border-color: var(--border-hover); background: var(--bg-hover); }
.task-row.done-row .task-text { color: var(--ink-muted); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.restore-hint { font-size: 11px; color: var(--blue-primary); opacity: 0; transition: opacity 0.14s ease; }
.task-row.done-row:hover .restore-hint { opacity: 1; }

/* ==================== 右侧 Claude Chat 风格灵儿对话窗 ==================== */
.claude-chat-card {
  display: flex; flex-direction: column;
  height: calc(100vh - 104px); min-height: 540px; max-height: 860px;
  padding: 0; overflow: hidden;
  position: sticky; top: 0;
}
.chat-head {
  padding: 13px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-surface);
}
.linger-chat-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  overflow: hidden; border: 1.5px solid var(--blue-light);
  background: var(--blue-tint); flex-shrink: 0;
}
.linger-chat-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

.chat-stream {
  flex: 1; overflow-y: auto; padding: 16px;
  display: flex; flex-direction: column; gap: 18px;
}

/* Claude 风格消息单元 */
.c-msg { display: flex; flex-direction: column; gap: 5px; }
.c-msg.user { align-items: flex-end; }
.c-msg.bot { align-items: flex-start; }

.c-msg-meta {
  display: flex; align-items: center; gap: 7px;
  font-size: 11px; color: var(--ink-muted);
}
.c-msg-meta strong { color: var(--ink-primary); font-weight: 650; font-size: 12px; }

.c-msg-user-box {
  max-width: 88%;
  padding: 10px 14px; border-radius: 16px 16px 4px 16px;
  background: var(--bg-subtle); color: var(--ink-primary);
  font-size: 13.5px; line-height: 1.6;
  border: 1px solid var(--border);
}
.c-msg-bot-wrap {
  display: flex; align-items: flex-start; gap: 10px; width: 100%;
}
.c-msg-bot-body {
  flex: 1; min-width: 0;
  font-size: 13.5px; line-height: 1.65; color: var(--ink-primary);
}
.extract-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 3px 9px; border-radius: var(--radius-pill);
  background: var(--blue-tint); color: var(--blue-primary);
  font-size: 11.5px; font-weight: 600; margin-bottom: 6px;
}

/* Claude 风格悬停操作条（复制 / 删除 / 朗读） */
.c-msg-actions {
  display: flex; align-items: center; gap: 4px;
  margin-top: 4px; opacity: 0.35; transition: opacity 0.16s ease;
}
.c-msg:hover .c-msg-actions { opacity: 1; }
.c-act-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 7px; border-radius: 6px;
  font-size: 11px; color: var(--ink-muted); transition: all 0.14s ease;
}
.c-act-btn:hover { background: var(--bg-subtle); color: var(--ink-primary); }
.c-act-btn.del:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
.c-act-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; }

/* 灵儿水晶思考加载动效 */
.thinking-row {
  display: flex; align-items: center; gap: 10px;
  padding: 8px 12px; border-radius: 12px;
  background: var(--blue-tint); border: 1px solid var(--blue-light);
  width: fit-content;
}
.crystal-loader { display: inline-flex; align-items: center; gap: 5px; }
.crystal-gem {
  width: 7px; height: 7px; background: var(--blue-primary);
  transform: rotate(45deg); border-radius: 1.5px;
  animation: gemWave 1.1s infinite ease-in-out;
}
.crystal-gem:nth-child(2) { animation-delay: 0.16s; background: var(--blue-mid); }
.crystal-gem:nth-child(3) { animation-delay: 0.32s; background: var(--blue-soft); }
@keyframes gemWave {
  0%, 80%, 100% { transform: rotate(45deg) scale(0.75); opacity: 0.45; }
  40% { transform: rotate(45deg) scale(1.22); opacity: 1; }
}
.thinking-text { font-size: 12px; font-weight: 600; color: var(--blue-primary); }

/* Claude 风格一体化底部输入盒 */
.claude-composer-wrap {
  padding: 12px 14px 14px; border-top: 1px solid var(--border); background: var(--bg-surface);
}
.claude-composer {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px 9px; border-radius: 14px;
  border: 1px solid var(--border-hover); background: var(--bg-subtle);
  transition: all 0.16s ease;
}
.claude-composer:focus-within {
  background: var(--bg-surface); border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-ring);
}
.claude-textarea {
  width: 100%; border: none; background: transparent; resize: none;
  font-size: 13.5px; line-height: 1.5; min-height: 36px; max-height: 100px;
}
.claude-composer-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.composer-tools { display: flex; align-items: center; gap: 5px; }
.tool-pill-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 5px 9px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 11.5px; font-weight: 600; color: var(--ink-secondary);
  transition: all 0.15s ease;
}
.tool-pill-btn:hover { border-color: var(--border-strong); color: var(--ink-primary); }
.tool-pill-btn.active-rec {
  background: var(--blue-primary); color: #ffffff; border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-ring);
}
.send-circle-btn {
  width: 30px; height: 30px; border-radius: 9px;
  background: var(--ink-primary); color: var(--ink-inverse);
  display: inline-flex; align-items: center; justify-content: center;
  transition: all 0.15s ease;
}
.send-circle-btn:hover { opacity: 0.88; transform: translateY(-1px); }

/* ==================== 24 小时横条分布图 & 串联时间轴 ==================== */
.bar-24h-wrap { position: relative; padding: 10px 0 4px; }
.bar-24h-track {
  position: relative; height: 34px; border-radius: 10px;
  background: var(--bg-track); border: 1px solid var(--border);
  overflow: visible;
}
.bar-24h-seg {
  position: absolute; top: 3px; bottom: 3px; border-radius: 6px;
  cursor: pointer; transition: transform 0.18s var(--ease-out-expo), filter 0.18s ease, box-shadow 0.18s ease;
  opacity: 0.92;
}
.bar-24h-seg:hover, .bar-24h-seg.highlighted {
  transform: scaleY(1.18); z-index: 5; opacity: 1;
  box-shadow: 0 4px 14px rgba(17, 19, 24, 0.22);
}
.bar-24h-axis {
  display: flex; justify-content: space-between;
  margin-top: 8px; font-size: 11px; color: var(--ink-muted);
}

.legend-row { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-secondary); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

/* 悬浮聚焦浮层 */
.hover-tooltip {
  position: fixed; z-index: 95; pointer-events: none;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 13px;
  box-shadow: var(--shadow-popover);
  min-width: 220px; max-width: 280px;
  opacity: 0; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.hover-tooltip.show { opacity: 1; transform: translateY(0); }

/* 从早到晚垂直串联时间轴 */
.vertical-timeline {
  position: relative; padding-left: 26px;
  display: flex; flex-direction: column; gap: 10px;
}
.vertical-timeline::before {
  content: ""; position: absolute; left: 9px; top: 14px; bottom: 14px;
  width: 2px; background: linear-gradient(180deg, var(--blue-light) 0%, var(--border) 50%, var(--blue-light) 100%);
  border-radius: 2px;
}
.vt-node {
  position: relative;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  transition: all 0.18s var(--ease-out-expo);
  cursor: pointer;
}
.vt-dot {
  position: absolute; left: -22px; top: 50%; transform: translateY(-50%);
  width: 12px; height: 12px; border-radius: 50%;
  border: 2.5px solid var(--bg-surface);
  box-shadow: 0 0 0 2px var(--border);
  transition: transform 0.18s var(--ease-out-expo), box-shadow 0.18s ease;
}
.vt-node:hover, .vt-node.highlighted {
  border-color: var(--blue-primary);
  background: var(--blue-tint);
  transform: translateX(4px);
  box-shadow: var(--shadow-active);
}
.vt-node:hover .vt-dot, .vt-node.highlighted .vt-dot {
  transform: translateY(-50%) scale(1.35);
  box-shadow: 0 0 0 4px var(--blue-ring);
}
.vt-time {
  font-size: 12px; font-weight: 700; min-width: 98px;
  padding: 3px 8px; border-radius: 6px; text-align: center;
  background: var(--bg-subtle); color: var(--ink-primary);
}
.vt-detail { display: none; font-size: 12px; color: var(--ink-secondary); margin-top: 3px; }
.vt-node:hover .vt-detail, .vt-node.highlighted .vt-detail { display: block; }

/* ==================== 多周期数据看板（周对比 & 月习惯日历） ==================== */
.week-stack-list { display: flex; flex-direction: column; gap: 10px; }
.week-day-row { display: grid; grid-template-columns: 76px 1fr 90px; align-items: center; gap: 12px; }
.week-stack-bar {
  display: flex; height: 22px; border-radius: 7px; overflow: hidden;
  background: var(--bg-track); gap: 1.5px;
}
.week-stack-seg { height: 100%; cursor: pointer; transition: opacity 0.15s ease; }
.week-stack-seg:hover { opacity: 0.82; }

/* 月度日历式习惯看板 */
.cal-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
  margin-bottom: 6px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ink-muted);
}
.cal-grid {
  display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px;
}
.cal-cell {
  min-height: 76px; padding: 8px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-surface);
  display: flex; flex-direction: column; justify-content: space-between;
  transition: all 0.15s ease; cursor: pointer;
}
.cal-cell:hover { border-color: var(--blue-primary); background: var(--blue-tint); transform: translateY(-1px); }
.cal-cell.today { border-color: var(--blue-primary); box-shadow: inset 0 0 0 1px var(--blue-primary); }
.cal-cell.empty { background: transparent; border-color: transparent; cursor: default; pointer-events: none; }
.cal-day-num { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 650; }
.cal-habit-dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cal-dot {
  width: 9px; height: 9px; border-radius: 3px; background: var(--bg-track);
}
.cal-dot.done { background: var(--blue-primary); }
.cal-dot.partial { background: var(--blue-soft); }

/* ==================== 早间仪式 / 晚间 90 秒主动汇报 / 实时语音浮层 ==================== */
.ritual-backdrop {
  position: fixed; inset: 0; z-index: 60;
  background: var(--overlay-bg);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity 0.35s var(--ease-out-expo);
}
.ritual-backdrop.open { opacity: 1; pointer-events: auto; }
.ritual-modal {
  width: 100%; max-width: 680px;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); box-shadow: var(--shadow-modal);
  overflow: hidden; transform: translateY(20px) scale(0.96);
  transition: transform 0.42s var(--ease-out-expo);
}
.ritual-backdrop.open .ritual-modal { transform: translateY(0) scale(1); }

.ritual-hero {
  padding: 18px 24px 16px;
  background: linear-gradient(180deg, var(--blue-tint) 0%, var(--bg-surface) 100%);
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 14px;
}
.linger-mascot-box {
  width: 66px; height: 66px; border-radius: 18px; overflow: hidden;
  background: var(--bg-surface); border: 1.5px solid var(--blue-light);
  box-shadow: 0 8px 22px rgba(37, 99, 235, 0.16);
  flex-shrink: 0; animation: floatGentle 3.2s ease-in-out infinite;
}
.linger-mascot-box img { width: 100%; height: 100%; object-fit: contain; display: block; }
@keyframes floatGentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.ritual-progress { display: flex; gap: 6px; padding: 14px 24px 0; }
.step-bar { flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--bg-track); cursor: pointer; }
.step-bar.done { background: var(--blue-primary); }
.step-bar.current { background: var(--ink-primary); }
.ritual-body { padding: 18px 24px 22px; animation: fadeSlideUp 0.25s var(--ease-out-expo); }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

.choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 12px; }
.choice-card {
  padding: 11px 14px; border-radius: var(--radius-lg);
  border: 1.5px solid var(--border); background: var(--bg-surface);
  display: flex; align-items: center; justify-content: space-between;
  font-size: 13.5px; font-weight: 550; transition: all 0.15s ease;
}
.choice-card:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.choice-card.selected { border-color: var(--blue-primary); background: var(--blue-tint); color: var(--blue-primary); font-weight: 650; }
.supplement-box {
  padding: 10px 13px; border-radius: var(--radius-lg);
  background: var(--bg-subtle); border: 1px solid var(--border); margin-bottom: 16px;
}
.supplement-input { width: 100%; border: none; background: transparent; font-size: 13px; }
.ritual-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

/* 90 秒晚间主动汇报专属样式 */
.brief-section {
  padding: 11px 14px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-subtle);
  transition: all 0.2s ease;
}
.brief-section.speaking {
  border-color: var(--blue-primary); background: var(--blue-tint);
  box-shadow: 0 0 0 3px var(--blue-ring);
}
.wave-bars { display: inline-flex; align-items: center; gap: 3px; height: 16px; }
.wave-bars span {
  width: 3px; border-radius: 3px; background: var(--blue-primary);
  animation: wavePulse 0.9s infinite ease-in-out;
}
.wave-bars span:nth-child(2) { animation-delay: 0.15s; }
.wave-bars span:nth-child(3) { animation-delay: 0.3s; }
.wave-bars span:nth-child(4) { animation-delay: 0.45s; }
@keyframes wavePulse { 0%, 100% { height: 4px; } 50% { height: 16px; } }

/* 全屏计时聚焦模式 */
.focus-overlay {
  position: fixed; inset: 0; z-index: 80;
  background: var(--focus-bg); backdrop-filter: blur(22px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px; opacity: 0; pointer-events: none; transform: scale(1.03);
  transition: opacity 0.36s var(--ease-out-expo), transform 0.42s var(--ease-out-expo);
}
.focus-overlay.open { opacity: 1; pointer-events: auto; transform: scale(1); }
.focus-topbar {
  position: absolute; top: 22px; left: 28px; right: 28px;
  display: flex; align-items: center; justify-content: space-between;
}
.focus-ring-wrap {
  position: relative; width: 272px; height: 272px;
  display: flex; align-items: center; justify-content: center; margin: 16px 0 22px;
}
.focus-ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--border); stroke-width: 5; }
.ring-progress { fill: none; stroke: var(--blue-primary); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
.focus-time-big { font-size: 58px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

/* 实时语音通话浮窗 */
.call-modal {
  position: fixed; inset: 0; z-index: 85;
  background: var(--overlay-bg); backdrop-filter: blur(18px);
  display: none; align-items: center; justify-content: center;
}
.call-modal.open { display: flex; }
.call-card {
  width: 360px; padding: 28px 24px; border-radius: 24px;
  background: var(--bg-surface); border: 1px solid var(--border);
  box-shadow: var(--shadow-modal); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.call-avatar-ring {
  width: 112px; height: 112px; border-radius: 50%; padding: 6px;
  background: var(--blue-tint); border: 2px solid var(--blue-primary);
  box-shadow: 0 0 0 10px var(--blue-ring);
  animation: pulseRing 2s infinite;
}
.call-avatar-ring img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(16px);
  z-index: 100; padding: 9px 16px; border-radius: var(--radius-pill);
  background: var(--ink-primary); color: var(--ink-inverse);
  font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none;
  transition: all 0.24s var(--ease-out-expo);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-shell" id="appShell">
  <!-- ==================== 左侧导航栏 ==================== -->
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-left">
        <div class="brand-avatar-wrap">
          <img src="../../frontend/public/linger/avatar_3d.png" alt="灵儿" onerror="this.style.display='none';this.parentNode.innerHTML='<div style=\'width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#2563eb\'>灵</div>'" />
        </div>
        <div>
          <div class="brand-name">灵儿管家</div>
          <div class="brand-sub">个人正循环 · v4 原型</div>
        </div>
      </div>
    </div>

    <!-- 独立的时间 · 星期 · 天气显示卡 -->
    <div class="ambient-widget">
      <div class="ambient-clock-row">
        <div class="ambient-time tnum" id="liveClock">09:24:15</div>
        <span class="ambient-weekday" id="liveWeekday">星期一</span>
      </div>
      <div class="ambient-date-weather">
        <span class="tnum" id="liveDate">11月23日</span>
        <span class="weather-pill" title="本地实时天气">☀ 晴 19°C · 优</span>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">核心视图</div>
      <button class="nav-item active" data-view="focus">
        <span class="nav-item-left">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
          此刻焦点
        </span>
        <span class="nav-pill blue tnum" id="navOpenTasksPill">3 待办</span>
      </button>
      <button class="nav-item" data-view="dashboard">
        <span class="nav-item-left">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 14v-4M12 14V8M17 14v-2"/></svg>
          数据看板与时间轴
        </span>
        <span class="nav-pill">日/周/月</span>
      </button>
    </div>

    <div class="side-card">
      <div class="side-card-head">
        <span>今日循环进度</span>
        <span class="tnum" id="sideProgressPct" style="color:var(--blue-primary)">68%</span>
      </div>
      <div style="font-size:11.5px;color:var(--ink-muted)" id="sideProgressDetail">习惯 2/4 · 专注 3h 55m</div>
      <div class="progress-track"><div class="progress-fill" id="sideProgressBar" style="width:68%"></div></div>
    </div>

    <div class="side-card">
      <div class="side-card-head">
        <span>原型主动触发体验</span>
        <span class="badge">演示</span>
      </div>
      <button class="side-quick-btn blue-accent" id="replayMorningBtn">
        <span>☀ 早间 5 问聚焦仪式</span>
        <span class="hint">模糊动效</span>
      </button>
      <button class="side-quick-btn blue-accent" id="triggerEveningReportBtn">
        <span>🌙 22:45 晚间 90s 汇报</span>
        <span class="hint">主动总结</span>
      </button>
      <button class="side-quick-btn" id="reopenPanelBtn">
        <span>↗ 模拟「重新打开面板」</span>
        <span class="hint">全屏计时</span>
      </button>
    </div>

    <div class="sidebar-footer">
      <div class="owner-status">
        <span class="online-dot"></span>
        <span>主人 · 在线</span>
      </div>
      <button class="icon-btn" id="toggleThemeBtn" title="切换浅色 / 暗色">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </button>
    </div>
  </aside>

function showToast(msg) {

function toMinutes(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}
function logDuration(log) {
  return Math.max(1, toMinutes(log.end) - toMinutes(log.start));
}
function formatDur(mins) {
  if (mins < 60) return `${mins}m`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h}h ${m}m` : `${h}h`;
}
function formatMMSS(sec) {
  const s = Math.max(0, Math.floor(sec));
  return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
}
function nowHHMM() {
  const d = new Date();
  return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}

  const hh = String(now.getHours()).padStart(2, "0");
  const mm = String(now.getMinutes()).padStart(2, "0");
  const ss = String(now.getSeconds()).padStart(2, "0");
  const m = now.getMonth() + 1;
  const d = now.getDate();
  const wd = weekdays[now.getDay()];
  $("#liveClock").textContent = `${hh}:${mm}:${ss}`;
  $("#liveWeekday").textContent = wd;
  $("#liveDate").textContent = `${m}月${d}日`;

}

/* ==========================================================================
   全屏计时聚焦模式
   ========================================================================== */
function startTimedSession({ cat, label, title, timerMode, plannedMin }) {
  if (state.activeSession) {
    state.activeSession.minimized = false;
    syncFocusOverlay();
    return;
  }
  state.activeSession = {
    cat, label, title, timerMode,
    plannedSec: (plannedMin || 25) * 60,
    elapsedSec: 0,
    startedAt: nowHHMM(),
    paused: false,
    minimized: false
  };
  $("#focusLiveNote").value = "";
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.activeSession || state.activeSession.paused) return;
    state.activeSession.elapsedSec += 1;
    if (state.activeSession.timerMode === "countdown" && state.activeSession.elapsedSec >= state.activeSession.plannedSec) {
      finishActiveSession(); return;
    }
    updateFocusClockDom();
  }, 1000);
  syncFocusOverlay();
}

function updateFocusClockDom() {
  const s = state.activeSession;
  if (!s) return;
  const disp = s.timerMode === "countdown" ? Math.max(0, s.plannedSec - s.elapsedSec) : s.elapsedSec;
  const txt = formatMMSS(disp);
  $("#focusTimeBig").textContent = txt;
  $("#bannerClock").textContent = txt;
  $("#focusTimeSub").textContent = s.timerMode === "countdown"
    ? `倒计时 · 已专注 ${formatMMSS(s.elapsedSec)}`
    : `正计时自动记录中 · 触发于 ${s.startedAt}`;
  const ratio = s.timerMode === "countdown"
    ? Math.min(1, s.elapsedSec / Math.max(1, s.plannedSec))
    : Math.max(0.08, (s.elapsedSec % 60) / 60);
  $("#focusRingProgress").style.strokeDashoffset = String(791.68 * (1 - ratio));
}

function syncFocusOverlay() {
  const s = state.activeSession;
  const overlay = $("#focusOverlay");
  const banner = $("#activeTimerBanner");
  const shell = $("#appShell");
  if (!s) {
    overlay.classList.remove("open");
    banner.classList.remove("visible");
    if (!state.modalMode) shell.classList.remove("blurred");
    return;
  }
  $("#focusEventTitle").textContent = s.title;
  $("#focusStartedPill").textContent = `触发时间 ${s.startedAt} · ${CATEGORIES[s.cat].name}`;
  $("#focusPauseBtn").textContent = s.paused ? "▶ 继续" : "⏸ 暂停";
  $("#bannerLabel").textContent = `${CATEGORIES[s.cat].name} · ${s.title}`;
  $("#bannerStartedAt").textContent = `触发于 ${s.startedAt}`;
  updateFocusClockDom();

  if (s.minimized) {
    overlay.classList.remove("open");
    banner.classList.add("visible");
    if (!state.modalMode) shell.classList.remove("blurred");
  } else {
    overlay.classList.add("open");
    banner.classList.remove("visible");
    shell.classList.add("blurred");
  }
}

function finishActiveSession() {
  const s = state.activeSession;
  if (!s) return;
  clearInterval(timerInterval);
  const mins = Math.max(1, Math.round(s.elapsedSec / 60) || 10);
  const startMin = toMinutes(s.startedAt);
  const endMin = Math.min(23 * 60 + 59, startMin + mins);
  const endStr = `${String(Math.floor(endMin / 60)).padStart(2, "0")}:${String(endMin % 60).padStart(2, "0")}`;
  const note = $("#focusLiveNote").value.trim() || `${CATEGORIES[s.cat].name}自动计时完成`;

  state.timeLogs.push({ id: "l_" + Date.now(), cat: s.cat, title: s.title, start: s.startedAt, end: endStr, note });
  state.timeLogs.sort((a, b) => toMinutes(a.start) - toMinutes(b.start));
  state.chat.push({
    id: "m_" + Date.now(), role: "bot", time: nowHHMM(),
    extracted: `${CATEGORIES[s.cat].name} · ${mins} 分钟 (${s.startedAt}–${endStr})`,
    text: `已将「${s.title}」的 ${mins} 分钟自动写入 24 小时时间轴和今晚的数据汇报里啦！`
  });
  state.activeSession = null;
  syncFocusOverlay();
  renderAll();
  showToast(`已入账：${s.title}（${mins} 分钟）`);
}

                    <button class="c-act-btn" data-copy-msg="${m.id}">
                      <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>

                <button type="button" class="tool-pill-btn ${state.chatVoiceRec ? "active-rec" : ""}" id="voiceInputBtn">

function bindFocusViewEvents() {
  $("#adjDoneBtn")?.addEventListener("click", () => {
    state.yesterday.adjustmentStatus = state.yesterday.adjustmentStatus === "done" ? "pending" : "done";
    renderMain();
  });
  $("#pomoTaskNameInput")?.addEventListener("input", (e) => { state.pomo.customTaskName = e.target.value; });
  $$("[data-pomo-mode]").forEach((b) => b.addEventListener("click", () => { state.pomo.mode = b.dataset.pomoMode; renderMain(); }));
  $$("[data-pomo-min]").forEach((b) => b.addEventListener("click", () => { state.pomo.minutes = Number(b.dataset.pomoMin); renderMain(); }));
  $("#customMinInput")?.addEventListener("change", (e) => { state.pomo.minutes = Math.max(1, Math.min(180, Number(e.target.value) || 25)); renderMain(); });
  $("#startPomoBtn")?.addEventListener("click", () => {
    startTimedSession({ cat: "work", label: "学习 / 工作", title: state.pomo.customTaskName.trim() || "番茄专注", timerMode: state.pomo.mode, plannedMin: state.pomo.minutes });
  });

  // 习惯看板一键更新（并同步到本月今天格子）
  $$("[data-hid]").forEach((b) => b.addEventListener("click", () => {
    const h = state.habits.find((x) => x.id === b.dataset.hid);
    if (!h) return;
    h.status = b.dataset.hval;
    h.week[6] = h.status;
    const todayCell = MONTH_CAL_DATA.find((d) => d.isToday);
    if (todayCell) todayCell.habits[h.id] = h.status;
    renderMain();
    showToast(`「${h.title}」已标记为：${h.status === "done" ? "完成" : (h.status === "partial" ? "部分完成" : "未做")}`);
  }));
  $("#gotoHabitCalBtn")?.addEventListener("click", () => { state.view = "dashboard"; state.dashPeriod = "month"; renderMain(); });

  $$("[data-away]").forEach((b) => b.addEventListener("click", () => {
    const cat = b.dataset.away;
    const titles = { meal: "去吃饭", wash: "去洗漱", exercise: "去运动", rest: "去休息", leisure: "娱乐与休闲" };
    startTimedSession({ cat, label: CATEGORIES[cat].name, title: titles[cat], timerMode: "stopwatch" });
  }));

  $("#addTaskForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("#newTaskInput").value.trim();
    if (!v) return;
    state.tasks.unshift({ id: "t_" + Date.now(), title: v, done: false });
    renderMain();
  });
  $$("[data-toggle-task]").forEach((el) => el.addEventListener("click", () => {
    const t = state.tasks.find((x) => x.id === el.dataset.toggleTask);
    if (!t) return;
    t.done = !t.done;
    renderMain();
    showToast(t.done ? "已完成并移至底部（再点可恢复）" : "已恢复到待办队列");
  }));
  $$("[data-bind-task]").forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation();
    const t = state.tasks.find((x) => x.id === b.dataset.bindTask);
    if (t) { state.pomo.customTaskName = t.title; renderMain(); showToast("已填入番茄钟"); }
  }));

  // Claude Chat 操作：复制 / 删除 / 语音 / 实时通话 / 发送（带水晶加载动效）
  $$("[data-copy-msg]").forEach((b) => b.addEventListener("click", () => {
    const m = state.chat.find((x) => x.id === b.dataset.copyMsg);
    if (m) { navigator.clipboard?.writeText(m.text); showToast("已复制该条对话内容"); }
  }));
  $$("[data-del-msg]").forEach((b) => b.addEventListener("click", () => {
    state.chat = state.chat.filter((x) => x.id !== b.dataset.delMsg);
    renderMain(); showToast("已删除该条消息");
  }));

  $("#voiceInputBtn")?.addEventListener("click", () => {
    if (!state.chatVoiceRec) {
      state.chatVoiceRec = true; renderMain();
      setTimeout(() => {
        if (!state.chatVoiceRec) return;
        state.chatVoiceRec = false;
        renderMain();
        const ta = $("#claudeInput");
        if (ta) { ta.value = "刚练习了 15 分钟英语口语，感觉今天开口顺畅多了！"; ta.focus(); }
        showToast("语音已转为文字，可直接发送");
      }, 1400);
    } else {
      state.chatVoiceRec = false; renderMain();
    }
  });

  const openCall = () => { state.callOpen = true; renderCallModal(); };
  $("#openCallBtn")?.addEventListener("click", openCall);
  $("#openCallFromHeadBtn")?.addEventListener("click", openCall);

  const sendChat = () => {
    const ta = $("#claudeInput");
    const txt = ta?.value.trim();
    if (!txt || state.chatThinking) return;
    state.chat.push({ id: "m_" + Date.now(), role: "user", time: nowHHMM(), text: txt });
    state.chatThinking = true;
    renderMain();
    scrollChatBottom();

    // 优雅的 900ms 思考加载动效，再给出结构化捕捉回复
    setTimeout(() => {
      state.chatThinking = false;
      let extracted = "已随手记录";
      let reply = "收到啦主人！我已经记进今天的清单和上下文里了，晚上汇报的时候会一起帮你算进去。";
      if (/口语|跟读/.test(txt)) {
        const h = state.habits.find((x) => x.id === "h_speak");
        if (h) { h.status = "done"; h.week[6] = "done"; }
        extracted = "习惯 · 每日练习口语（已完成）";
        reply = "太棒啦！我顺手帮你把左侧习惯看板里的「每日练习口语」标成完成啦，继续保持这份手感！";
      } else if (/阅读|看书/.test(txt)) {
        const h = state.habits.find((x) => x.id === "h_read");
        if (h) { h.status = "done"; h.week[6] = "done"; }
        extracted = "习惯 · 每日阅读（已完成）";
        reply = "已将「每日阅读」记为完成！晚上 10:45 汇报时我会把今天的阅读收获一起整理出来。";
      } else if (/汇报|总结/.test(txt)) {
        extracted = "呼出今日 90 秒汇总汇报";
        reply = "好嘞，马上为你展开今天的 90 秒数据分析汇报～";
        state.modalMode = "evening_report";
      }
      state.chat.push({ id: "m_" + (Date.now() + 1), role: "bot", time: nowHHMM(), extracted, text: reply });
      renderAll();
      scrollChatBottom();
    }, 950);
  };

  $("#claudeChatForm")?.addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });
  $("#claudeInput")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
}

function scrollChatBottom() {
  setTimeout(() => { const s = $("#chatStream"); if (s) s.scrollTop = s.scrollHeight; }, 30);
}

          <div class="cal-cell empty"></div>
          <div class="cal-cell empty"></div>
          <div class="cal-cell empty"></div>
          <div class="cal-cell empty"></div>
          ${MONTH_CAL_DATA.map((d) => {
            const visibleHabits = state.monthHabitFilter === "all"
              ? state.habits
              : state.habits.filter((h) => h.id === state.monthHabitFilter);
            const doneCount = visibleHabits.filter((h) => d.habits[h.id] === "done").length;
            const summaryTip = d.isFuture
              ? `11月${d.day}日（未来）`
              : `11月${d.day}日：` + visibleHabits.map((h) => `${h.title}(${d.habits[h.id] === "done" ? "完成" : (d.habits[h.id] === "partial" ? "部分" : "未做")})`).join(" · ");
            return `
              <div class="cal-cell ${d.isToday ? "today" : ""}" title="${summaryTip}" data-cal-day="${d.day}">
                <div class="cal-day-num tnum">
                  <span>${d.day}${d.isToday ? " · 今" : ""}</span>
                  ${!d.isFuture ? `<span style="font-size:10.5px;color:${doneCount === visibleHabits.length ? "var(--blue-primary)" : "var(--ink-muted)"}">${doneCount}/${visibleHabits.length}</span>` : ""}
                </div>
                <div class="cal-habit-dots">
                  ${!d.isFuture ? visibleHabits.map((h) => `
                    <span class="cal-dot ${d.habits[h.id]}" title="${h.title}"></span>
                  `).join("") : `<span style="font-size:10.5px;color:var(--ink-muted)">—</span>`}
                </div>
              </div>
            `;
          }).join("")}
        </div>
      </section>
    `;
  }

  $("#mainContent").innerHTML = `
    <div class="col-stack" style="max-width:1120px;">
      <div style="display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;">
        <div class="segmented">
          <button class="seg-btn ${state.dashPeriod === "day" ? "active" : ""}" data-dash-period="day">今日 24h 与时间轴</button>
          <button class="seg-btn ${state.dashPeriod === "week" ? "active" : ""}" data-dash-period="week">本周时间追踪</button>
          <button class="seg-btn ${state.dashPeriod === "month" ? "active" : ""}" data-dash-period="month">本月习惯日历</button>
        </div>
        <div style="font-size:12px;color:var(--ink-muted);">所有 7 类颜色均遵循统一克制低饱和色系</div>
      </div>
      ${periodHtml}
    </div>
  `;

  bindDashboardEvents();
}

function bindDashboardEvents() {
  $$("[data-dash-period]").forEach((b) => b.addEventListener("click", () => {
    state.dashPeriod = b.dataset.dashPeriod; renderMain();
  }));
  $$("[data-cal-filter]").forEach((b) => b.addEventListener("click", () => {
    state.monthHabitFilter = b.dataset.calFilter; renderMain();
  }));
  $("#dashTriggerEveningBtn")?.addEventListener("click", () => {
    state.modalMode = "evening_report"; state.eveningSec = 0; renderModal();
  });

  // 24h 横条与下方串联时间轴双向悬浮聚焦
  const tooltip = $("#hoverTooltip");
  const setHighlight = (id) => {
    $$("[data-log-id]").forEach((el) => el.classList.toggle("highlighted", el.dataset.logId === id));
  };

  $$("#bar24hTrack [data-log-id]").forEach((seg) => {
    seg.addEventListener("mouseenter", (e) => {
      const log = state.timeLogs.find((x) => x.id === seg.dataset.logId);
      if (!log) return;
      setHighlight(log.id);
      const c = CATEGORIES[log.cat];
      tooltip.innerHTML = `
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span class="legend-swatch" style="background:${c.color}"></span>
          <strong style="font-size:12.5px;">${c.name}</strong>
          <span class="tnum" style="margin-left:auto;font-size:11.5px;color:var(--blue-primary);font-weight:700;">${log.start} – ${log.end}</span>
        </div>
        <div style="font-size:13.5px;font-weight:650;margin-bottom:3px;">${escapeHtml(log.title)}</div>
        <div style="font-size:11.5px;color:var(--ink-secondary);">用时 ${formatDur(logDuration(log))} · ${escapeHtml(log.note || "")}</div>
      `;
      tooltip.classList.add("show");
      positionTooltip(e);
    });
    seg.addEventListener("mousemove", positionTooltip);
    seg.addEventListener("mouseleave", () => {
      setHighlight(null);
      tooltip.classList.remove("show");
    });
    seg.addEventListener("click", () => {
      const node = $(`#verticalTimeline [data-log-id="${seg.dataset.logId}"]`);
      node?.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });

  $$("#verticalTimeline [data-log-id]").forEach((node) => {
    node.addEventListener("mouseenter", () => setHighlight(node.dataset.logId));
    node.addEventListener("mouseleave", () => setHighlight(null));
  });
}

function positionTooltip(e) {
  const tip = $("#hoverTooltip");
  const x = Math.min(window.innerWidth - 290, e.clientX + 14);
  const y = Math.max(14, e.clientY - 88);
  tip.style.left = `${x}px`;
  tip.style.top = `${y}px`;
}

function renderCallModal() {
  $("#callModal").classList.toggle("open", state.callOpen);
}

function renderAll() {
  renderMain();
  renderModal();
  syncFocusOverlay();
}

/* ==========================================================================
   全局绑定
   ========================================================================== */
$$("[data-view]").forEach((b) => b.addEventListener("click", () => { state.view = b.dataset.view; renderMain(); }));
$("#replayMorningBtn").addEventListener("click", () => {
  state.modalMode = "morning"; state.morningPhase = "questions"; state.qIndex = 0;
  state.greetingIdx = (state.greetingIdx + 1) % GREETINGS.length; renderModal();
});
const openEvening = () => { state.modalMode = "evening_report"; state.eveningSec = 0; renderModal(); };
$("#triggerEveningReportBtn").addEventListener("click", openEvening);
$("#topEveningBtn").addEventListener("click", openEvening);

$("#reopenPanelBtn").addEventListener("click", () => {
  if (state.activeSession) { state.activeSession.minimized = false; syncFocusOverlay(); showToast("检测到正在计时，已自动进入全屏聚焦模式"); }
  else showToast("当前没有运行中的计时；先点「开始专注」或「去吃饭」再试");
});
$("#toggleThemeBtn").addEventListener("click", () => {
  state.dark = !state.dark; document.documentElement.classList.toggle("dark", state.dark);
});

$("#minimizeFocusBtn").addEventListener("click", () => { if (state.activeSession) { state.activeSession.minimized = true; syncFocusOverlay(); } });
$("#bannerResumeFullBtn").addEventListener("click", () => { if (state.activeSession) { state.activeSession.minimized = false; syncFocusOverlay(); } });
$("#bannerStopBtn").addEventListener("click", finishActiveSession);
$("#focusPauseBtn").addEventListener("click", () => { if (state.activeSession) { state.activeSession.paused = !state.activeSession.paused; syncFocusOverlay(); } });
$("#focusFastForwardBtn").addEventListener("click", () => {
  if (!state.activeSession) return;
  state.activeSession.elapsedSec += 600;
  if (state.activeSession.timerMode === "countdown" && state.activeSession.elapsedSec >= state.activeSession.plannedSec) finishActiveSession();
  else { updateFocusClockDom(); showToast("演示快进 +10 分钟"); }
});
$("#focusFinishBtn").addEventListener("click", finishActiveSession);

$("#simCallSpeakBtn").addEventListener("click", () => {
  $("#callSubtitle").textContent = "「听清啦！你刚刚运动了 30 分钟，我已经顺手帮你把『每日运动』标为完成了哦～」";
  const h = state.habits.find((x) => x.id === "h_sport");
  if (h) { h.status = "done"; h.week[6] = "done"; }
  renderMain();
});
$("#endCallBtn").addEventListener("click", () => { state.callOpen = false; renderCallModal(); showToast("实时语音通话已结束，记录已自动归档"); });

// 首次打开先展示早间聚焦仪式（可在原型里点跳过或答完 5 问）
state.modalMode = "morning";
renderAll();
</script>
</body>
</html>
