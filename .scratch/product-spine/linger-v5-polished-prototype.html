<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵儿 v5 · 高清萌宠头像、Two-tone 图标与 Dissolve 待办动效原型（PROTOTYPE）</title>
<style>
/* ==========================================================================
   灵儿 v5 · 白 / 蓝 / 黑 主基调 + 统一 Two-tone 图标 + Dissolve TaskCheck 动效
   ========================================================================== */
:root {
  --bg-app: #f6f7f9;
  --bg-sidebar: #fafafb;
  --bg-main: #ffffff;
  --bg-surface: #ffffff;
  --bg-subtle: #f2f4f7;
  --bg-hover: #eef1f5;
  --bg-track: #e9ecf1;

  --border: #e6e8ec;
  --border-hover: #cfd5df;
  --border-strong: #bfc7d5;

  --ink-primary: #111318;
  --ink-secondary: #4b5563;
  --ink-muted: #8a94a6;
  --ink-inverse: #ffffff;

  --blue-primary: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-mid: #60a5fa;
  --blue-soft: #93c5fd;
  --blue-light: #dbeafe;
  --blue-tint: #eff6ff;
  --blue-ring: rgba(37, 99, 235, 0.20);

  /* 7 大时间分类 · 统一克制低饱和色系（含 Two-tone 柔填充色） */
  --cat-sleep: #475569;      --cat-sleep-soft: rgba(71, 85, 105, 0.16);
  --cat-meal: #d9822b;       --cat-meal-soft: rgba(217, 130, 43, 0.17);
  --cat-rest: #2a9d8f;       --cat-rest-soft: rgba(42, 157, 143, 0.16);
  --cat-work: #2563eb;       --cat-work-soft: rgba(37, 99, 235, 0.15);
  --cat-exercise: #0284c7;   --cat-exercise-soft: rgba(2, 132, 199, 0.16);
  --cat-wash: #7c6cf0;       --cat-wash-soft: rgba(124, 108, 240, 0.16);
  --cat-leisure: #cf6a87;    --cat-leisure-soft: rgba(207, 106, 135, 0.16);

  --overlay-bg: rgba(246, 247, 249, 0.72);
  --focus-bg: rgba(255, 255, 255, 0.94);

  --shadow-card: 0 1px 2px rgba(17, 19, 24, 0.03);
  --shadow-active: 0 1px 3px rgba(17, 19, 24, 0.06), 0 1px 1px rgba(17, 19, 24, 0.03);
  --shadow-popover: 0 14px 36px rgba(17, 19, 24, 0.12), 0 0 0 1px rgba(17, 19, 24, 0.06);
  --shadow-modal: 0 24px 64px rgba(17, 19, 24, 0.14), 0 0 0 1px rgba(17, 19, 24, 0.06);

  --radius-2xl: 20px;
  --radius-xl: 14px;
  --radius-lg: 12px;
  --radius-md: 9px;
  --radius-sm: 7px;
  --radius-pill: 999px;

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

html.dark {
  --bg-app: #080a0f;
  --bg-sidebar: #0e1118;
  --bg-main: #0b0d12;
  --bg-surface: #131722;
  --bg-subtle: #1b2130;
  --bg-hover: #22293b;
  --bg-track: #1f2636;

  --border: #232a3b;
  --border-hover: #333e56;
  --border-strong: #435170;

  --ink-primary: #f3f4f6;
  --ink-secondary: #a1aab8;
  --ink-muted: #667289;
  --ink-inverse: #0b0d12;

  --blue-primary: #3b82f6;
  --blue-hover: #60a5fa;
  --blue-mid: #2563eb;
  --blue-soft: #1d4ed8;
  --blue-light: rgba(59, 130, 246, 0.24);
  --blue-tint: rgba(59, 130, 246, 0.13);
  --blue-ring: rgba(59, 130, 246, 0.34);

  --cat-sleep: #64748b;      --cat-sleep-soft: rgba(100, 116, 139, 0.26);
  --cat-meal: #e0913d;       --cat-meal-soft: rgba(224, 145, 61, 0.24);
  --cat-rest: #34b3a3;       --cat-rest-soft: rgba(52, 179, 163, 0.24);
  --cat-work: #3b82f6;       --cat-work-soft: rgba(59, 130, 246, 0.24);
  --cat-exercise: #38bdf8;   --cat-exercise-soft: rgba(56, 189, 248, 0.24);
  --cat-wash: #9385f5;       --cat-wash-soft: rgba(147, 133, 245, 0.24);
  --cat-leisure: #df7d98;    --cat-leisure-soft: rgba(223, 125, 152, 0.24);

  --overlay-bg: rgba(8, 10, 15, 0.74);
  --focus-bg: rgba(11, 13, 18, 0.96);

  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-active: 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-popover: 0 18px 42px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);
  --shadow-modal: 0 28px 72px rgba(0, 0, 0, 0.62), 0 0 0 1px rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-primary);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  overflow: hidden;
}
.tnum { font-variant-numeric: tabular-nums; }
button, input, textarea, select { font: inherit; color: inherit; outline: none; }
button { cursor: pointer; border: none; background: transparent; }

/* 高清 Q 版灵儿头像：在浅色下自然融入白底，如参考图般灵动无僵硬边框；暗色下带柔和微光底 */
.linger-chibi {
  object-fit: contain;
  display: block;
  mix-blend-mode: multiply;
  transition: transform 0.25s var(--ease-spring);
}
html.dark .linger-chibi {
  mix-blend-mode: normal;
  border-radius: 50%;
  background: #ffffff;
  padding: 2px;
  box-shadow: 0 0 0 1.5px rgba(147, 197, 253, 0.35);
}

/* ==================== 桌面骨架 & 模糊动效 ==================== */
.app-shell {
  display: grid;
  grid-template-columns: 224px 1fr;
  height: 100vh;
  max-width: 1700px;
  margin: 0 auto;
  background: var(--bg-main);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  transition: filter 0.42s var(--ease-out-expo), transform 0.42s var(--ease-out-expo);
  will-change: filter, transform;
}
.app-shell.blurred {
  filter: blur(11px) saturate(0.92);
  transform: scale(0.992);
  pointer-events: none;
  user-select: none;
}

/* ==================== 左侧栏（已去除多余跳秒计时块，更加清爽） ==================== */
.sidebar {
  display: flex; flex-direction: column;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 14px 12px 12px;
  gap: 14px;
  overflow-y: auto;
}

.brand-row {
  display: flex; align-items: center; gap: 10px;
  padding: 4px 6px 8px;
  border-bottom: 1px solid var(--border);
}
.brand-chibi-wrap {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.brand-chibi-wrap img { width: 38px; height: 38px; }
.brand-name { font-size: 15px; font-weight: 700; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--ink-muted); }

.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-label { font-size: 11px; font-weight: 600; color: var(--ink-muted); padding: 2px 8px; }
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8.5px 10px; border-radius: var(--radius-md);
  color: var(--ink-secondary); border: 1px solid transparent;
  transition: all 0.15s ease;
}
.nav-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
.nav-item.active {
  background: var(--bg-surface); color: var(--ink-primary);
  font-weight: 600; border-color: var(--border); box-shadow: var(--shadow-active);
}
.nav-item-left { display: flex; align-items: center; gap: 9px; }
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-pill {
  font-size: 11px; font-weight: 600; padding: 1px 7px;
  border-radius: var(--radius-pill); background: var(--bg-subtle); color: var(--ink-secondary);
}
.nav-pill.blue { background: var(--blue-tint); color: var(--blue-primary); }

.side-card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); padding: 11px 12px;
  display: flex; flex-direction: column; gap: 7px;
}
.side-card-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600; color: var(--ink-secondary);
}
.side-quick-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 6.5px 9px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 12px; font-weight: 500; color: var(--ink-primary);
  transition: all 0.15s ease;
}
.side-quick-btn:hover { border-color: var(--border-hover); background: var(--bg-subtle); }
.side-quick-btn.blue-accent {
  border-color: var(--blue-light); background: var(--blue-tint); color: var(--blue-primary);
}
.side-quick-btn .hint { font-size: 10.5px; color: var(--ink-muted); }

.progress-track { height: 5px; border-radius: var(--radius-pill); background: var(--bg-track); overflow: hidden; }
.progress-fill { height: 100%; background: var(--blue-primary); border-radius: var(--radius-pill); transition: width 0.35s var(--ease-out-expo); }

.sidebar-footer {
  margin-top: auto; display: flex; align-items: center; justify-content: space-between;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.owner-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-secondary); }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-tint); }
.icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-surface);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-secondary); transition: all 0.15s ease;
}
.icon-btn:hover { border-color: var(--border-hover); color: var(--ink-primary); background: var(--bg-subtle); }
.icon-btn svg { width: 15px; height: 15px; }

/* ==================== 主区域与重新布局的时间·日期·天气顶栏 ==================== */
.main-area {
  display: flex; flex-direction: column; height: 100vh; overflow: hidden; background: var(--bg-app);
}
.active-timer-banner {
  display: none; align-items: center; justify-content: space-between;
  padding: 8px 24px; background: var(--ink-primary); color: var(--ink-inverse); font-size: 12.5px;
}
.active-timer-banner.visible { display: flex; animation: slideDown 0.28s var(--ease-out-expo); }
.banner-left { display: flex; align-items: center; gap: 10px; }
.pulse-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--blue-mid); animation: pulseRing 1.6s infinite; }
@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.65); }
  70% { box-shadow: 0 0 0 7px rgba(96, 165, 250, 0); }
  100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
}
.banner-actions { display: flex; align-items: center; gap: 8px; }
.banner-btn { padding: 4px 11px; border-radius: var(--radius-pill); font-size: 12px; font-weight: 600; background: var(--blue-primary); color: #ffffff; }
.banner-btn.ghost { background: rgba(255, 255, 255, 0.15); color: var(--ink-inverse); }

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 24px; background: var(--bg-surface); border-bottom: 1px solid var(--border);
  gap: 14px; flex-shrink: 0; flex-wrap: wrap;
}
.topbar-left { display: flex; align-items: center; gap: 18px; }
.topbar-title { font-size: 18.5px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.2; }
.topbar-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }

/* 重新优雅布局的时间 · 日期 · 星期 · 天气统一信息条（无令人困惑的跳秒） */
.datetime-weather-bar {
  display: inline-flex; align-items: center; gap: 12px;
  padding: 6px 13px; border-radius: var(--radius-lg);
  background: var(--bg-subtle); border: 1px solid var(--border);
}
.dtw-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-secondary); }
.dtw-item strong { color: var(--ink-primary); font-weight: 650; }
.dtw-sep { width: 1px; height: 14px; background: var(--border-strong); }

.topbar-right { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.segmented {
  display: inline-flex; padding: 3px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius-md); gap: 2px;
}
.seg-btn {
  padding: 5px 12px; border-radius: 6px;
  font-size: 12.5px; font-weight: 500; color: var(--ink-secondary);
  transition: all 0.15s ease;
}
.seg-btn.active { background: var(--bg-surface); color: var(--ink-primary); font-weight: 600; box-shadow: var(--shadow-active); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600; transition: all 0.16s ease; white-space: nowrap;
}
.btn-primary { background: var(--ink-primary); color: var(--ink-inverse); }
.btn-primary:hover { opacity: 0.9; transform: translateY(-0.5px); }
.btn-blue { background: var(--blue-primary); color: #ffffff; }
.btn-blue:hover { background: var(--blue-hover); transform: translateY(-0.5px); }
.btn-secondary { background: var(--bg-surface); color: var(--ink-primary); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--border-hover); background: var(--bg-subtle); }
.btn-tint { background: var(--blue-tint); color: var(--blue-primary); border: 1px solid var(--blue-light); }
.btn-tint:hover { background: var(--blue-light); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 11.5px; font-weight: 600; background: var(--bg-subtle); color: var(--ink-secondary);
}
.badge.blue { background: var(--blue-tint); color: var(--blue-primary); }

/* ==================== 主内容双栏布局 ==================== */
.content-scroll { flex: 1; overflow-y: auto; padding: 18px 24px 36px; }
.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.38fr) minmax(370px, 1fr);
  gap: 18px;
  align-items: start;
}
@media (max-width: 1180px) { .workspace-grid { grid-template-columns: 1fr; } }

.col-stack { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-xl); padding: 16px 18px; box-shadow: var(--shadow-card);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 12px; gap: 10px; flex-wrap: wrap;
}
.card-title { font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 12px; color: var(--ink-muted); }

/* 昨日调整轻条 */
.adj-strip {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; background: var(--blue-tint);
  border: 1px solid var(--blue-light); border-left: 3px solid var(--blue-primary);
  border-radius: var(--radius-lg);
}
.adj-label { font-size: 11px; font-weight: 650; color: var(--blue-primary); }
.adj-text { font-size: 13px; font-weight: 600; color: var(--ink-primary); margin-top: 1px; }

/* ==================== 番茄专注钟 ==================== */
.pomo-card { display: flex; flex-direction: column; gap: 13px; }
.pomo-top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.pomo-task-editor {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 210px;
  padding: 6px 10px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: var(--bg-subtle); transition: all 0.16s ease;
}
.pomo-task-editor:focus-within { border-color: var(--blue-primary); background: var(--bg-surface); box-shadow: 0 0 0 3px var(--blue-ring); }
.pomo-task-input { flex: 1; border: none; background: transparent; font-size: 14px; font-weight: 600; }
.pomo-body { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pomo-digits { font-size: 44px; font-weight: 700; line-height: 1; letter-spacing: -0.04em; }
.pomo-presets { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.preset-chip {
  padding: 4px 10px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 12px; font-weight: 600; color: var(--ink-secondary); transition: all 0.14s ease;
}
.preset-chip:hover { border-color: var(--border-hover); color: var(--ink-primary); }
.preset-chip.active { background: var(--blue-tint); border-color: var(--blue-primary); color: var(--blue-primary); }
.custom-min-wrap {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: var(--radius-pill);
  border: 1px dashed var(--border-strong); background: var(--bg-subtle); font-size: 12px;
}
.custom-min-wrap input { width: 36px; border: none; background: transparent; text-align: center; font-weight: 650; }

/* ==================== 临时离开座位一键计时（Kubai Two-tone 动效图标） ==================== */
.away-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; }
@media (max-width: 900px) { .away-grid { grid-template-columns: repeat(3, 1fr); } }
.away-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 7px;
  padding: 12px 12px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  text-align: left; transition: all 0.18s var(--ease-out-expo);
}
.away-btn:hover {
  border-color: var(--border-strong);
  background: var(--bg-subtle);
  transform: translateY(-2px);
  box-shadow: var(--shadow-active);
}
.duotone-icon-box {
  width: 34px; height: 34px; border-radius: 10px;
  display: inline-flex; align-items: center; justify-content: center;
  transition: transform 0.28s var(--ease-spring);
}
.away-btn:hover .duotone-icon-box {
  transform: scale(1.1) rotate(-4deg);
}
.duotone-icon-box svg { width: 20px; height: 20px; }
.away-title { font-size: 13px; font-weight: 650; color: var(--ink-primary); }
.away-meta { font-size: 11px; color: var(--ink-muted); }

/* ==================== 今日待办队列 · Dissolve TaskCheck 精确动效复刻 ==================== */
.task-add-row { display: flex; gap: 8px; margin-bottom: 12px; }
.input-field {
  flex: 1; padding: 8px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-subtle);
  font-size: 13px; color: var(--ink-primary); transition: all 0.15s ease;
}
.input-field:focus { background: var(--bg-surface); border-color: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-ring); }

.task-list { display: flex; flex-direction: column; }

/* 外层包裹器负责平滑高度折叠收起（gap closes） */
.tc-wrapper {
  overflow: hidden;
  max-height: 68px;
  margin-bottom: 6px;
  opacity: 1;
  transition: max-height 0.34s var(--ease-out-expo), margin-bottom 0.34s var(--ease-out-expo), opacity 0.28s ease;
}
.tc-wrapper.collapsing {
  max-height: 0 !important;
  margin-bottom: 0 !important;
  opacity: 0 !important;
}

.tc-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-surface);
  transition: border-color 0.18s ease, background 0.2s ease, transform 0.2s var(--ease-spring);
  user-select: none;
}
.tc-row:hover { border-color: var(--border-hover); }
.tc-row.focused-task { border-color: var(--blue-light); background: var(--blue-tint); }
.tc-row.is-settling {
  border-color: transparent;
  background: var(--bg-subtle);
}

.tc-left {
  display: flex; align-items: center; gap: 11px; flex: 1; min-width: 0;
  cursor: pointer;
}

/* Dissolve TaskCheck 弹性复选框 + 220ms SVG 绘钩 */
.tc-box {
  position: relative;
  width: 20px; height: 20px; border-radius: 6px;
  border: 1.75px solid var(--border-strong);
  background: var(--bg-surface);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background 0.2s ease, border-color 0.2s ease, transform 0.26s var(--ease-spring);
}
.tc-left:hover .tc-box { border-color: var(--ink-primary); }
.tc-box.checked {
  background: var(--ink-primary);
  border-color: var(--ink-primary);
  animation: tcBoxSpring 0.34s var(--ease-spring);
}
@keyframes tcBoxSpring {
  0% { transform: scale(1); }
  38% { transform: scale(0.82); }
  75% { transform: scale(1.14); }
  100% { transform: scale(1); }
}

.tc-check-svg { width: 13px; height: 13px; overflow: visible; }
.tc-check-path {
  fill: none;
  stroke: var(--ink-inverse);
  stroke-width: 2.3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 22;
  stroke-dashoffset: 22;
  transition: stroke-dashoffset 220ms cubic-bezier(0.22, 1, 0.36, 1) 40ms;
}
.tc-box.checked .tc-check-path {
  stroke-dashoffset: 0;
}

/* 文字上的真实扫过删除线（由左到右划过 + 渐灰） */
.tc-label {
  position: relative;
  display: inline-block;
  font-size: 13.5px; font-weight: 520;
  color: var(--ink-primary);
  transition: color 0.26s ease 80ms;
  max-width: 100%;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.tc-label::after {
  content: "";
  position: absolute; left: 0; top: 53%;
  width: 100%; height: 1.6px;
  background: var(--ink-muted);
  border-radius: 2px;
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 280ms cubic-bezier(0.22, 1, 0.36, 1) 80ms;
}
.tc-row.is-checked .tc-label,
.tc-row.done-row .tc-label {
  color: var(--ink-muted);
}
.tc-row.is-checked .tc-label::after,
.tc-row.done-row .tc-label::after {
  transform: scaleX(1);
}

.tc-undo-pill {
  font-size: 11px; font-weight: 600; color: var(--blue-primary);
  background: var(--blue-tint); padding: 2px 8px; border-radius: var(--radius-pill);
  animation: fadeInQuick 0.18s ease;
}
@keyframes fadeInQuick { from { opacity: 0; } to { opacity: 1; } }

.done-divider {
  display: flex; align-items: center; gap: 8px;
  margin: 12px 0 8px; font-size: 11.5px; font-weight: 600; color: var(--ink-muted);
}
.done-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.tc-row.done-row {
  background: var(--bg-subtle); border-color: transparent; cursor: pointer;
}
.tc-row.done-row:hover { border-color: var(--border-hover); background: var(--bg-hover); }
.restore-hint { font-size: 11px; color: var(--blue-primary); opacity: 0; transition: opacity 0.14s ease; }
.tc-row.done-row:hover .restore-hint { opacity: 1; }

/* ==================== 右侧上卡：Claude Chat 风格灵儿对话窗 ==================== */
.claude-chat-card {
  display: flex; flex-direction: column;
  height: 430px;
  padding: 0; overflow: hidden;
}
.chat-head {
  padding: 11px 15px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  background: var(--bg-surface);
}
.chat-head-avatar { width: 34px; height: 34px; flex-shrink: 0; }
.chat-head-avatar img { width: 34px; height: 34px; }

.chat-stream {
  flex: 1; overflow-y: auto; padding: 14px 15px;
  display: flex; flex-direction: column; gap: 15px;
}
.c-msg { display: flex; flex-direction: column; gap: 4px; }
.c-msg.user { align-items: flex-end; }
.c-msg.bot { align-items: flex-start; }

.c-msg-meta { display: flex; align-items: center; gap: 7px; font-size: 11px; color: var(--ink-muted); }
.c-msg-meta strong { color: var(--ink-primary); font-weight: 650; font-size: 12px; }

.c-msg-user-box {
  max-width: 88%; padding: 9px 13px; border-radius: 15px 15px 4px 15px;
  background: var(--bg-subtle); color: var(--ink-primary);
  font-size: 13px; line-height: 1.55; border: 1px solid var(--border);
}
.c-msg-bot-wrap { display: flex; align-items: flex-start; gap: 10px; width: 100%; }
.c-msg-bot-avatar {
  width: 34px; height: 34px; flex-shrink: 0; margin-top: 1px;
}
.c-msg-bot-avatar img { width: 34px; height: 34px; }
.c-msg-bot-body { flex: 1; min-width: 0; font-size: 13px; line-height: 1.62; color: var(--ink-primary); }
.extract-pill {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2.5px 9px; border-radius: var(--radius-pill);
  background: var(--blue-tint); color: var(--blue-primary);
  font-size: 11px; font-weight: 600; margin-bottom: 5px;
}

.c-msg-actions { display: flex; align-items: center; gap: 4px; margin-top: 3px; opacity: 0.35; transition: opacity 0.16s ease; }
.c-msg:hover .c-msg-actions { opacity: 1; }
.c-act-btn {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 2.5px 7px; border-radius: 6px; font-size: 11px; color: var(--ink-muted);
}
.c-act-btn:hover { background: var(--bg-subtle); color: var(--ink-primary); }
.c-act-btn.del:hover { color: #dc2626; background: rgba(220, 38, 38, 0.08); }
.c-act-btn svg { width: 12px; height: 12px; stroke: currentColor; stroke-width: 1.8; fill: none; }

/* 灵儿水晶思考加载动效 */
.thinking-row {
  display: flex; align-items: center; gap: 9px;
  padding: 7px 12px; border-radius: 12px;
  background: var(--blue-tint); border: 1px solid var(--blue-light); width: fit-content;
}
.crystal-loader { display: inline-flex; align-items: center; gap: 5px; }
.crystal-gem {
  width: 6.5px; height: 6.5px; background: var(--blue-primary);
  transform: rotate(45deg); border-radius: 1.5px;
  animation: gemWave 1.1s infinite ease-in-out;
}
.crystal-gem:nth-child(2) { animation-delay: 0.16s; background: var(--blue-mid); }
.crystal-gem:nth-child(3) { animation-delay: 0.32s; background: var(--blue-soft); }
@keyframes gemWave {
  0%, 80%, 100% { transform: rotate(45deg) scale(0.75); opacity: 0.45; }
  40% { transform: rotate(45deg) scale(1.22); opacity: 1; }
}
.thinking-text { font-size: 12px; font-weight: 600; color: var(--blue-primary); }

.claude-composer-wrap { padding: 10px 12px 12px; border-top: 1px solid var(--border); background: var(--bg-surface); }
.claude-composer {
  display: flex; flex-direction: column; gap: 7px;
  padding: 8px 11px; border-radius: 13px;
  border: 1px solid var(--border-hover); background: var(--bg-subtle); transition: all 0.16s ease;
}
.claude-composer:focus-within { background: var(--bg-surface); border-color: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-ring); }
.claude-textarea { width: 100%; border: none; background: transparent; resize: none; font-size: 13px; line-height: 1.45; min-height: 30px; max-height: 80px; }
.claude-composer-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.composer-tools { display: flex; align-items: center; gap: 5px; }
.tool-pill-btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 4px 9px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 11.5px; font-weight: 600; color: var(--ink-secondary);
}
.tool-pill-btn:hover { border-color: var(--border-strong); color: var(--ink-primary); }
.tool-pill-btn.active-rec { background: var(--blue-primary); color: #ffffff; border-color: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-ring); }
.send-circle-btn {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--ink-primary); color: var(--ink-inverse);
  display: inline-flex; align-items: center; justify-content: center; font-weight: 700;
}

/* ==================== 右侧下卡：每日习惯看板（在灵儿对话框下方！） ==================== */
.habit-panel-list { display: flex; flex-direction: column; gap: 8px; }
.habit-row-card {
  display: flex; flex-direction: column; gap: 8px;
  padding: 10px 12px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  transition: all 0.16s ease;
}
.habit-row-card.is-done {
  border-color: var(--blue-light);
  background: var(--blue-tint);
}
.habit-row-top {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
}
.habit-row-name { font-size: 13.5px; font-weight: 650; color: var(--ink-primary); display: flex; align-items: center; gap: 7px; }
.habit-row-right { display: flex; align-items: center; gap: 6px; }
.habit-dots { display: flex; gap: 3px; }
.h-dot { width: 7px; height: 7px; border-radius: 2.5px; background: var(--bg-track); }
.h-dot.done { background: var(--blue-primary); }

.habit-del-btn {
  width: 22px; height: 22px; border-radius: 6px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-muted); opacity: 0.4; transition: all 0.14s ease;
}
.habit-row-card:hover .habit-del-btn { opacity: 1; }
.habit-del-btn:hover { background: rgba(220, 38, 38, 0.1); color: #dc2626; }

/* 3 格紧凑控制栏：[完成] [未做] [数量/时长记录] */
.habit-controls-3 {
  display: grid; grid-template-columns: 1fr 1fr 1.25fr; gap: 6px;
}
.h-bin-btn {
  padding: 5px 0; border-radius: 7px;
  font-size: 12px; font-weight: 600;
  background: var(--bg-subtle); color: var(--ink-secondary);
  border: 1px solid transparent; transition: all 0.15s ease;
}
.h-bin-btn:hover { border-color: var(--border-hover); color: var(--ink-primary); }
.h-bin-btn.active-done { background: var(--ink-primary); color: var(--ink-inverse); }
.h-bin-btn.active-missed { background: var(--bg-surface); color: var(--ink-primary); border-color: var(--border-strong); }

.h-metric-box {
  display: flex; align-items: center; justify-content: center; gap: 3px;
  padding: 3px 6px; border-radius: 7px;
  background: var(--bg-surface); border: 1px solid var(--border);
  font-size: 12px; font-weight: 650; color: var(--blue-primary);
}
.h-metric-box:focus-within { border-color: var(--blue-primary); box-shadow: 0 0 0 2px var(--blue-ring); }
.h-metric-input {
  width: 38px; border: none; background: transparent;
  text-align: center; font-weight: 700; color: var(--ink-primary);
}
.h-metric-unit { font-size: 11.5px; color: var(--ink-muted); font-weight: 500; }

/* 自定义添加习惯折叠表单 */
.add-habit-form {
  display: none; flex-direction: column; gap: 8px;
  padding: 10px 11px; margin-bottom: 10px;
  border-radius: var(--radius-lg);
  background: var(--bg-subtle); border: 1px solid var(--border);
}
.add-habit-form.open { display: flex; animation: fadeSlideUp 0.2s var(--ease-out-expo); }
.add-habit-row { display: flex; gap: 6px; align-items: center; }

/* ==================== 数据看板（24h 横条 / 串联时间轴 / 周追踪 / 月日历） ==================== */
.bar-24h-wrap { position: relative; padding: 10px 0 4px; }
.bar-24h-track {
  position: relative; height: 34px; border-radius: 10px;
  background: var(--bg-track); border: 1px solid var(--border); overflow: visible;
}
.bar-24h-seg {
  position: absolute; top: 3px; bottom: 3px; border-radius: 6px;
  cursor: pointer; transition: transform 0.18s var(--ease-out-expo), box-shadow 0.18s ease; opacity: 0.92;
}
.bar-24h-seg:hover, .bar-24h-seg.highlighted {
  transform: scaleY(1.18); z-index: 5; opacity: 1; box-shadow: 0 4px 14px rgba(17, 19, 24, 0.22);
}
.bar-24h-axis { display: flex; justify-content: space-between; margin-top: 8px; font-size: 11px; color: var(--ink-muted); }
.legend-row { display: flex; flex-wrap: wrap; gap: 10px 16px; margin-top: 12px; }
.legend-item { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-secondary); }
.legend-swatch { width: 10px; height: 10px; border-radius: 3px; }

.hover-tooltip {
  position: fixed; z-index: 95; pointer-events: none;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px 13px; box-shadow: var(--shadow-popover);
  min-width: 220px; max-width: 280px; opacity: 0; transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}
.hover-tooltip.show { opacity: 1; transform: translateY(0); }

.vertical-timeline { position: relative; padding-left: 26px; display: flex; flex-direction: column; gap: 10px; }
.vertical-timeline::before {
  content: ""; position: absolute; left: 9px; top: 14px; bottom: 14px;
  width: 2px; background: linear-gradient(180deg, var(--blue-light) 0%, var(--border) 50%, var(--blue-light) 100%);
}
.vt-node {
  position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  transition: all 0.18s var(--ease-out-expo); cursor: pointer;
}
.vt-dot {
  position: absolute; left: -22px; top: 50%; transform: translateY(-50%);
  width: 12px; height: 12px; border-radius: 50%;
  border: 2.5px solid var(--bg-surface); box-shadow: 0 0 0 2px var(--border);
  transition: transform 0.18s var(--ease-out-expo), box-shadow 0.18s ease;
}
.vt-node:hover, .vt-node.highlighted {
  border-color: var(--blue-primary); background: var(--blue-tint); transform: translateX(4px); box-shadow: var(--shadow-active);
}
.vt-node:hover .vt-dot, .vt-node.highlighted .vt-dot { transform: translateY(-50%) scale(1.35); box-shadow: 0 0 0 4px var(--blue-ring); }
.vt-time { font-size: 12px; font-weight: 700; min-width: 98px; padding: 3px 8px; border-radius: 6px; text-align: center; background: var(--bg-subtle); }
.vt-detail { display: none; font-size: 12px; color: var(--ink-secondary); margin-top: 3px; }
.vt-node:hover .vt-detail, .vt-node.highlighted .vt-detail { display: block; }

.week-stack-list { display: flex; flex-direction: column; gap: 10px; }
.week-day-row { display: grid; grid-template-columns: 78px 1fr 90px; align-items: center; gap: 12px; }
.week-stack-bar { display: flex; height: 22px; border-radius: 7px; overflow: hidden; background: var(--bg-track); gap: 1.5px; }
.week-stack-seg { height: 100%; cursor: pointer; }

.cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; margin-bottom: 6px; text-align: center; font-size: 11.5px; font-weight: 600; color: var(--ink-muted); }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.cal-cell {
  min-height: 76px; padding: 8px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-surface);
  display: flex; flex-direction: column; justify-content: space-between; transition: all 0.15s ease; cursor: pointer;
}
.cal-cell:hover { border-color: var(--blue-primary); background: var(--blue-tint); }
.cal-cell.today { border-color: var(--blue-primary); box-shadow: inset 0 0 0 1px var(--blue-primary); }
.cal-cell.empty { background: transparent; border-color: transparent; pointer-events: none; }
.cal-day-num { display: flex; justify-content: space-between; align-items: center; font-size: 12px; font-weight: 650; }
.cal-habit-dots { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
.cal-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--bg-track); }
.cal-dot.done { background: var(--blue-primary); }

/* ==================== 早间仪式 / 晚间 90s 汇报 / 全屏计时 / 实时语音 ==================== */
.ritual-backdrop {
  position: fixed; inset: 0; z-index: 60; background: var(--overlay-bg);
  display: flex; align-items: center; justify-content: center; padding: 24px;
  opacity: 0; pointer-events: none; transition: opacity 0.35s var(--ease-out-expo);
}
.ritual-backdrop.open { opacity: 1; pointer-events: auto; }
.ritual-modal {
  width: 100%; max-width: 680px; background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); box-shadow: var(--shadow-modal); overflow: hidden;
  transform: translateY(20px) scale(0.96); transition: transform 0.42s var(--ease-out-expo);
}
.ritual-backdrop.open .ritual-modal { transform: translateY(0) scale(1); }
.ritual-hero {
  padding: 18px 24px 16px;
  background: linear-gradient(180deg, var(--blue-tint) 0%, var(--bg-surface) 100%);
  border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 14px;
}
.linger-mascot-box {
  width: 68px; height: 68px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  animation: floatGentle 3.2s ease-in-out infinite;
}
.linger-mascot-box img { width: 68px; height: 68px; }
@keyframes floatGentle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes fadeSlideUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

.ritual-progress { display: flex; gap: 6px; padding: 14px 24px 0; }
.step-bar { flex: 1; height: 4px; border-radius: var(--radius-pill); background: var(--bg-track); cursor: pointer; }
.step-bar.done { background: var(--blue-primary); }
.step-bar.current { background: var(--ink-primary); }
.ritual-body { padding: 18px 24px 22px; animation: fadeSlideUp 0.25s var(--ease-out-expo); }
.choice-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 9px; margin-bottom: 12px; }
.choice-card {
  padding: 11px 14px; border-radius: var(--radius-lg); border: 1.5px solid var(--border); background: var(--bg-surface);
  display: flex; align-items: center; justify-content: space-between; font-size: 13.5px; font-weight: 550;
}
.choice-card:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.choice-card.selected { border-color: var(--blue-primary); background: var(--blue-tint); color: var(--blue-primary); font-weight: 650; }
.supplement-box { padding: 10px 13px; border-radius: var(--radius-lg); background: var(--bg-subtle); border: 1px solid var(--border); margin-bottom: 16px; }
.supplement-input { width: 100%; border: none; background: transparent; font-size: 13px; }
.ritual-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; }

.brief-section { padding: 11px 14px; border-radius: var(--radius-lg); border: 1px solid var(--border); background: var(--bg-subtle); transition: all 0.2s ease; }
.brief-section.speaking { border-color: var(--blue-primary); background: var(--blue-tint); box-shadow: 0 0 0 3px var(--blue-ring); }
.wave-bars { display: inline-flex; align-items: center; gap: 3px; height: 16px; }
.wave-bars span { width: 3px; border-radius: 3px; background: var(--blue-primary); animation: wavePulse 0.9s infinite ease-in-out; }
.wave-bars span:nth-child(2) { animation-delay: 0.15s; }
.wave-bars span:nth-child(3) { animation-delay: 0.3s; }
.wave-bars span:nth-child(4) { animation-delay: 0.45s; }
@keyframes wavePulse { 0%, 100% { height: 4px; } 50% { height: 16px; } }

.focus-overlay {
  position: fixed; inset: 0; z-index: 80; background: var(--focus-bg); backdrop-filter: blur(22px);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 32px; opacity: 0; pointer-events: none; transform: scale(1.03);
  transition: opacity 0.36s var(--ease-out-expo), transform 0.42s var(--ease-out-expo);
}
.focus-overlay.open { opacity: 1; pointer-events: auto; transform: scale(1); }
.focus-topbar { position: absolute; top: 22px; left: 28px; right: 28px; display: flex; align-items: center; justify-content: space-between; }
.focus-ring-wrap { position: relative; width: 272px; height: 272px; display: flex; align-items: center; justify-content: center; margin: 16px 0 22px; }
.focus-ring-svg { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
.ring-track { fill: none; stroke: var(--border); stroke-width: 5; }
.ring-progress { fill: none; stroke: var(--blue-primary); stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.5s linear; }
.focus-time-big { font-size: 58px; font-weight: 700; letter-spacing: -0.04em; line-height: 1; }

.call-modal { position: fixed; inset: 0; z-index: 85; background: var(--overlay-bg); backdrop-filter: blur(18px); display: none; align-items: center; justify-content: center; }
.call-modal.open { display: flex; }
.call-card {
  width: 360px; padding: 28px 24px; border-radius: 24px;
  background: var(--bg-surface); border: 1px solid var(--border); box-shadow: var(--shadow-modal);
  text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;
}
.call-avatar-ring {
  width: 112px; height: 112px; border-radius: 50%; padding: 8px;
  background: #ffffff; border: 2px solid var(--blue-primary); box-shadow: 0 0 0 10px var(--blue-ring);
  animation: pulseRing 2s infinite; display: flex; align-items: center; justify-content: center;
}
.call-avatar-ring img { width: 92px; height: 92px; object-fit: contain; }

.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(16px);
  z-index: 100; padding: 9px 16px; border-radius: var(--radius-pill);
  background: var(--ink-primary); color: var(--ink-inverse);
  font-size: 12.5px; font-weight: 600; opacity: 0; pointer-events: none; transition: all 0.24s var(--ease-out-expo);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<div class="app-shell" id="appShell">
  <!-- ==================== 左侧导航栏（纯净无干扰，去掉左上角多余跳秒计时） ==================== -->
  <aside class="sidebar">
    <div class="brand-row">
      <div class="brand-chibi-wrap">
        <img class="linger-chibi" src="../../dsh-image-gen/image-5ffd3da5.jpg" alt="灵儿高清头像" />
      </div>
      <div>
        <div class="brand-name">灵儿管家</div>
        <div class="brand-sub">个人正循环 · v5 原型</div>
      </div>
    </div>

    <div class="nav-group">
      <div class="nav-label">核心视图</div>
      <button class="nav-item active" data-view="focus">
        <span class="nav-item-left">
          <!-- Two-tone Target Icon -->
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" fill="var(--cat-work-soft)" stroke="var(--blue-primary)" stroke-width="1.75"/>
            <circle cx="12" cy="12" r="3.5" fill="var(--blue-primary)"/>
          </svg>
          此刻焦点
        </span>
        <span class="nav-pill blue tnum" id="navOpenTasksPill">3 待办</span>

const $ = (s) => document.querySelector(s);

function escapeHtml(str) { return String(str || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function showToast(msg) { const el = $("#toast"); el.textContent = msg; el.classList.add("show"); clearTimeout(showToast._t); showToast._t = setTimeout(() => el.classList.remove("show"), 2200); }
function toMinutes(hhmm) { const [h, m] = hhmm.split(":").map(Number); return h * 60 + m; }
function logDuration(log) { return Math.max(1, toMinutes(log.end) - toMinutes(log.start)); }
function formatDur(mins) { if (mins < 60) return `${mins}m`; const h = Math.floor(mins / 60); const m = mins % 60; return m ? `${h}h ${m}m` : `${h}h`; }
function formatMMSS(sec) { const s = Math.max(0, Math.floor(sec)); return `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`; }
function nowHHMM() { const d = new Date(); return `${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`; }
function computeCatTotals() {
  const totals = { sleep: 0, meal: 0, rest: 0, work: 0, exercise: 0, wash: 0, leisure: 0 };
  state.timeLogs.forEach((l) => { totals[l.cat] = (totals[l.cat] || 0) + logDuration(l); });
  return totals;
}

/* ==========================================================================
   Dissolve TaskCheck 精确交互逻辑（弹簧勾选 -> 220ms 绘钩 -> 删除线 -> 900ms 缓冲可即时撤销 -> 折叠下沉）
   ========================================================================== */
function handleTaskCheckClick(taskId) {
  const task = state.tasks.find((t) => t.id === taskId);
  if (!task) return;

  // 若正在 900ms 缓冲期内再次点击：立刻撤销下沉！
  if (state.settlingTasks[taskId]) {
    clearTimeout(state.settlingTasks[taskId].timerId);
    clearTimeout(state.settlingTasks[taskId].collapseTimerId);
    delete state.settlingTasks[taskId];
    renderMain();
    showToast("已即时撤销勾选");
    return;
  }

  // 如果已在底部已完成区点击：直接恢复回待办队列
  if (task.done) {
    task.done = false;
    renderMain();
    showToast("已恢复到上方待办队列");
    return;
  }

  // 未完成项首次点击：触发 Dissolve TaskCheck 序列动画（不立即卸载 DOM，先播放弹性勾选与横扫删除线）
  const wrapper = $(`[data-tc-wrap="${taskId}"]`);
  const row = $(`[data-tc-row="${taskId}"]`);
  const box = $(`[data-tc-box="${taskId}"]`);
  const rightSlot = $(`[data-tc-right="${taskId}"]`);

  if (row && box) {
    row.classList.add("is-checked", "is-settling");
    box.classList.add("checked");
    if (rightSlot) rightSlot.innerHTML = `<span class="tc-undo-pill">再点撤销</span>`;
  }

  const settleInfo = {};
  state.settlingTasks[taskId] = settleInfo;

  // 900ms 缓冲后平滑折叠当前行，320ms 后正式沉入底部已完成列表
  settleInfo.timerId = setTimeout(() => {
    if (wrapper) wrapper.classList.add("collapsing");
    settleInfo.collapseTimerId = setTimeout(() => {
      delete state.settlingTasks[taskId];
      task.done = true;
      renderMain();
    }, 320);
  }, 900);
}

  const doneHabitsCnt = state.habits.filter((h) => h.done).length;

  $$("[data-view]").forEach((el) => el.classList.toggle("active", el.dataset.view === state.view));
  $("#navOpenTasksPill").textContent = `${openTasks.length} 待办`;
  const pct = Math.min(100, Math.round(((doneHabitsCnt / Math.max(1, state.habits.length)) * 50) + ((doneTasks.length / Math.max(1, state.tasks.length)) * 50)));
  $("#sideProgressPct").textContent = `${pct}%`;
  $("#sideProgressBar").style.width = `${Math.max(10, pct)}%`;
  $("#sideProgressDetail").textContent = `习惯 ${doneHabitsCnt}/${state.habits.length} · 专注 ${formatDur(totals.work)}`;

  if (state.view === "focus") {

    $("#topbarSub").textContent = "番茄专注 · 离座一键计时 · 待办 Dissolve 动效 · 右侧灵儿对话与习惯看板";

}

  $("#startPomoBtn")?.addEventListener("click", () => {
    startTimedSession({ cat: "work", label: "学习 / 工作", title: state.pomo.customTaskName.trim() || "番茄专注", timerMode: state.pomo.mode, plannedMin: state.pomo.minutes });
  });

  $$("[data-away]").forEach((b) => b.addEventListener("click", () => {
    const cat = b.dataset.away;
    const titles = { meal: "去吃饭", wash: "去洗漱", exercise: "去运动", rest: "去休息", leisure: "娱乐休闲" };
    startTimedSession({ cat, label: CATEGORIES[cat].name, title: titles[cat], timerMode: "stopwatch" });
  }));

  $("#addTaskForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const v = $("#newTaskInput").value.trim();
    if (!v) return;
    state.tasks.unshift({ id: "t_" + Date.now(), title: v, done: false });
    renderMain();
  });
  $$("[data-toggle-task]").forEach((el) => el.addEventListener("click", () => handleTaskCheckClick(el.dataset.toggleTask)));
  $$("[data-bind-task]").forEach((b) => b.addEventListener("click", (e) => {
    e.stopPropagation();
    const t = state.tasks.find((x) => x.id === b.dataset.bindTask);
    if (t) { state.pomo.customTaskName = t.title; renderMain(); showToast("已填入番茄钟"); }
  }));

  // 习惯看板：完成 / 未做 / 数值修改 / 添加 / 删除
  $("#toggleAddHabitBtn")?.addEventListener("click", () => { state.addHabitOpen = !state.addHabitOpen; renderMain(); });
  $("#addHabitForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const name = $("#newHabitName").value.trim();
    const amount = Math.max(1, Number($("#newHabitAmount").value) || 15);
    const unit = $("#newHabitUnit").value;
    if (!name) return;
    const id = "h_" + Date.now();
    state.habits.push({ id, title: name, done: false, amount, unit, week: [false, false, false, false, false, false, false] });
    MONTH_CAL_DATA.forEach((d) => { d.habits[id] = false; });
    state.addHabitOpen = false;
    renderMain();
    showToast(`已添加习惯「${name}（${amount}${unit}）」`);
  });

  $$("[data-del-habit]").forEach((b) => b.addEventListener("click", () => {
    const h = state.habits.find((x) => x.id === b.dataset.delHabit);
    state.habits = state.habits.filter((x) => x.id !== b.dataset.delHabit);
    renderMain();
    if (h) showToast(`已删除习惯「${h.title}」`);
  }));

  $$("[data-hid]").forEach((b) => b.addEventListener("click", () => {
    const h = state.habits.find((x) => x.id === b.dataset.hid);
    if (!h) return;
    h.done = b.dataset.hdone === "true";
    h.week[6] = h.done;
    const todayCell = MONTH_CAL_DATA.find((d) => d.isToday);
    if (todayCell) todayCell.habits[h.id] = h.done;
    renderMain();
  }));

  $$("[data-hamount]").forEach((inp) => inp.addEventListener("change", () => {
    const h = state.habits.find((x) => x.id === inp.dataset.hamount);
    if (h) {
      h.amount = Math.max(0, Number(inp.value) || 0);
      showToast(`「${h.title}」已更新为 ${h.amount} ${h.unit}`);
    }
  }));

  $("#gotoHabitCalBtn")?.addEventListener("click", () => { state.view = "dashboard"; state.dashPeriod = "month"; renderMain(); });

  // Claude 对话交互
  $$("[data-copy-msg]").forEach((b) => b.addEventListener("click", () => {
    const m = state.chat.find((x) => x.id === b.dataset.copyMsg);
    if (m) { navigator.clipboard?.writeText(m.text); showToast("已复制对话内容"); }
  }));
  $$("[data-del-msg]").forEach((b) => b.addEventListener("click", () => {
    state.chat = state.chat.filter((x) => x.id !== b.dataset.delMsg);
    renderMain(); showToast("已删除该条消息");
  }));

  $("#voiceInputBtn")?.addEventListener("click", () => {
    if (!state.chatVoiceRec) {
      state.chatVoiceRec = true; renderMain();
      setTimeout(() => {
        if (!state.chatVoiceRec) return;
        state.chatVoiceRec = false; renderMain();
        const ta = $("#claudeInput");
        if (ta) { ta.value = "刚刚练了 35 分钟口语，感觉顺畅多了！"; ta.focus(); }
        showToast("语音已转成文字，回车即可发送");
      }, 1300);
    } else { state.chatVoiceRec = false; renderMain(); }
  });

  const openCall = () => { state.callOpen = true; renderCallModal(); };
  $("#openCallBtn")?.addEventListener("click", openCall);
  $("#openCallFromHeadBtn")?.addEventListener("click", openCall);

  const sendChat = () => {
    const ta = $("#claudeInput");
    const txt = ta?.value.trim();
    if (!txt || state.chatThinking) return;
    state.chat.push({ id: "m_" + Date.now(), role: "user", time: nowHHMM(), text: txt });
    state.chatThinking = true;
    renderMain();
    scrollChatBottom();

    setTimeout(() => {
      state.chatThinking = false;
      let extracted = "已随手记录";
      let reply = "收到啦主人！已经帮你归档进今天的记录里了，晚上汇报的时候会一并总结～";
      const numMatch = txt.match(/(\d+)/);
      if (/口语|跟读/.test(txt)) {
        const h = state.habits.find((x) => x.id === "h_speak");
        if (h) { h.done = true; h.week[6] = true; if (numMatch) h.amount = Number(numMatch[1]); }
        extracted = `习惯 · 每日口语练习（完成 · ${h ? h.amount : 30}分钟）`;
        reply = "超棒！已经同步把下方习惯看板里的「每日口语练习」标成完成并更新了时长哦！";
      } else if (/阅读|看书/.test(txt)) {
        const h = state.habits.find((x) => x.id === "h_read");
        if (h) { h.done = true; h.week[6] = true; if (numMatch) h.amount = Number(numMatch[1]); }
        extracted = `习惯 · 每日阅读（完成 · ${h ? h.amount : 30}分钟）`;
        reply = "已把下方「每日阅读」记为完成并同步记录时长啦！";
      }
      state.chat.push({ id: "m_" + (Date.now() + 1), role: "bot", time: nowHHMM(), extracted, text: reply });
      renderAll();
      scrollChatBottom();
    }, 900);
  };

  $("#claudeChatForm")?.addEventListener("submit", (e) => { e.preventDefault(); sendChat(); });
  $("#claudeInput")?.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendChat(); } });
}

function scrollChatBottom() { setTimeout(() => { const s = $("#chatStream"); if (s) s.scrollTop = s.scrollHeight; }, 30); }

        </div>
        <div class="week-stack-list">
          ${WEEK_DAYS_DATA.map((d) => {
            const totalH = d.sleep + d.work + d.meal + d.rest + d.exercise + d.wash + d.leisure;
            return `
              <div class="week-day-row">

        <div class="cal-grid">
          <div class="cal-cell empty"></div><div class="cal-cell empty"></div><div class="cal-cell empty"></div>

                <div class="cal-habit-dots">
                  ${!d.isFuture ? list.map((h) => `<span class="cal-dot ${d.habits[h.id] ? "done" : ""}"></span>`).join("") : `<span style="font-size:10.5px;color:var(--ink-muted)">—</span>`}

        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
          <span class="legend-swatch" style="background:${c.color}"></span>

    node.addEventListener("mouseenter", () => setHighlight(node.dataset.logId));
    node.addEventListener("mouseleave", () => setHighlight(null));
  });
}

function positionTooltip(e) {
  const tip = $("#hoverTooltip");
  tip.style.left = `${Math.min(window.innerWidth - 290, e.clientX + 14)}px`;
  tip.style.top = `${Math.max(14, e.clientY - 88)}px`;
}

/* ==========================================================================
   早间聚焦仪式 & 晚间 90s 汇报 弹层 + 全屏计时
   ========================================================================== */
function renderModal() {
  const backdrop = $("#ritualBackdrop");
  const shell = $("#appShell");
  if (!state.modalMode) {
    backdrop.classList.remove("open");
    shell.classList.toggle("blurred", Boolean(state.activeSession && !state.activeSession.minimized));
    clearInterval(eveningAudioInterval); state.eveningPlaying = false;
    return;
  }
  backdrop.classList.add("open");
  shell.classList.add("blurred");
  if (state.modalMode === "morning") renderMorningModal();
  else renderEveningReportModal();
}

        </div>
        <div class="ritual-foot">
          <button class="btn btn-secondary btn-sm" id="backQBtn">← 回看 5 问</button>
          <button class="btn btn-blue" id="enterWorkspaceBtn">规划好了，进入主控面板 →</button>
        </div>
      </div>
    `}
  `;

  $("#nextGreetingBtn")?.addEventListener("click", () => { state.greetingIdx = (state.greetingIdx + 1) % GREETINGS.length; renderMorningModal(); });
  $$("[data-jump-q]").forEach((b) => b.addEventListener("click", () => { state.qIndex = Number(b.dataset.jumpQ); renderMorningModal(); }));
  $$("[data-choice]").forEach((b) => b.addEventListener("click", () => { state.morning[q.key].choice = b.dataset.choice; renderMorningModal(); }));
  $("#prevQBtn")?.addEventListener("click", () => { state.qIndex--; renderMorningModal(); });
  $("#nextQBtn")?.addEventListener("click", () => {
    const inp = $("#morningNoteInput"); if (inp) state.morning[q.key].note = inp.value.trim();
    if (state.qIndex < 4) { state.qIndex++; renderMorningModal(); } else { state.morningPhase = "briefing"; renderMorningModal(); }
  });
  $("#closeModalBtn")?.addEventListener("click", () => { state.modalMode = null; renderModal(); });
  $("#morningVoiceSwitchBtn")?.addEventListener("click", () => { state.modalMode = null; renderModal(); state.callOpen = true; renderCallModal(); });
  $("#backQBtn")?.addEventListener("click", () => { state.morningPhase = "questions"; renderMorningModal(); });
  $$("[data-carry]").forEach((b) => b.addEventListener("click", () => {
    const item = state.yesterday.carryOver.find((x) => x.id === b.dataset.carry);
    if (item && !item.moved) { item.moved = true; state.tasks.unshift({ id: "t_" + Date.now(), title: item.title, done: false }); renderMorningModal(); renderMain(); }
  }));
  $("#enterWorkspaceBtn")?.addEventListener("click", () => { state.modalMode = null; renderAll(); showToast("早间启动完成！"); });
}

function renderEveningReportModal() {
  const totals = computeCatTotals();
  const doneHabits = state.habits.filter((h) => h.done);
  const missedHabits = state.habits.filter((h) => !h.done);
  const segIndex = state.eveningSec < 30 ? 0 : (state.eveningSec < 60 ? 1 : 2);

  $("#ritualModal").innerHTML = `
    <div class="ritual-hero">
      <div class="linger-mascot-box"><img class="linger-chibi" src="${AVATAR_HD}" alt="灵儿晚间汇报" /></div>
      <div style="flex:1;">
        <div style="display:flex;align-items:center;justify-content:space-between;">
          <span class="badge blue">🌙 22:45 灵儿晚间主动汇报 · 90 秒</span>
          <button class="btn btn-secondary btn-sm" id="closeEveningBtn">收起</button>
        </div>
        <div style="font-size:15.5px;font-weight:700;margin-top:5px;">主人辛苦啦！这是今天的时间分配与复盘分析</div>
        <div style="display:flex;align-items:center;gap:10px;margin-top:8px;">
          <button class="btn btn-primary btn-sm" id="toggleEveningAudioBtn">${state.eveningPlaying ? "⏸ 暂停播报" : "▶ 播放 90 秒语音总结"}</button>
          <div style="flex:1;"><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100, (state.eveningSec / 90) * 100)}%"></div></div></div>
          <span class="tnum" style="font-size:11.5px;color:var(--ink-muted);">${formatMMSS(state.eveningSec)} / 01:30</span>
        </div>
      </div>
    </div>
    <div class="ritual-body" style="display:flex;flex-direction:column;gap:11px;">
      <div class="brief-section ${state.eveningPlaying && segIndex === 0 ? "speaking" : ""}">
        <div style="font-size:12px;font-weight:700;color:var(--blue-primary);margin-bottom:4px;">01 · 今日 7 类时间分配（00:00 – 00:30）</div>
        <div style="font-size:13px;">学习/工作 <strong>${formatDur(totals.work)}</strong> · 睡眠 <strong>${formatDur(totals.sleep)}</strong> · 吃饭 <strong>${formatDur(totals.meal)}</strong> · 运动 <strong>${formatDur(totals.exercise)}</strong> · 休息 <strong>${formatDur(totals.rest)}</strong> · 洗漱 <strong>${formatDur(totals.wash)}</strong> · 娱乐休闲 <strong>${formatDur(totals.leisure)}</strong>。</div>
      </div>
      <div class="brief-section ${state.eveningPlaying && segIndex === 1 ? "speaking" : ""}">
        <div style="font-size:12px;font-weight:700;color:#15803d;margin-bottom:4px;">02 · 今天做得好的地方（00:30 – 01:00）</div>
        <div style="font-size:13px;">已完成习惯：<strong>${doneHabits.map(h => `${h.title}（${h.amount}${h.unit}）`).join("、") || "保持了基础节奏"}</strong>；保持了 30 分钟运动和规律午休。</div>
      </div>
      <div class="brief-section ${state.eveningPlaying && segIndex === 2 ? "speaking" : ""}">
        <div style="font-size:12px;font-weight:700;color:var(--cat-meal);margin-bottom:4px;">03 · 待改进与明日一条调整（01:00 – 01:30）</div>
        <div style="font-size:13px;">尚未完成的习惯：<strong>${missedHabits.map(h => `${h.title}（${h.amount}${h.unit}）`).join("、") || "今日习惯已全部达成！"}</strong></div>
        <input class="input-field" style="width:100%;margin-top:8px;background:var(--bg-surface);" id="eveningAdjDraft" placeholder="写下明天只改的那一件事…" />
      </div>
      <div class="ritual-foot">
        <button class="btn btn-secondary btn-sm" id="jumpDashFromEveningBtn">看 24h 时间轴</button>
        <button class="btn btn-primary" id="confirmEveningBtn">收下汇报，晚安 ✓</button>
      </div>
    </div>
  `;

  $("#closeEveningBtn")?.addEventListener("click", () => { state.modalMode = null; renderModal(); });
  $("#toggleEveningAudioBtn")?.addEventListener("click", () => {
    state.eveningPlaying = !state.eveningPlaying;
    clearInterval(eveningAudioInterval);
    if (state.eveningPlaying) {
      if (state.eveningSec >= 90) state.eveningSec = 0;
      eveningAudioInterval = setInterval(() => {
        state.eveningSec += 2;
        if (state.eveningSec >= 90) { state.eveningSec = 90; state.eveningPlaying = false; clearInterval(eveningAudioInterval); }
        renderEveningReportModal();
      }, 300);
    }
    renderEveningReportModal();
  });
  $("#jumpDashFromEveningBtn")?.addEventListener("click", () => { state.modalMode = null; state.view = "dashboard"; state.dashPeriod = "day"; renderAll(); });
  $("#confirmEveningBtn")?.addEventListener("click", () => {
    const adj = $("#eveningAdjDraft")?.value.trim(); if (adj) state.yesterday.adjustment = adj;
    state.modalMode = null; renderAll(); showToast("晚安！明日调整已保存");
  });
}

function startTimedSession({ cat, label, title, timerMode, plannedMin }) {
  if (state.activeSession) { state.activeSession.minimized = false; syncFocusOverlay(); return; }
  state.activeSession = { cat, label, title, timerMode, plannedSec: (plannedMin || 25) * 60, elapsedSec: 0, startedAt: nowHHMM(), paused: false, minimized: false };
  $("#focusLiveNote").value = "";
  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.activeSession || state.activeSession.paused) return;
    state.activeSession.elapsedSec += 1;
    if (state.activeSession.timerMode === "countdown" && state.activeSession.elapsedSec >= state.activeSession.plannedSec) { finishActiveSession(); return; }
    updateFocusClockDom();
  }, 1000);
  syncFocusOverlay();
}
function updateFocusClockDom() {
  const s = state.activeSession; if (!s) return;
  const disp = s.timerMode === "countdown" ? Math.max(0, s.plannedSec - s.elapsedSec) : s.elapsedSec;
  $("#focusTimeBig").textContent = formatMMSS(disp);
  $("#bannerClock").textContent = formatMMSS(disp);
  $("#focusTimeSub").textContent = s.timerMode === "countdown" ? `倒计时 · 已专注 ${formatMMSS(s.elapsedSec)}` : `正计时自动记录中 · 触发于 ${s.startedAt}`;
  const ratio = s.timerMode === "countdown" ? Math.min(1, s.elapsedSec / Math.max(1, s.plannedSec)) : Math.max(0.08, (s.elapsedSec % 60) / 60);
  $("#focusRingProgress").style.strokeDashoffset = String(791.68 * (1 - ratio));
}
function syncFocusOverlay() {
  const s = state.activeSession;
  if (!s) { $("#focusOverlay").classList.remove("open"); $("#activeTimerBanner").classList.remove("visible"); if (!state.modalMode) $("#appShell").classList.remove("blurred"); return; }
  $("#focusEventTitle").textContent = s.title;
  $("#focusStartedPill").textContent = `触发时间 ${s.startedAt} · ${CATEGORIES[s.cat].name}`;
  $("#focusPauseBtn").textContent = s.paused ? "▶ 继续" : "⏸ 暂停";
  $("#bannerLabel").textContent = `${CATEGORIES[s.cat].name} · ${s.title}`;
  $("#bannerStartedAt").textContent = `触发于 ${s.startedAt}`;
  updateFocusClockDom();
  if (s.minimized) { $("#focusOverlay").classList.remove("open"); $("#activeTimerBanner").classList.add("visible"); if (!state.modalMode) $("#appShell").classList.remove("blurred"); }
  else { $("#focusOverlay").classList.add("open"); $("#activeTimerBanner").classList.remove("visible"); $("#appShell").classList.add("blurred"); }
}
function finishActiveSession() {
  const s = state.activeSession; if (!s) return;
  clearInterval(timerInterval);
  const mins = Math.max(1, Math.round(s.elapsedSec / 60) || 10);
  const endMin = Math.min(23 * 60 + 59, toMinutes(s.startedAt) + mins);
  const endStr = `${String(Math.floor(endMin / 60)).padStart(2, "0")}:${String(endMin % 60).padStart(2, "0")}`;
  const note = $("#focusLiveNote").value.trim() || `${CATEGORIES[s.cat].name}自动计时`;
  state.timeLogs.push({ id: "l_" + Date.now(), cat: s.cat, title: s.title, start: s.startedAt, end: endStr, note });
  state.timeLogs.sort((a, b) => toMinutes(a.start) - toMinutes(b.start));
  state.chat.push({ id: "m_" + Date.now(), role: "bot", time: nowHHMM(), extracted: `${CATEGORIES[s.cat].name} · ${mins} 分钟 (${s.startedAt}–${endStr})`, text: `已将「${s.title}」的 ${mins} 分钟自动写入 24 小时时间轴啦！` });
  state.activeSession = null; syncFocusOverlay(); renderAll();
  showToast(`已入账：${s.title}（${mins} 分钟）`);
}

function renderCallModal() { $("#callModal").classList.toggle("open", state.callOpen); }
function renderAll() { renderMain(); renderModal(); syncFocusOverlay(); }

/* 全局绑定 */
$$("[data-view]").forEach((b) => b.addEventListener("click", () => { state.view = b.dataset.view; renderMain(); }));
$("#replayMorningBtn").addEventListener("click", () => { state.modalMode = "morning"; state.morningPhase = "questions"; state.qIndex = 0; state.greetingIdx = (state.greetingIdx + 1) % GREETINGS.length; renderModal(); });
const openEvening = () => { state.modalMode = "evening_report"; state.eveningSec = 0; renderModal(); };
$("#triggerEveningReportBtn").addEventListener("click", openEvening);
$("#topEveningBtn").addEventListener("click", openEvening);
$("#reopenPanelBtn").addEventListener("click", () => {
  if (state.activeSession) { state.activeSession.minimized = false; syncFocusOverlay(); showToast("检测到正在计时，已自动回到全屏聚焦"); }
  else showToast("当前没有运行中的计时；先点「开始专注」或「去吃饭」再试");
});
$("#toggleThemeBtn").addEventListener("click", () => { state.dark = !state.dark; document.documentElement.classList.toggle("dark", state.dark); });
$("#minimizeFocusBtn").addEventListener("click", () => { if (state.activeSession) { state.activeSession.minimized = true; syncFocusOverlay(); } });
$("#bannerResumeFullBtn").addEventListener("click", () => { if (state.activeSession) { state.activeSession.minimized = false; syncFocusOverlay(); } });
$("#bannerStopBtn").addEventListener("click", finishActiveSession);
$("#focusPauseBtn").addEventListener("click", () => { if (state.activeSession) { state.activeSession.paused = !state.activeSession.paused; syncFocusOverlay(); } });
$("#focusFastForwardBtn").addEventListener("click", () => {
  if (!state.activeSession) return;
  state.activeSession.elapsedSec += 600;
  if (state.activeSession.timerMode === "countdown" && state.activeSession.elapsedSec >= state.activeSession.plannedSec) finishActiveSession();
  else { updateFocusClockDom(); showToast("演示快进 +10 分钟"); }
});
$("#focusFinishBtn").addEventListener("click", finishActiveSession);
$("#simCallSpeakBtn").addEventListener("click", () => {
  $("#callSubtitle").textContent = "「收到！已把『每日阅读』标为完成，记录 30 分钟哦～」";
  const h = state.habits.find((x) => x.id === "h_read"); if (h) { h.done = true; h.week[6] = true; }
  renderMain();
});
$("#endCallBtn").addEventListener("click", () => { state.callOpen = false; renderCallModal(); showToast("实时对话已结束"); });

renderAll();
</script>
</body>
