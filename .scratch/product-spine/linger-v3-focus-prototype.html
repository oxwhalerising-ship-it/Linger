<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵儿 v3 · 沉浸聚焦与全屏计时原型（PROTOTYPE）</title>
<style>
/* ==========================================================================
   灵儿 v3 · 白 / 蓝 / 黑 三基调沉浸聚焦原型（Throwaway Prototype）
   核心升级：
   1. 早间开启：背景高斯模糊 + 居中聚焦动效 + 灵儿每日随机问候打气
      支持 3 种并行记录形式（快捷选择 / 额外补充文本框 / 喊灵儿口语对话收纳）
      5 问结束后灵儿无缝呈现昨日回顾与今日规划
   2. 番茄钟：倒计时优先 + 正计时切换 + 自定义时长 + 任务名称直接自定义输入
   3. 临时离座一键计时：合并为「去吃饭 / 去洗漱 / 去运动 / 去休息」，自动记精确触发时间点，
      后台实时汇总为「今日用时智能汇报」
   4. 今日待办：完成后沉底变灰加删除线，再次点击秒恢复防误触
   5. 全屏计时聚焦模式：任一计时启动后动效展开全屏聚焦，再次打开面板保持计时态
   ========================================================================== */
:root {
  --bg-app: #f6f7f9;
  --bg-sidebar: #fafafb;
  --bg-main: #ffffff;
  --bg-surface: #ffffff;
  --bg-subtle: #f2f4f7;
  --bg-hover: #eef1f5;
  --bg-track: #e9ecf1;

  --border: #e6e8ec;
  --border-hover: #cfd5df;
  --border-strong: #bfc7d5;

  --ink-primary: #111318;
  --ink-secondary: #4b5563;
  --ink-muted: #8a94a6;
  --ink-inverse: #ffffff;

  --blue-primary: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-mid: #60a5fa;
  --blue-soft: #93c5fd;
  --blue-light: #dbeafe;
  --blue-tint: #eff6ff;
  --blue-ring: rgba(37, 99, 235, 0.20);

  --overlay-bg: rgba(246, 247, 249, 0.72);
  --focus-bg: rgba(255, 255, 255, 0.94);

  --shadow-card: 0 1px 2px rgba(17, 19, 24, 0.03);
  --shadow-active: 0 1px 3px rgba(17, 19, 24, 0.06), 0 1px 1px rgba(17, 19, 24, 0.03);
  --shadow-modal: 0 24px 64px rgba(17, 19, 24, 0.14), 0 0 0 1px rgba(17, 19, 24, 0.06);

  --radius-2xl: 20px;
  --radius-xl: 14px;
  --radius-lg: 12px;
  --radius-md: 9px;
  --radius-sm: 7px;
  --radius-pill: 999px;

  --ease-out-expo: cubic-bezier(0.16, 1, 0.3, 1);
  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

html.dark {
  --bg-app: #080a0f;
  --bg-sidebar: #0e1118;
  --bg-main: #0b0d12;
  --bg-surface: #131722;
  --bg-subtle: #1b2130;
  --bg-hover: #22293b;
  --bg-track: #1f2636;

  --border: #232a3b;
  --border-hover: #333e56;
  --border-strong: #435170;

  --ink-primary: #f3f4f6;
  --ink-secondary: #a1aab8;
  --ink-muted: #667289;
  --ink-inverse: #0b0d12;

  --blue-primary: #3b82f6;
  --blue-hover: #60a5fa;
  --blue-mid: #2563eb;
  --blue-soft: #1d4ed8;
  --blue-light: rgba(59, 130, 246, 0.24);
  --blue-tint: rgba(59, 130, 246, 0.13);
  --blue-ring: rgba(59, 130, 246, 0.34);

  --overlay-bg: rgba(8, 10, 15, 0.72);
  --focus-bg: rgba(11, 13, 18, 0.96);

  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.30);
  --shadow-active: 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-modal: 0 28px 72px rgba(0, 0, 0, 0.62), 0 0 0 1px rgba(255, 255, 255, 0.08);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  height: 100%;
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-primary);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
  overflow: hidden;
}
.tnum { font-variant-numeric: tabular-nums; }
button, input, textarea { font: inherit; color: inherit; outline: none; }
button { cursor: pointer; border: none; background: transparent; }

/* ==================== 桌面骨架 & 背景模糊动效 ==================== */
.app-shell {
  display: grid;
  grid-template-columns: 228px 1fr;
  height: 100vh;
  max-width: 1640px;
  margin: 0 auto;
  background: var(--bg-main);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
  transition: filter 0.45s var(--ease-out-expo), transform 0.45s var(--ease-out-expo);
  will-change: filter, transform;
}
.app-shell.blurred {
  filter: blur(11px) saturate(0.92);
  transform: scale(0.992);
  pointer-events: none;
  user-select: none;
}

/* ==================== 左侧栏 ==================== */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 14px 12px 12px;
  gap: 14px;
  overflow-y: auto;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px;
}
.brand-left { display: flex; align-items: center; gap: 10px; }
.brand-mark {
  width: 28px; height: 28px;
  display: grid; grid-template-columns: 1fr 1fr; gap: 3px;
  padding: 4px; border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
}
.brand-mark span { border-radius: 2px; background: var(--ink-primary); }
.brand-mark span:nth-child(2), .brand-mark span:nth-child(3) { background: var(--blue-primary); }
.brand-name { font-size: 14.5px; font-weight: 650; line-height: 1.2; }
.brand-sub { font-size: 11px; color: var(--ink-muted); }

.nav-group { display: flex; flex-direction: column; gap: 3px; }
.nav-label {
  font-size: 11px; font-weight: 600; color: var(--ink-muted);
  padding: 4px 8px 3px;
}
.nav-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 8px 10px; border-radius: var(--radius-md);
  color: var(--ink-secondary); border: 1px solid transparent;
  transition: all 0.15s ease;
}
.nav-item:hover { background: var(--bg-hover); color: var(--ink-primary); }
.nav-item.active {
  background: var(--bg-surface);
  color: var(--ink-primary);
  font-weight: 600;
  border-color: var(--border);
  box-shadow: var(--shadow-active);
}
.nav-item-left { display: flex; align-items: center; gap: 9px; }
.nav-item svg { width: 16px; height: 16px; stroke: currentColor; stroke-width: 1.7; fill: none; color: var(--ink-muted); }
.nav-item.active svg { color: var(--blue-primary); }
.nav-pill {
  font-size: 11px; font-weight: 600; padding: 1px 7px;
  border-radius: var(--radius-pill); background: var(--bg-subtle); color: var(--ink-secondary);
}
.nav-pill.blue { background: var(--blue-tint); color: var(--blue-primary); }

.side-card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 11px 12px;
  display: flex; flex-direction: column; gap: 8px;
}
.side-card-head {
  display: flex; align-items: center; justify-content: space-between;
  font-size: 11.5px; font-weight: 600; color: var(--ink-secondary);
}
.side-quick-btn {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; padding: 7px 9px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 12px; font-weight: 500; color: var(--ink-primary);
  transition: all 0.15s ease;
}
.side-quick-btn:hover { border-color: var(--border-hover); background: var(--bg-subtle); }
.side-quick-btn.blue-accent {
  border-color: var(--blue-light); background: var(--blue-tint); color: var(--blue-primary);
}
.side-quick-btn .hint { font-size: 11px; color: var(--ink-muted); }

.progress-track {
  height: 5px; border-radius: var(--radius-pill);
  background: var(--bg-track); overflow: hidden;
}
.progress-fill {
  height: 100%; background: var(--blue-primary);
  border-radius: var(--radius-pill); transition: width 0.35s var(--ease-out-expo);
}

.sidebar-footer {
  margin-top: auto;
  display: flex; align-items: center; justify-content: space-between;
  padding-top: 10px; border-top: 1px solid var(--border);
}
.owner-status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--ink-secondary); }
.online-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-tint); }
.icon-btn {
  width: 28px; height: 28px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--bg-surface);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--ink-secondary); transition: all 0.15s ease;
}
.icon-btn:hover { border-color: var(--border-hover); color: var(--ink-primary); background: var(--bg-subtle); }
.icon-btn svg { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.7; fill: none; }

/* ==================== 主区域 ==================== */
.main-area {
  display: flex; flex-direction: column;
  height: 100vh; overflow: hidden;
  background: var(--bg-app);
}

/* 正在计时时的顶部强连续性悬浮条（当用户临时最小化全屏计时时出现） */
.active-timer-banner {
  display: none;
  align-items: center; justify-content: space-between;
  padding: 8px 24px;
  background: var(--ink-primary);
  color: var(--ink-inverse);
  font-size: 12.5px;
}
.active-timer-banner.visible { display: flex; animation: slideDown 0.28s var(--ease-out-expo); }
.banner-left { display: flex; align-items: center; gap: 10px; }
.pulse-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--blue-mid);
  box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.7);
  animation: pulseRing 1.6s infinite;
}
@keyframes pulseRing {
  0% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0.65); }
  70% { box-shadow: 0 0 0 7px rgba(96, 165, 250, 0); }
  100% { box-shadow: 0 0 0 0 rgba(96, 165, 250, 0); }
}
.banner-actions { display: flex; align-items: center; gap: 8px; }
.banner-btn {
  padding: 4px 11px; border-radius: var(--radius-pill);
  font-size: 12px; font-weight: 600;
  background: var(--blue-primary); color: #ffffff;
}
.banner-btn.ghost {
  background: rgba(255, 255, 255, 0.14); color: var(--ink-inverse);
}

.topbar {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 24px;
  background: var(--bg-surface);
  border-bottom: 1px solid var(--border);
  gap: 12px;
  flex-shrink: 0;
}
.topbar-title-wrap { display: flex; flex-direction: column; }
.topbar-title { font-size: 19px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.25; }
.topbar-sub { font-size: 12px; color: var(--ink-muted); margin-top: 2px; }
.topbar-right { display: flex; align-items: center; gap: 8px; }

.segmented {
  display: inline-flex; padding: 3px;
  background: var(--bg-subtle); border: 1px solid var(--border);
  border-radius: var(--radius-md); gap: 2px;
}
.seg-btn {
  padding: 5px 12px; border-radius: 6px;
  font-size: 12.5px; font-weight: 500; color: var(--ink-secondary);
  transition: all 0.15s ease;
}
.seg-btn.active {
  background: var(--bg-surface); color: var(--ink-primary);
  font-weight: 600; box-shadow: var(--shadow-active);
}

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius-md);
  font-size: 13px; font-weight: 600;
  transition: all 0.16s ease;
  white-space: nowrap;
}
.btn-primary {
  background: var(--ink-primary); color: var(--ink-inverse);
}
.btn-primary:hover { opacity: 0.9; transform: translateY(-0.5px); }
.btn-blue {
  background: var(--blue-primary); color: #ffffff;
}
.btn-blue:hover { background: var(--blue-hover); transform: translateY(-0.5px); }
.btn-secondary {
  background: var(--bg-surface); color: var(--ink-primary);
  border: 1px solid var(--border);
}
.btn-secondary:hover { border-color: var(--border-hover); background: var(--bg-subtle); }
.btn-tint {
  background: var(--blue-tint); color: var(--blue-primary);
  border: 1px solid var(--blue-light);
}
.btn-tint:hover { background: var(--blue-light); }
.btn-sm { padding: 5px 10px; font-size: 12px; border-radius: var(--radius-sm); }

/* ==================== 主体滚动区 ==================== */
.content-scroll {
  flex: 1; overflow-y: auto; padding: 20px 24px 36px;
}

.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.72fr) minmax(300px, 1fr);
  gap: 18px;
  align-items: start;
}
@media (max-width: 1120px) {
  .workspace-grid { grid-template-columns: 1fr; }
}

.col-stack { display: flex; flex-direction: column; gap: 16px; }

.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 18px 20px;
  box-shadow: var(--shadow-card);
}
.card-head {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 14px; gap: 10px;
}
.card-title { font-size: 14.5px; font-weight: 650; display: flex; align-items: center; gap: 8px; }
.card-sub { font-size: 12px; color: var(--ink-muted); }

.badge {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px 8px; border-radius: var(--radius-pill);
  font-size: 11.5px; font-weight: 600;
  background: var(--bg-subtle); color: var(--ink-secondary);
}
.badge.blue { background: var(--blue-tint); color: var(--blue-primary); }
.badge.dark { background: var(--ink-primary); color: var(--ink-inverse); }

/* 昨日调整轻条 */
.adj-strip {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 11px 14px;
  background: var(--blue-tint);
  border: 1px solid var(--blue-light);
  border-left: 3px solid var(--blue-primary);
  border-radius: var(--radius-lg);
}
.adj-label { font-size: 11px; font-weight: 650; color: var(--blue-primary); text-transform: uppercase; letter-spacing: 0.03em; }
.adj-text { font-size: 13.5px; font-weight: 550; color: var(--ink-primary); margin-top: 1px; }

/* ==================== 番茄钟升级卡片 ==================== */
.pomo-card {
  padding: 20px 22px;
  display: flex; flex-direction: column; gap: 16px;
}
.pomo-top-row {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
.pomo-task-editor {
  display: flex; align-items: center; gap: 8px; flex: 1; min-width: 220px;
  padding: 6px 10px; border-radius: var(--radius-md);
  border: 1px solid transparent; background: var(--bg-subtle);
  transition: all 0.16s ease;
}
.pomo-task-editor:focus-within, .pomo-task-editor:hover {
  border-color: var(--border-hover); background: var(--bg-surface);
}
.pomo-task-editor:focus-within {
  border-color: var(--blue-primary); box-shadow: 0 0 0 3px var(--blue-ring);
}
.pomo-task-input {
  flex: 1; border: none; background: transparent;
  font-size: 14.5px; font-weight: 600; color: var(--ink-primary);
}
.pomo-task-input::placeholder { color: var(--ink-muted); font-weight: 450; }

.pomo-body {
  display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap;
  padding: 8px 4px 4px;
}
.pomo-clock-wrap { display: flex; align-items: baseline; gap: 12px; }
.pomo-digits {
  font-size: 48px; font-weight: 700; line-height: 1;
  letter-spacing: -0.04em; color: var(--ink-primary);
}
.pomo-mode-note { font-size: 12px; color: var(--ink-muted); }

.pomo-presets {
  display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
}
.preset-chip {
  padding: 5px 10px; border-radius: var(--radius-pill);
  border: 1px solid var(--border); background: var(--bg-surface);
  font-size: 12px; font-weight: 600; color: var(--ink-secondary);
  transition: all 0.14s ease;
}
.preset-chip:hover { border-color: var(--border-hover); color: var(--ink-primary); }
.preset-chip.active {
  background: var(--blue-tint); border-color: var(--blue-primary); color: var(--blue-primary);
}
.custom-min-wrap {
  display: inline-flex; align-items: center; gap: 4px;
  padding: 3px 8px; border-radius: var(--radius-pill);
  border: 1px dashed var(--border-strong); background: var(--bg-subtle);
  font-size: 12px;
}
.custom-min-wrap input {
  width: 38px; border: none; background: transparent;
  text-align: center; font-weight: 650; color: var(--ink-primary);
}

/* ==================== 临时离开座位一键计时 ==================== */
.away-grid {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
}
@media (max-width: 760px) {
  .away-grid { grid-template-columns: repeat(2, 1fr); }
}
.away-btn {
  display: flex; flex-direction: column; align-items: flex-start; gap: 6px;
  padding: 13px 14px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-surface);
  text-align: left; transition: all 0.16s ease;
  position: relative;
}
.away-btn:hover {
  border-color: var(--blue-primary); background: var(--blue-tint);
  transform: translateY(-1px);
}
.away-btn-top {
  display: flex; align-items: center; justify-content: space-between; width: 100%;
}
.away-icon {
  width: 28px; height: 28px; border-radius: 8px;
  background: var(--bg-subtle); color: var(--ink-primary);
  display: inline-flex; align-items: center; justify-content: center;
}
.away-btn:hover .away-icon { background: var(--bg-surface); color: var(--blue-primary); }
.away-icon svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.75; fill: none; }
.away-title { font-size: 13.5px; font-weight: 650; color: var(--ink-primary); }
.away-meta { font-size: 11.5px; color: var(--ink-muted); }

/* ==================== 今日待办队列（完成沉底+删除线+点击恢复） ==================== */
.task-add-row {
  display: flex; gap: 8px; margin-bottom: 12px;
}
.input-field {
  flex: 1; padding: 8px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-subtle);
  font-size: 13px; color: var(--ink-primary);
  transition: all 0.15s ease;
}
.input-field:focus {
  background: var(--bg-surface); border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-ring);
}
.task-list { display: flex; flex-direction: column; gap: 6px; }
.task-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 12px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-surface);
  transition: all 0.16s ease;
}
.task-row:hover { border-color: var(--border-hover); }
.task-row.focused-task {
  border-color: var(--blue-light); background: var(--blue-tint);
}
.task-left {
  display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0;
  cursor: pointer;
}
.checkbox {
  width: 17px; height: 17px; border-radius: 5px;
  border: 1.5px solid var(--border-strong); background: var(--bg-surface);
  display: inline-flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: all 0.15s ease;
}
.checkbox:hover { border-color: var(--ink-primary); }
.checkbox.checked {
  background: var(--ink-primary); border-color: var(--ink-primary); color: var(--ink-inverse);
}
.task-text { font-size: 13.5px; font-weight: 500; color: var(--ink-primary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.task-actions { display: flex; align-items: center; gap: 6px; opacity: 0.85; }

.done-divider {
  display: flex; align-items: center; gap: 8px;
  margin: 14px 0 8px;
  font-size: 11.5px; font-weight: 600; color: var(--ink-muted);
}
.done-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }

.task-row.done-row {
  background: var(--bg-subtle); border-color: transparent;
  cursor: pointer;
}
.task-row.done-row:hover {
  border-color: var(--border-hover); background: var(--bg-hover);
}
.task-row.done-row .task-text {
  color: var(--ink-muted);
  text-decoration: line-through;
  text-decoration-thickness: 1.5px;
}
.restore-hint {
  font-size: 11px; color: var(--ink-muted);
  opacity: 0; transition: opacity 0.14s ease;
}
.task-row.done-row:hover .restore-hint { opacity: 1; color: var(--blue-primary); }

/* ==================== 右侧灵儿伴随对话卡 ==================== */
.chat-card {
  display: flex; flex-direction: column;
  height: calc(100vh - 112px); min-height: 460px; max-height: 760px;
  padding: 0; overflow: hidden;
}
.chat-head {
  padding: 14px 16px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}

.extract-pill {

.ritual-backdrop {

.ritual-backdrop.open {

.ritual-modal {

  transition: transform 0.45s var(--ease-out-expo);
}
.ritual-backdrop.open .ritual-modal {

}

.ritual-hero {
  padding: 20px 24px 16px;

}
.greeting-wrap { display: flex; align-items: flex-start; gap: 12px; }
.linger-hero-badge {
  width: 40px; height: 40px; border-radius: 13px;

  box-shadow: 0 8px 20px rgba(37, 99, 235, 0.28);
  flex-shrink: 0;

@keyframes floatGentle {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-3px); }
}
.greeting-kicker {
  font-size: 11.5px; font-weight: 650; color: var(--blue-primary);
  display: flex; align-items: center; gap: 8px;
}
.greeting-text {
  font-size: 14px; font-weight: 550; color: var(--ink-primary); margin-top: 3px; line-height: 1.5;
}

.ritual-progress {

}
.step-bar {
  flex: 1; height: 4px; border-radius: var(--radius-pill);

}
.step-bar.done { background: var(--blue-primary); }
.step-bar.current { background: var(--ink-primary); }

.ritual-body {

@keyframes fadeSlideUp {

  to { opacity: 1; transform: translateY(0); }
}
@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }

.talk-trigger {

}
.talk-trigger:hover { background: var(--blue-primary); color: #ffffff; border-color: var(--blue-primary); }

.choice-grid {

.choice-card {

}
.choice-card:hover { border-color: var(--border-strong); background: var(--bg-subtle); }
.choice-card.selected {

}

}

.supplement-box {

}

}
.brief-item.done { color: var(--ink-muted); text-decoration: line-through; }

.focus-overlay {
  position: fixed; inset: 0; z-index: 80;

.focus-overlay.open {

.focus-topbar {
  position: absolute; top: 22px; left: 28px; right: 28px;

}
.focus-center {

  max-width: 560px; width: 100%;
}
.focus-ring-wrap {
  position: relative; width: 280px; height: 280px;
  display: flex; align-items: center; justify-content: center;
  margin: 18px 0 24px;
}
.focus-ring-svg {
  position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg);
}
.ring-track { fill: none; stroke: var(--border); stroke-width: 5; }
.ring-progress {
  fill: none; stroke: var(--blue-primary); stroke-width: 5; stroke-linecap: round;
  transition: stroke-dashoffset 0.5s linear;
}
.focus-time-big {
  font-size: 62px; font-weight: 700; letter-spacing: -0.04em; line-height: 1;
  color: var(--ink-primary);
}
.focus-time-sub {
  font-size: 12.5px; color: var(--ink-muted); margin-top: 8px;
}
.focus-event-title {
  font-size: 22px; font-weight: 700; letter-spacing: -0.02em; color: var(--ink-primary);
}
.focus-started-pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px; border-radius: var(--radius-pill);
  background: var(--blue-tint); color: var(--blue-primary);
  font-size: 12px; font-weight: 600; margin-bottom: 10px;
}
.focus-controls {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center;
}
.focus-note-box {
  margin-top: 22px; width: 100%; max-width: 400px;
  padding: 12px 14px; border-radius: var(--radius-lg);
  background: var(--bg-surface); border: 1px solid var(--border);
  text-align: left;
}

/* ==================== 今日全清单 & 每日用时智能汇报 ==================== */
.report-bar-track {
  display: flex; height: 12px; border-radius: var(--radius-pill);
  overflow: hidden; background: var(--bg-track); gap: 2px;
  margin: 12px 0;
}
.report-seg { height: 100%; transition: width 0.35s var(--ease-out-expo); }
.report-metrics {
  display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px;
}
@media (max-width: 900px) { .report-metrics { grid-template-columns: repeat(2, 1fr); } }
.metric-box {
  padding: 12px 14px; border-radius: var(--radius-lg);
  border: 1px solid var(--border); background: var(--bg-subtle);
}
.metric-k { font-size: 11.5px; color: var(--ink-muted); font-weight: 600; }
.metric-v { font-size: 20px; font-weight: 700; margin-top: 3px; color: var(--ink-primary); }
.metric-s { font-size: 11px; color: var(--ink-secondary); margin-top: 2px; }

.timeline-list { display: flex; flex-direction: column; gap: 8px; }
.timeline-item {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 14px; border-radius: var(--radius-md);
  border: 1px solid var(--border); background: var(--bg-surface);
}
.timeline-left { display: flex; align-items: center; gap: 12px; }
.time-tag {
  font-size: 12px; font-weight: 650; color: var(--blue-primary);
  background: var(--blue-tint); padding: 3px 8px; border-radius: 6px;
  min-width: 96px; text-align: center;
}

/* 结束计时后的 5 秒轻补记弹层 */
.post-modal-backdrop {
  position: fixed; inset: 0; z-index: 90;
  background: var(--overlay-bg); backdrop-filter: blur(8px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.post-modal-backdrop.open { display: flex; }
.post-modal {
  width: 100%; max-width: 440px;
  background: var(--bg-surface); border: 1px solid var(--border);
  border-radius: var(--radius-2xl); padding: 22px 24px;
  box-shadow: var(--shadow-modal);
  animation: fadeSlideUp 0.25s var(--ease-out-expo);
}

/* Toast */
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(16px);
  z-index: 100; padding: 9px 16px; border-radius: var(--radius-pill);
  background: var(--ink-primary); color: var(--ink-inverse);
  font-size: 12.5px; font-weight: 600;
  opacity: 0; pointer-events: none; transition: all 0.24s var(--ease-out-expo);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

const $ = (sel) => document.querySelector(sel);

function showToast(msg) {
  const el = $("#toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove("show"), 2300);
}

function nowTimeStr() {
  const d = new Date();
  const hh = String(d.getHours()).padStart(2, "0");
  const mm = String(d.getMinutes()).padStart(2, "0");
  return `${hh}:${mm}`;
}

function getEffectiveTimeStr() {
  // 原型中允许用左侧「模拟当前时段」测试午饭/晚饭智能识别，同时也保留真实分钟数
  const mins = String(new Date().getMinutes()).padStart(2, "0");
  if (state.simPeriod === "lunch") return `12:${mins}`;
  if (state.simPeriod === "dinner") return `18:${mins}`;
  if (state.simPeriod === "night") return `21:${mins}`;
  return nowTimeStr();
}

function inferMealLabel(timeStr) {
  const hour = Number(timeStr.split(":")[0]);
  if (hour < 10) return "吃早饭";
  if (hour >= 10 && hour < 15) return "吃午饭";
  if (hour >= 15 && hour < 21) return "吃晚饭";
  return "加餐/夜宵";
}

function formatMMSS(totalSec) {
  const s = Math.max(0, Math.floor(totalSec));
  const m = Math.floor(s / 60);
  const rem = s % 60;
  return `${String(m).padStart(2, "0")}:${String(rem).padStart(2, "0")}`;
}

function formatDurationText(mins) {
  if (mins < 60) return `${mins} 分钟`;
  const h = Math.floor(mins / 60);
  const m = mins % 60;
  return m ? `${h} 小时 ${m} 分钟` : `${h} 小时`;
}

/* ==========================================================================
   核心计算：后台自动汇总今日用时（供每日汇报使用）
   ========================================================================== */
function computeDailySummary() {
  const sums = { focus: 0, lunch: 0, dinner: 0, otherMeal: 0, exercise: 0, wash: 0, rest: 0, focusCount: 0 };
  state.timeLogs.forEach((log) => {
    if (log.kind === "focus") { sums.focus += log.minutes; sums.focusCount += 1; }
    else if (log.kind === "meal") {
      if (log.label.includes("午")) sums.lunch += log.minutes;
      else if (log.label.includes("晚")) sums.dinner += log.minutes;
      else sums.otherMeal += log.minutes;
    } else if (log.kind === "exercise") sums.exercise += log.minutes;
    else if (log.kind === "wash") sums.wash += log.minutes;
    else if (log.kind === "rest") sums.rest += log.minutes;
  });
  return sums;
}

function bindRitualEvents() {
  $("#shuffleGreetingBtn")?.addEventListener("click", () => {
    state.greetingIdx = (state.greetingIdx + 1) % GREETINGS.length;
    renderRitual();
  });

  $$("[data-jump-q]").forEach((bar) => bar.addEventListener("click", () => {
    saveCurrentSupplement();
    state.qIndex = Number(bar.dataset.jumpQ);
    renderRitual();
  }));

  $$("[data-choice]").forEach((btn) => btn.addEventListener("click", () => {
    const q = MORNING_QUESTIONS[state.qIndex];
    state.morning[q.key].choice = btn.dataset.choice;
    saveCurrentSupplement();
    renderRitual();
  }));

  $("#supplementInput")?.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      advanceQuestion();
    }
  });

  $("#prevQBtn")?.addEventListener("click", () => {
    saveCurrentSupplement();
    state.qIndex = Math.max(0, state.qIndex - 1);
    renderRitual();
  });

  $("#nextQBtn")?.addEventListener("click", advanceQuestion);

  $("#skipRitualBtn")?.addEventListener("click", () => {
    state.ritualOpen = false;
    renderAll();
    showToast("已收起早间仪式，左侧随时可重新打开");
  });

  $("#switchVoiceModeBtn")?.addEventListener("click", () => {
    saveCurrentSupplement();
    state.ritualPhase = "voice";
    renderRitual();
  });

  $("#backToChoiceBtn")?.addEventListener("click", () => {
    state.ritualPhase = "questions";
    renderRitual();
  });

  $("#simVoiceBtn")?.addEventListener("click", () => {
    if (!state.isRecording) {
      state.isRecording = true;
      renderRitual();
      return;
    }
    state.isRecording = false;
    const sample = "昨晚睡得还不错大概7个多小时，今天7点20起床的，刚吃了鸡蛋牛奶和两片全麦面包，在阳台晒了10分钟太阳，单词背了一半等下继续背完。";
    ingestVoiceMorningText(sample);
  });

  const handleVoiceSend = () => {
    const inp = $("#voiceTextInput");
    const txt = inp?.value.trim();
    if (!txt) return;
    ingestVoiceMorningText(txt);
  };
  $("#voiceSendBtn")?.addEventListener("click", handleVoiceSend);
  $("#voiceTextInput")?.addEventListener("keydown", (e) => { if (e.key === "Enter") { e.preventDefault(); handleVoiceSend(); } });

  $("#voiceDoneNextBtn")?.addEventListener("click", () => {
    state.ritualPhase = "briefing";
    renderRitual();
  });

  $("#backFromBriefingBtn")?.addEventListener("click", () => {
    state.ritualPhase = "questions";
    renderRitual();

function ingestVoiceMorningText(txt) {
  state.voiceMessages.push({ role: "user", text: txt });
  const captured = [];

  if (/睡|小时|h|浅|沉|没睡/.test(txt)) {
    state.morning.sleep.choice = /不错|7|8|沉/.test(txt) ? "还不错 · 6.5–7.5h" : "有点浅 / 醒过 · 6h 左右";
    state.morning.sleep.note = txt.match(/[^，。]*睡[^，。]*/)?.[0] || "";
    captured.push("昨晚睡眠");
  }
  if (/点|起/.test(txt)) {
    const tMatch = txt.match(/(\d{1,2}[:点]\d{0,2})/);
    state.morning.wake.choice = "07:00 – 07:30";
    state.morning.wake.note = tMatch ? `${tMatch[1]} 起床` : "已记录起床";
    captured.push("起床时间");
  }
  if (/早[餐饭]|鸡蛋|牛奶|面包|包子|粥|面|咖啡/.test(txt)) {
    state.morning.breakfast.choice = "吃了 · 蛋奶/面包";
    state.morning.breakfast.note = txt.match(/[^，。]*(早[餐饭]|吃|喝)[^，。]*/)?.[0] || "";
    captured.push("早餐");
  }
  if (/太阳|阳台|透气/.test(txt)) {
    state.morning.sunlight.choice = /没|阴/.test(txt) ? "今天阴天 / 没来得及" : "晒了 10 分钟以上";
    captured.push("晒太阳");
  }
  if (/单词|背/.test(txt)) {
    state.morning.vocab.choice = /一半|部分/.test(txt) ? "背了一部分，晚点补完" : (/完/.test(txt) ? "按计划背完了" : "还没开始，安排进今天");
    captured.push("背单词");
  }

  const missing = MORNING_QUESTIONS.filter((q) => !state.morning[q.key].choice && !state.morning[q.key].note);
  state.voiceMessages.push({
    role: "bot",
    extracted: captured.length ? `已智能收纳：${captured.join("、")}` : "已记入早间备注",
    text: missing.length
      ? `听清啦，帮你记好了 ${captured.join("、")}！还差一项「${missing[0].title}」，可以直接接着说，或者直接点右下角进入昨日汇报。`
      : "太丝滑了！5 个早间问题已经全部帮你智能归纳填好啦，点右下角听我给你汇报昨天的情况吧～"
  });
  renderRitual();
  setTimeout(() => { const s = $("#voiceStream"); if (s) s.scrollTop = s.scrollHeight; }, 30);
}

/* ==========================================================================
   全屏计时聚焦模式引擎（番茄钟 + 临时离座统一走全屏聚焦）
   ========================================================================== */
function startTimedSession({ kind, label, title, timerMode, plannedMin }) {
  if (state.activeSession) {
    showToast("当前已有一项正在计时，已切回全屏聚焦");
    state.activeSession.minimized = false;
    syncFocusOverlay();
    return;
  }
  const startedAt = getEffectiveTimeStr();
  state.activeSession = {
    kind,
    label,
    title,
    timerMode,
    plannedSec: (plannedMin || 25) * 60,
    elapsedSec: 0,
    startedAt,
    paused: false,
    minimized: false,
    note: ""
  };
  $("#focusLiveNote").value = "";

  clearInterval(timerInterval);
  timerInterval = setInterval(() => {
    if (!state.activeSession || state.activeSession.paused) return;
    state.activeSession.elapsedSec += 1;
    if (state.activeSession.timerMode === "countdown" && state.activeSession.elapsedSec >= state.activeSession.plannedSec) {
      finishActiveSession();
      return;
    }
    updateFocusClockDom();
  }, 1000);

  syncFocusOverlay();
}

function updateFocusClockDom() {
  const s = state.activeSession;
  if (!s) return;
  const displaySec = s.timerMode === "countdown"
    ? Math.max(0, s.plannedSec - s.elapsedSec)
    : s.elapsedSec;
  const clockStr = formatMMSS(displaySec);

  $("#focusTimeBig").textContent = clockStr;
  $("#bannerClock").textContent = clockStr;

  if (s.timerMode === "countdown") {
    $("#focusTimeSub").textContent = `倒计时 ${Math.round(s.plannedSec / 60)}m · 已进行 ${formatMMSS(s.elapsedSec)}`;
    const ratio = Math.min(1, s.elapsedSec / Math.max(1, s.plannedSec));
    $("#focusRingProgress").style.strokeDashoffset = String(791.68 * (1 - ratio));
  } else {
    $("#focusTimeSub").textContent = `正计时自动记录中 · 触发于 ${s.startedAt}`;
    const cycle = (s.elapsedSec % 60) / 60;
    $("#focusRingProgress").style.strokeDashoffset = String(791.68 * (1 - Math.max(0.08, cycle)));
  }
}

function syncFocusOverlay() {
  const s = state.activeSession;
  const overlay = $("#focusOverlay");
  const banner = $("#activeTimerBanner");
  const shell = $("#appShell");

  if (!s) {
    overlay.classList.remove("open");
    banner.classList.remove("visible");
    if (!state.ritualOpen) shell.classList.remove("blurred");
    return;
  }

  $("#focusEventTitle").textContent = s.title;
  $("#focusStartedPill").textContent = `触发时间 ${s.startedAt} · ${s.label}计时中`;
  $("#focusPauseBtn").textContent = s.paused ? "▶ 继续计时" : "⏸ 暂停";
  $("#bannerLabel").textContent = `${s.label} · ${s.title}`;
  $("#bannerStartedAt").textContent = `触发于 ${s.startedAt}`;
  updateFocusClockDom();

  if (s.minimized) {
    overlay.classList.remove("open");
    banner.classList.add("visible");
    if (!state.ritualOpen) shell.classList.remove("blurred");
  } else {
    overlay.classList.add("open");
    banner.classList.remove("visible");
    shell.classList.add("blurred");
  }
}

function finishActiveSession() {
  const s = state.activeSession;
  if (!s) return;
  clearInterval(timerInterval);

  const liveNote = $("#focusLiveNote").value.trim();
  const mins = Math.max(1, Math.round(s.elapsedSec / 60) || 1);
  // 推算结束时间点
  const [sh, sm] = s.startedAt.split(":").map(Number);
  const totalEndMin = sh * 60 + sm + mins;
  const endStr = `${String(Math.floor(totalEndMin / 60) % 24).padStart(2, "0")}:${String(totalEndMin % 60).padStart(2, "0")}`;

  const logEntry = {
    id: "l_" + Date.now(),
    kind: s.kind,
    label: s.label,
    title: s.title,
    start: s.startedAt,
    end: endStr,
    minutes: mins,
    note: liveNote
  };
  state.timeLogs.push(logEntry);
  state.activeSession = null;
  syncFocusOverlay();

  // 打开 5 秒轻确认卡（可一键补充或直接关闭）
  openPostTimerModal(logEntry);
  renderAll();
}

  const morningDone = MORNING_QUESTIONS.filter((q) => state.morning[q.key].choice || state.morning[q.key].note).length;
  const pct = Math.min(100, Math.round(((morningDone / 5) * 35) + ((doneTasks.length / Math.max(1, state.tasks.length)) * 35) + (Math.min(4, sums.focusCount) / 4 * 30)));

            <div class="msg ${m.role}">
              ${m.extracted ? `<span class="extract-pill">✓ ${escapeHtml(m.extracted)}</span>` : ""}
              <div class="msg-bubble">${escapeHtml(m.text)}</div>
            </div>
          `).join("")}
        </div>

        <form class="chat-foot" id="sideChatForm">
          <input class="input-field" id="sideChatInput" placeholder="跟灵儿说一句，比如：去吃饭了 / 加个任务…" />
          <button class="btn btn-primary btn-sm" type="submit">发送</button>
        </form>
      </aside>
    </div>
  `;

  bindFocusWorkspaceEvents();
}

function bindFocusWorkspaceEvents() {
  $("#adjDoneBtn")?.addEventListener("click", () => {
    state.yesterday.adjustmentStatus = state.yesterday.adjustmentStatus === "done" ? "pending" : "done";
    renderMain();
  });

  $("#pomoTaskNameInput")?.addEventListener("input", (e) => {
    state.pomo.customTaskName = e.target.value;
  });

  $$("[data-pomo-mode]").forEach((btn) => btn.addEventListener("click", () => {
    state.pomo.mode = btn.dataset.pomoMode;
    renderMain();
  }));

  $$("[data-pomo-min]").forEach((btn) => btn.addEventListener("click", () => {
    state.pomo.minutes = Number(btn.dataset.pomoMin);
    renderMain();
  }));

  $("#customMinInput")?.addEventListener("change", (e) => {
    const val = Math.max(1, Math.min(180, Number(e.target.value) || 25));
    state.pomo.minutes = val;
    renderMain();
  });

  $("#startPomoBtn")?.addEventListener("click", () => {
    const taskName = state.pomo.customTaskName.trim() || "自由专注学习";
    startTimedSession({
      kind: "focus",
      label: "专注学习",
      title: taskName,
      timerMode: state.pomo.mode,
      plannedMin: state.pomo.minutes
    });
  });

  $$("[data-away]").forEach((btn) => btn.addEventListener("click", () => {
    const kind = btn.dataset.away;
    const tStr = getEffectiveTimeStr();
    const map = {
      meal: { label: inferMealLabel(tStr), title: `临时离座 · ${inferMealLabel(tStr)}` },
      wash: { label: "洗漱", title: "临时离座 · 洗漱（洗澡/刷牙）" },
      exercise: { label: "运动", title: "临时离座 · 运动锻炼" },
      rest: { label: "休息", title: "临时离座 · 离开屏幕休息" }
    };
    const cfg = map[kind];
    startTimedSession({
      kind,
      label: cfg.label,
      title: cfg.title,
      timerMode: "stopwatch",
      plannedMin: 25
    });
  }));

  $("#addTaskForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("#newTaskInput");
    const v = inp.value.trim();
    if (!v) return;
    state.tasks.unshift({ id: "t_" + Date.now(), title: v, done: false });
    renderMain();
  });

  $$("[data-toggle-task]").forEach((el) => el.addEventListener("click", () => {
    const t = state.tasks.find((x) => x.id === el.dataset.toggleTask);
    if (!t) return;
    t.done = !t.done;
    renderMain();
    showToast(t.done ? "已完成，已移至底部（再点可恢复）" : "已恢复到待办队列");
  }));

  $$("[data-bind-task]").forEach((btn) => btn.addEventListener("click", (e) => {
    e.stopPropagation();
    const t = state.tasks.find((x) => x.id === btn.dataset.bindTask);
    if (!t) return;
    state.pomo.customTaskName = t.title;
    renderMain();
    showToast(`已将「${t.title}」填入番茄钟`);
  }));

  $("#sideChatForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const inp = $("#sideChatInput");
    const txt = inp.value.trim();
    if (!txt) return;
    state.chat.push({ role: "user", text: txt });

    if (/去吃饭|吃午饭|吃晚饭/.test(txt)) {
      const mealLbl = inferMealLabel(getEffectiveTimeStr());
      state.chat.push({ role: "bot", extracted: `触发计时 · ${mealLbl}`, text: `好嘞，帮你开启「${mealLbl}」自动计时并切到全屏聚焦，慢慢吃！` });
      renderMain();
      startTimedSession({ kind: "meal", label: mealLbl, title: `临时离座 · ${mealLbl}`, timerMode: "stopwatch" });
      return;
    }
    if (/加个任务|待办|提醒我做/.test(txt)) {
      const clean = txt.replace(/^(加个任务|待办|提醒我做)[:：\s]*/, "") || txt;
      state.tasks.unshift({ id: "t_" + Date.now(), title: clean, done: false });
      state.chat.push({ role: "bot", extracted: `新增待办 · ${clean}`, text: "已加入今日待办队列顶部啦。" });
    } else {
      state.chat.push({ role: "bot", extracted: "已随手记录", text: "收到，已经记在今天的清单里了。" });
    }
    renderMain();
    setTimeout(() => { const s = $("#sideChatStream"); if (s) s.scrollTop = s.scrollHeight; }, 20);
  });
}

function renderReportWorkspace(sums) {
  const totalTracked = Math.max(1, sums.focus + sums.lunch + sums.dinner + sums.otherMeal + sums.exercise + sums.wash + sums.rest);
  const segs = [
    { label: "专注学习", val: sums.focus, color: "var(--blue-primary)" },
    { label: "吃饭", val: sums.lunch + sums.dinner + sums.otherMeal, color: "var(--ink-primary)" },
    { label: "运动", val: sums.exercise, color: "var(--blue-mid)" },
    { label: "洗漱", val: sums.wash, color: "var(--blue-soft)" },
    { label: "休息", val: sums.rest, color: "var(--border-strong)" }
  ];

  const reportSentence = [
    `今天你一共专注学习了 ${formatDurationText(sums.focus)}（${sums.focusCount} 轮）`,
    sums.lunch ? `吃午饭用了 ${sums.lunch} 分钟` : null,
    sums.dinner ? `吃晚饭用了 ${sums.dinner} 分钟` : null,
    sums.exercise ? `运动了 ${sums.exercise} 分钟` : null,
    sums.wash ? `洗漱用了 ${sums.wash} 分钟` : null,
    sums.rest ? `休息了 ${sums.rest} 分钟` : null
  ].filter(Boolean).join("，") + "。";

  $("#mainContent").innerHTML = `
    <div class="col-stack" style="max-width:1060px;">
      <!-- 灵儿晚间用时智能汇报卡 -->
      <section class="card">
        <div class="card-head">
          <div>
            <div class="card-title">
              <span class="linger-avatar" style="width:22px;height:22px;font-size:11px;border-radius:7px;">灵</span>
              <span>今日用时每日汇报（后台自动汇总）</span>
            </div>
            <div class="card-sub" style="margin-top:4px;color:var(--ink-primary);font-size:13.5px;">${reportSentence}</div>
          </div>
          <span class="badge blue tnum">共记录 ${formatDurationText(sums.focus + sums.lunch + sums.dinner + sums.otherMeal + sums.exercise + sums.wash + sums.rest)}</span>
        </div>

        <div class="report-bar-track">
          ${segs.filter(s => s.val > 0).map((s) => `
            <div class="report-seg" style="width:${(s.val / totalTracked) * 100}%;background:${s.color};" title="${s.label}：${s.val} 分钟"></div>
          `).join("")}
        </div>

        <div class="report-metrics">
          <div class="metric-box">
            <div class="metric-k">专注学习</div>
            <div class="metric-v tnum">${sums.focus}m</div>
            <div class="metric-s">${sums.focusCount} 轮番茄</div>
          </div>
          <div class="metric-box">
            <div class="metric-k">吃午饭</div>
            <div class="metric-v tnum">${sums.lunch ? sums.lunch + "m" : "—"}</div>
            <div class="metric-s">${sums.lunch ? "已自动记点" : "今天没有"}</div>
          </div>
          <div class="metric-box">
            <div class="metric-k">吃晚饭</div>
            <div class="metric-v tnum">${sums.dinner ? sums.dinner + "m" : "—"}</div>
            <div class="metric-s">${sums.dinner ? "已自动记点" : "待记录"}</div>
          </div>
          <div class="metric-box">
            <div class="metric-k">运动锻炼</div>
            <div class="metric-v tnum">${sums.exercise ? sums.exercise + "m" : "—"}</div>
            <div class="metric-s">${sums.exercise ? "已自动记点" : "待记录"}</div>
          </div>
          <div class="metric-box">
            <div class="metric-k">洗漱 & 休息</div>
            <div class="metric-v tnum">${sums.wash + sums.rest}m</div>
            <div class="metric-s">洗漱 ${sums.wash}m · 休息 ${sums.rest}m</div>
          </div>
        </div>
      </section>

      <!-- 今日精确时间点流水 -->
      <section class="card">
        <div class="card-head">
          <div class="card-title">今日计时时间轴（自动捕获触发时间点）</div>
          <span class="badge tnum">${state.timeLogs.length} 条记录</span>
        </div>
        <div class="timeline-list">
          ${state.timeLogs.slice().reverse().map((l) => `
            <div class="timeline-item">
              <div class="timeline-left">
                <span class="time-tag tnum">${l.start} – ${l.end}</span>
                <div>
                  <div style="font-weight:600;font-size:13.5px;">${escapeHtml(l.label)} · ${escapeHtml(l.title)}</div>
                  ${l.note ? `<div style="font-size:12px;color:var(--ink-muted);">${escapeHtml(l.note)}</div>` : ""}
                </div>
              </div>
              <span class="badge tnum" style="font-size:12px;">${l.minutes} 分钟</span>
            </div>
          `).join("")}
        </div>
      </section>

      <!-- 晨间 5 问记录 & 晚间收口 -->
      <div class="briefing-grid">
        <section class="card">
          <div class="card-head">
            <div class="card-title">早间 5 问记录</div>
            <button class="btn btn-secondary btn-sm" id="editMorningFromReport">补充 / 修改</button>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;">
            ${MORNING_QUESTIONS.map((q) => {
              const a = state.morning[q.key];
              const text = [a.choice, a.note].filter(Boolean).join(" · ") || "今天没有";
              return `
                <div class="brief-item">
                  <span style="color:var(--ink-secondary);font-size:12px;">${q.title}</span>
                  <strong style="font-size:12.5px;color:${a.choice || a.note ? "var(--ink-primary)" : "var(--ink-muted)"}">${escapeHtml(text)}</strong>
                </div>
              `;
            }).join("")}
          </div>
        </section>

        <section class="card">
          <div class="card-head">
            <div class="card-title">晚间收口（输出 + 明日 1 条调整）</div>
            <span class="badge ${state.eveningOutput && state.tomorrowAdjustment ? "blue" : ""}">
              ${state.eveningOutput && state.tomorrowAdjustment ? "✓ 今日闭环" : "待收口"}
            </span>
          </div>
          <div style="display:flex;flex-direction:column;gap:10px;">
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--ink-secondary);margin-bottom:5px;">今日输出（用自己的话写一句今天学到的）</div>
              <input class="input-field" id="eveningOutputInput" style="width:100%;" value="${escapeHtml(state.eveningOutput)}" placeholder="例如：把计时做成全屏聚焦，能大幅减少重新打开面板的分心。" />
            </div>
            <div>
              <div style="font-size:12px;font-weight:600;color:var(--ink-secondary);margin-bottom:5px;">明日调整（明天只改这一件事）</div>
              <input class="input-field" id="tomorrowAdjInput" style="width:100%;" value="${escapeHtml(state.tomorrowAdjustment)}" placeholder="例如：午饭回来立刻先开一轮 25 分钟番茄，再看消息。" />
            </div>
          </div>
        </section>
      </div>
    </div>
  `;

  $("#editMorningFromReport")?.addEventListener("click", () => {
    state.ritualOpen = true;
    state.ritualPhase = "questions";
    renderRitual();
  });
  $("#eveningOutputInput")?.addEventListener("change", (e) => { state.eveningOutput = e.target.value.trim(); renderMain(); });
  $("#tomorrowAdjInput")?.addEventListener("change", (e) => { state.tomorrowAdjustment = e.target.value.trim(); renderMain(); });
}

function escapeHtml(str) {
  return String(str || "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

function renderAll() {
  renderMain();
  renderRitual();
  syncFocusOverlay();
}

/* ==========================================================================
   全局绑定
   ========================================================================== */
$$("[data-view]").forEach((btn) => btn.addEventListener("click", () => {
  state.view = btn.dataset.view;
  renderMain();
}));

$("#openEveningBtn").addEventListener("click", () => {
  state.view = "report";
  renderMain();
});

$("#replayMorningBtn").addEventListener("click", () => {
  state.ritualOpen = true;
  state.ritualPhase = "questions";
  state.qIndex = 0;
  state.greetingIdx = (state.greetingIdx + 1) % GREETINGS.length;
  renderRitual();
});

$("#reopenPanelBtn").addEventListener("click", () => {
  if (state.activeSession) {
    state.activeSession.minimized = false;
    syncFocusOverlay();
    showToast("检测到正在计时，重新打开面板自动进入全屏聚焦模式");
  } else {
    showToast("当前没有进行中的计时；先点「开始专注」或「去吃饭」再试");
  }
});

$("#simPeriodSelect").addEventListener("change", (e) => {
  state.simPeriod = e.target.value;
  renderMain();
  showToast(`已切换模拟时段，现在点「去吃饭」会自动识别为：${inferMealLabel(getEffectiveTimeStr())}`);
});

$("#toggleThemeBtn").addEventListener("click", () => {
  state.dark = !state.dark;
  document.documentElement.classList.toggle("dark", state.dark);
});

// 全屏计时控件
$("#minimizeFocusBtn").addEventListener("click", () => {
  if (!state.activeSession) return;
  state.activeSession.minimized = true;
  syncFocusOverlay();
  showToast("计时在后台继续；点顶部黑条或重新打开主面板会回到全屏聚焦");
});
$("#bannerResumeFullBtn").addEventListener("click", () => {
  if (!state.activeSession) return;
  state.activeSession.minimized = false;
  syncFocusOverlay();
});
$("#bannerStopBtn").addEventListener("click", finishActiveSession);
$("#focusPauseBtn").addEventListener("click", () => {
  if (!state.activeSession) return;
  state.activeSession.paused = !state.activeSession.paused;
  syncFocusOverlay();
});
$("#focusFastForwardBtn").addEventListener("click", () => {
  if (!state.activeSession) return;
  state.activeSession.elapsedSec += 300;
  if (state.activeSession.timerMode === "countdown" && state.activeSession.elapsedSec >= state.activeSession.plannedSec) {
    finishActiveSession();
    return;
  }
  updateFocusClockDom();
  showToast("演示快进 +5 分钟");
});
$("#focusFinishBtn").addEventListener("click", finishActiveSession);

renderAll();
</script>
</body>
</html>
