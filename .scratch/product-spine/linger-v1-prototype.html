<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>灵儿 v1 · 个人正循环原型（PROTOTYPE）</title>
<style>
/* ==========================================================================
   灵儿 v1 · 白 / 蓝 / 黑 三基调视觉设计系统（Throwaway Visual Prototype）
   设计参考：纯净白灰画布 + 1px 精细线框 + 纯黑高对比主操作 + 钴蓝单一数据强调色
   ========================================================================== */
:root {
  --bg-app: #f6f7f9;
  --bg-sidebar: #fafafb;
  --bg-main: #ffffff;
  --bg-surface: #ffffff;
  --bg-subtle: #f2f4f7;
  --bg-hover: #eef1f5;
  --bg-track: #eceef2;

  --border: #e6e8ec;
  --border-hover: #cfd5df;
  --border-strong: #bfc7d5;

  --ink-primary: #111318;
  --ink-secondary: #4b5563;
  --ink-muted: #8a94a6;
  --ink-inverse: #ffffff;

  --blue-primary: #2563eb;
  --blue-hover: #1d4ed8;
  --blue-mid: #60a5fa;
  --blue-soft: #93c5fd;
  --blue-light: #dbeafe;
  --blue-tint: #eff6ff;
  --blue-ring: rgba(37, 99, 235, 0.2);

  --danger-text: #b91c1c;
  --danger-bg: #fef2f2;

  --shadow-card: 0 1px 2px rgba(17, 19, 24, 0.03);
  --shadow-active: 0 1px 3px rgba(17, 19, 24, 0.06), 0 1px 1px rgba(17, 19, 24, 0.03);
  --shadow-popover: 0 12px 32px rgba(17, 19, 24, 0.10), 0 0 0 1px rgba(17, 19, 24, 0.06);

  --radius-xl: 14px;
  --radius-lg: 12px;
  --radius-md: 9px;
  --radius-sm: 7px;
  --radius-pill: 999px;

  --hatch: repeating-linear-gradient(
    -45deg,
    #f3f4f6,
    #f3f4f6 3px,
    #e9ecf0 3px,
    #e9ecf0 6px
  );

  --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
}

html.dark {
  --bg-app: #080a0f;
  --bg-sidebar: #0e1118;
  --bg-main: #0b0d12;
  --bg-surface: #131722;
  --bg-subtle: #1b2130;
  --bg-hover: #21283a;
  --bg-track: #1f2636;

  --border: #232a3b;
  --border-hover: #333e56;
  --border-strong: #435170;

  --ink-primary: #f3f4f6;
  --ink-secondary: #a1aab8;
  --ink-muted: #667289;
  --ink-inverse: #0b0d12;

  --blue-primary: #3b82f6;
  --blue-hover: #60a5fa;
  --blue-mid: #2563eb;
  --blue-soft: #1d4ed8;
  --blue-light: rgba(59, 130, 246, 0.24);
  --blue-tint: rgba(59, 130, 246, 0.13);
  --blue-ring: rgba(59, 130, 246, 0.32);

  --shadow-card: 0 1px 2px rgba(0, 0, 0, 0.25);
  --shadow-active: 0 2px 6px rgba(0, 0, 0, 0.35);
  --shadow-popover: 0 18px 42px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 255, 255, 0.08);

  --hatch: repeating-linear-gradient(
    -45deg,
    #161b28,
    #161b28 3px,
    #1d2435 3px,
    #1d2435 6px
  );
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html, body {
  height: 100%;
  font-family: var(--font-sans);
  font-size: 13.5px;
  line-height: 1.5;
  color: var(--ink-primary);
  background: var(--bg-app);
  -webkit-font-smoothing: antialiased;
  letter-spacing: -0.01em;
}

.tnum {
  font-variant-numeric: tabular-nums;
}

button, input, textarea, select {
  font: inherit;
  color: inherit;
  outline: none;
}

button {
  cursor: pointer;
  border: none;
  background: transparent;
}

/* ==================== 外层桌面窗体骨架 ==================== */
.app-shell {
  display: grid;
  grid-template-columns: 232px 1fr;
  height: 100vh;
  max-width: 1680px;
  margin: 0 auto;
  background: var(--bg-main);
  overflow: hidden;
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

@media (max-width: 1024px) {
  .app-shell {
    grid-template-columns: 208px 1fr;
  }
}

/* ==================== 左侧导航栏（参照参考图 232px 极简侧栏） ==================== */
.sidebar {
  display: flex;
  flex-direction: column;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  padding: 14px 12px 12px;
  overflow-y: auto;
  gap: 14px;
}

.brand-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 4px 6px;
  border-radius: var(--radius-md);
}

.brand-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.brand-mark {
  width: 28px;
  height: 28px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 3px;
  padding: 4px;
  border-radius: 8px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  flex-shrink: 0;
}

.brand-mark span {
  border-radius: 2.5px;
  background: var(--ink-primary);
}

.brand-mark span:nth-child(2) {
  background: var(--blue-primary);
  border-radius: 4px 2px 2px 2px;
}

.brand-mark span:nth-child(3) {
  opacity: 0.22;
}

.brand-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.2;
  color: var(--ink-primary);
  display: flex;
  align-items: center;
  gap: 6px;
}

.proto-pill {
  font-size: 9.5px;
  font-weight: 600;
  letter-spacing: 0.04em;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--blue-tint);
  color: var(--blue-primary);
}

.brand-sub {
  font-size: 11px;
  color: var(--ink-muted);
  margin-top: 1px;
}

.search-btn {
  width: 100%;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 7px 10px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  color: var(--ink-muted);
  font-size: 12.5px;
  transition: border-color 0.15s ease, background 0.15s ease;
}

.search-btn:hover {
  border-color: var(--border-hover);
  color: var(--ink-secondary);
}

.search-btn-left {
  display: flex;
  align-items: center;
  gap: 7px;
}

.kbd {
  font-size: 10.5px;
  font-weight: 500;
  padding: 1px 5px;
  border-radius: 5px;
  background: var(--bg-subtle);
  color: var(--ink-muted);
  border: 1px solid var(--border);
}

.nav-section {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--ink-muted);
  padding: 2px 8px 5px;
  letter-spacing: 0.01em;
}

.nav-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  padding: 7px 10px;
  border-radius: var(--radius-md);
  color: var(--ink-secondary);
  font-size: 13px;
  font-weight: 500;
  border: 1px solid transparent;
  transition: all 0.15s ease;
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--ink-primary);
}

.nav-item.active {
  background: var(--bg-surface);
  color: var(--ink-primary);
  border-color: var(--border);
  box-shadow: var(--shadow-active);
}

.nav-item-left {
  display: flex;
  align-items: center;
  gap: 9px;
}

.nav-item svg {
  width: 16px;
  height: 16px;
  color: var(--ink-muted);
  flex-shrink: 0;
}

.nav-item.active svg {
  color: var(--blue-primary);
}

.nav-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: var(--radius-pill);
  background: var(--blue-tint);
  color: var(--blue-primary);
}

.nav-badge.muted {
  background: var(--bg-subtle);
  color: var(--ink-muted);
  font-weight: 500;
}

.sidebar-divider {
  height: 1px;
  background: var(--border);
  margin: 2px 4px;
}

/* 侧栏 · 今日焦点（对应参考图 Calendars 纯黑方框勾选项） */
.focus-checks {
  display: flex;
  flex-direction: column;
  gap: 4px;
  padding: 0 4px;
}

.focus-check-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 5px 6px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: background 0.15s;
}

.focus-check-row:hover {
  background: var(--bg-hover);
}

.focus-check-left {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-primary);
}

.black-box {
  width: 15px;
  height: 15px;
  border-radius: 4px;
  border: 1.5px solid var(--border-strong);
  background: var(--bg-surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s ease;
  flex-shrink: 0;
}

.black-box.checked {
  background: var(--ink-primary);
  border-color: var(--ink-primary);
  color: var(--ink-inverse);
}

.focus-check-meta {
  font-size: 11.5px;
  color: var(--ink-muted);
}

/* 侧栏 · 今日循环进度卡（对应参考图 Focus goal 卡片） */
.loop-goal-card {
  margin-top: auto;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 13px;
  box-shadow: var(--shadow-card);
}

.loop-goal-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 11.5px;
  color: var(--ink-muted);
  margin-bottom: 5px;
}

.loop-goal-top strong {
  color: var(--ink-primary);
  font-weight: 600;
}

.loop-goal-val {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-primary);
  margin-bottom: 9px;
}

.loop-goal-val span {
  font-weight: 400;
  color: var(--ink-muted);
  font-size: 12px;
}

.progress-track {
  height: 4px;
  border-radius: var(--radius-pill);
  background: var(--bg-track);
  overflow: hidden;
}

.progress-fill {
  height: 100%;
  border-radius: var(--radius-pill);
  background: var(--blue-primary);
  transition: width 0.35s cubic-bezier(0.22, 1, 0.36, 1);
}

/* 侧栏底部状态条 */
.sidebar-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 6px 2px;
  border-top: 1px solid var(--border);
}

.owner-info {
  display: flex;
  align-items: center;
  gap: 8px;
}

.owner-avatar {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--blue-tint);
  color: var(--blue-primary);
  border: 1px solid var(--blue-light);
  font-size: 12px;
  font-weight: 600;
  display: grid;
  place-items: center;
  position: relative;
}

.owner-avatar::after {
  content: "";
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--blue-primary);
  border: 2px solid var(--bg-sidebar);
}

.owner-name {
  font-size: 12.5px;
  font-weight: 600;
  line-height: 1.2;
}

.owner-sub {
  font-size: 11px;
  color: var(--ink-muted);
}

.footer-tools {
  display: flex;
  align-items: center;
  gap: 4px;
}

.icon-btn {
  width: 28px;
  height: 28px;
  border-radius: 7px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: var(--ink-secondary);
  border: 1px solid transparent;
  transition: all 0.15s;
}

.icon-btn:hover {
  background: var(--bg-hover);
  color: var(--ink-primary);
}

.icon-btn.active {
  background: var(--blue-tint);
  color: var(--blue-primary);
  border-color: var(--blue-light);
}

/* ==================== 右侧主视口 ==================== */
.main-pane {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
  background: var(--bg-main);
}

/* 顶栏（参照参考图精炼单行顶栏） */
.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px 24px 14px;
  gap: 16px;
  flex-shrink: 0;
}

.topbar-title-wrap h1 {
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
  color: var(--ink-primary);
}

.topbar-sub {
  font-size: 12px;
  color: var(--ink-muted);
  margin-top: 2px;
}

.topbar-controls {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.pill-group {
  display: inline-flex;
  align-items: center;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  height: 32px;
  overflow: hidden;
}

.pill-group button {
  height: 100%;
  padding: 0 9px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-secondary);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  transition: background 0.15s, color 0.15s;
}

.pill-group button:hover:not(:disabled) {
  background: var(--bg-subtle);
  color: var(--ink-primary);
}

.pill-group button:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

.pill-group .date-label {
  padding: 0 10px;
  color: var(--ink-primary);
  font-weight: 500;
  min-width: 68px;
  text-align: center;
}

.segmented {
  display: inline-flex;
  align-items: center;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: 2px;
  height: 32px;
}

.segmented button {
  height: 26px;
  padding: 0 11px;
  border-radius: 7px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-secondary);
  transition: all 0.15s;
}

.segmented button.active {
  background: var(--bg-surface);
  color: var(--ink-primary);
  box-shadow: var(--shadow-active);
}

.btn-outline {
  height: 32px;
  padding: 0 11px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--ink-primary);
  font-size: 12.5px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: all 0.15s;
}

.btn-outline:hover {
  border-color: var(--border-hover);
  background: var(--bg-subtle);
}

.btn-primary {
  height: 34px;
  padding: 0 14px;
  border-radius: var(--radius-md);
  background: var(--ink-primary);
  color: var(--ink-inverse);
  font-size: 12.5px;
  font-weight: 500;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  transition: opacity 0.15s, transform 0.1s;
}

.btn-primary:hover {
  opacity: 0.88;
}

.btn-primary:active {
  transform: scale(0.98);
}

.bell-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-surface);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  position: relative;
  color: var(--ink-secondary);
}

.bell-btn:hover {
  border-color: var(--border-hover);
  color: var(--ink-primary);
}

.bell-dot {
  position: absolute;
  top: 6px;
  right: 7px;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue-primary);
}

/* ==================== 滚动主画布 ==================== */
.main-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 24px 28px;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 四格一体 KPI 条（完全参照参考图顶部 4 等分白卡） */
.kpi-strip {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-card);
  overflow: hidden;
  flex-shrink: 0;
}

.kpi-cell {
  padding: 14px 18px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  gap: 8px;
  position: relative;
}

.kpi-cell + .kpi-cell {
  border-left: 1px solid var(--border);
}

.kpi-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
}

.kpi-body {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 10px;
}

.kpi-num-wrap {
  display: flex;
  align-items: baseline;
  gap: 7px;
}

.kpi-num {
  font-size: 24px;
  font-weight: 600;
  line-height: 1.1;
  letter-spacing: -0.025em;
  color: var(--ink-primary);
}

.kpi-num small {
  font-size: 14px;
  font-weight: 500;
  color: var(--ink-muted);
}

.kpi-tag {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 6px;
  background: var(--blue-tint);
  color: var(--blue-primary);
}

.kpi-tag.neutral {
  background: var(--bg-subtle);
  color: var(--ink-secondary);
  font-weight: 500;
}

.kpi-sub {
  font-size: 12px;
  color: var(--ink-muted);
}

/* 迷你微图表 */
.mini-dots {
  display: flex;
  align-items: center;
  gap: 4px;
  padding-bottom: 4px;
}

.mini-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  border: 1.5px solid var(--border-strong);
  background: transparent;
}

.mini-dot.done {
  background: var(--blue-primary);
  border-color: var(--blue-primary);
}

.mini-dot.partial {
  background: var(--blue-soft);
  border-color: var(--blue-mid);
}

.mini-bars {
  display: flex;
  align-items: flex-end;
  gap: 3px;
  height: 24px;
}

.mini-bars span {
  width: 4px;
  border-radius: 2px;
  background: var(--bg-track);
  transition: height 0.25s, background 0.25s;
}

.mini-bars span.filled {
  background: var(--blue-primary);
}

/* ==================== 两栏主体工作台 (64% / 36%) ==================== */
.workspace-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.72fr) minmax(320px, 1fr);
  gap: 16px;
  align-items: start;
}

@media (max-width: 1160px) {
  .workspace-grid {
    grid-template-columns: 1fr;
  }
}

.col-stack {
  display: flex;
  flex-direction: column;
  gap: 14px;
  min-width: 0;
}

/* 通用卡片 */
.card {
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 16px 18px;
  box-shadow: var(--shadow-card);
}

.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 12px;
}

.card-title-group {
  display: flex;
  align-items: baseline;
  gap: 8px;
  flex-wrap: wrap;
}

.card-title {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-primary);
  letter-spacing: -0.01em;
}

.card-sub {
  font-size: 12px;
  color: var(--ink-muted);
}

.card-action-link {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-secondary);
  padding: 3px 8px;
  border-radius: 6px;
  transition: all 0.15s;
}

.card-action-link:hover {
  background: var(--bg-subtle);
  color: var(--ink-primary);
}

/* 区块 A · 昨日那一条调整（置顶柔蓝焦点条） */
.adjustment-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  background: var(--blue-tint);
  border: 1px solid var(--blue-light);
  border-left: 3px solid var(--blue-primary);
  border-radius: var(--radius-lg);
  padding: 12px 16px;
  transition: all 0.2s;
}

.adjustment-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
}

.adj-badge {
  font-size: 11px;
  font-weight: 600;
  color: var(--blue-primary);
  background: var(--bg-surface);
  border: 1px solid var(--blue-light);
  padding: 2px 8px;
  border-radius: var(--radius-pill);
  flex-shrink: 0;
}

.adj-text {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-primary);
}

.adj-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

.chip-btn {
  height: 26px;
  padding: 0 10px;
  border-radius: 7px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--ink-secondary);
  transition: all 0.15s;
}

.chip-btn:hover {
  border-color: var(--border-hover);
  color: var(--ink-primary);
}

.chip-btn.active-black {
  background: var(--ink-primary);
  border-color: var(--ink-primary);
  color: var(--ink-inverse);
}

.chip-btn.active-blue {
  background: var(--blue-primary);
  border-color: var(--blue-primary);
  color: #ffffff;
}

/* 区块 B · 习惯列表 */
.habit-list {
  display: flex;
  flex-direction: column;
}

.habit-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 9px 8px;
  margin: 0 -8px;
  border-radius: var(--radius-md);
  transition: background 0.25s ease;
}

.habit-row + .habit-row {
  border-top: 1px solid var(--border);
}

.habit-row.flash {
  background: var(--blue-tint);
}

.habit-info {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}

.habit-name {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-primary);
}

.cat-tag {
  font-size: 11px;
  color: var(--ink-muted);
  background: var(--bg-subtle);
  padding: 1px 7px;
  border-radius: 5px;
  flex-shrink: 0;
}

.habit-right {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-shrink: 0;
}

.week-dots {
  display: flex;
  gap: 3px;
}

.week-dot {
  width: 7px;
  height: 14px;
  border-radius: 2.5px;
  background: var(--bg-track);
}

.week-dot.l2 { background: var(--blue-light); }
.week-dot.l3 { background: var(--blue-mid); }
.week-dot.l4 { background: var(--blue-primary); }

.tri-switch {
  display: inline-flex;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 2px;
  gap: 2px;
}

.tri-switch button {
  padding: 3px 8px;
  font-size: 11.5px;
  font-weight: 500;
  border-radius: 6px;
  color: var(--ink-muted);
  transition: all 0.14s;
}

.tri-switch button:hover {
  color: var(--ink-primary);
}

.tri-switch button.s-done {
  background: var(--blue-primary);
  color: #ffffff;
}

.tri-switch button.s-partial {
  background: var(--blue-light);
  color: var(--blue-primary);
}

.tri-switch button.s-missed {
  background: var(--ink-primary);
  color: var(--ink-inverse);
}

/* 区块 C · 信号（单条 4 格 + 多条标签流） */
.signal-singles {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 10px;
  margin-bottom: 14px;
}

@media (max-width: 780px) {
  .signal-singles {
    grid-template-columns: repeat(2, 1fr);
  }
}

.signal-box {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 11px 12px;
  background: var(--bg-surface);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.25s;
  position: relative;
}

.signal-box:hover {
  border-color: var(--border-hover);
}

.signal-box.flash {
  background: var(--blue-tint);
  border-color: var(--blue-primary);
}

.signal-box-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--ink-muted);
}

.rule-mini {
  font-size: 10px;
  font-weight: 600;
  padding: 1px 5px;
  border-radius: 4px;
  background: var(--blue-tint);
  color: var(--blue-primary);
}

.signal-val {
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink-primary);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
}

.signal-sub {
  font-size: 11.5px;
  color: var(--ink-muted);
}

.score-dots {
  display: flex;
  gap: 5px;
  align-items: center;
  margin-top: 2px;
}

.score-dot {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--bg-track);
  border: 1px solid var(--border);
  transition: all 0.15s;
}

.score-dot.on {
  background: var(--blue-primary);
  border-color: var(--blue-primary);
}

.score-dot:hover {
  transform: scale(1.15);
}

.signal-streams {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}

.stream-row {
  display: grid;
  grid-template-columns: 58px 1fr;
  align-items: start;
  gap: 10px;
}

.stream-label {
  font-size: 12px;
  font-weight: 500;
  color: var(--ink-muted);
  padding-top: 5px;
}

.stream-pills {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
  align-items: center;
}

.sig-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 10px;
  border-radius: 8px;
  font-size: 12.5px;
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--ink-primary);
  transition: all 0.25s;
}

.sig-pill strong {
  font-size: 11px;
  font-weight: 600;
  color: var(--blue-primary);
}

.sig-pill.empty {
  border-style: dashed;
  color: var(--ink-muted);
  background: transparent;
  cursor: pointer;
}

.sig-pill.empty:hover {
  border-color: var(--blue-primary);
  color: var(--blue-primary);
  background: var(--blue-tint);
}

.sig-pill.none-today {
  background: var(--bg-subtle);
  border-color: transparent;
  color: var(--ink-muted);
}

.sig-pill.extra {
  border-color: var(--blue-light);
  background: var(--blue-tint);
}

.sig-pill.flash {
  background: var(--blue-tint);
  border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-ring);
}

.add-mini-btn {
  height: 28px;
  padding: 0 9px;
  border-radius: 8px;
  font-size: 12px;
  color: var(--ink-muted);
  border: 1px dashed var(--border);
  transition: all 0.15s;
}

.add-mini-btn:hover {
  color: var(--ink-primary);
  border-color: var(--border-hover);
  background: var(--bg-subtle);
}

/* 区块 D · 今日任务 & 晚间收口 */
.task-quick-add {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
}

.text-input {
  flex: 1;
  height: 34px;
  padding: 0 11px;
  border-radius: var(--radius-md);
  border: 1px solid var(--border);
  background: var(--bg-surface);
  font-size: 13px;
  color: var(--ink-primary);
  transition: border-color 0.15s, box-shadow 0.15s;
}

.text-input:focus {
  border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-ring);
}

.text-input::placeholder {
  color: var(--ink-muted);
}

.task-list {
  display: flex;
  flex-direction: column;
}

.task-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 6px;
  margin: 0 -6px;
  border-radius: var(--radius-md);
  transition: background 0.2s;
}

.task-row + .task-row {
  border-top: 1px solid var(--border);
}

.task-row:hover {
  background: var(--bg-subtle);
}

.task-row.flash {
  background: var(--blue-tint);
}

.task-left {
  display: flex;
  align-items: center;
  gap: 10px;
  min-width: 0;
  cursor: pointer;
  flex: 1;
}

.task-title {
  font-size: 13.5px;
  color: var(--ink-primary);
}

.task-row.done .task-title {
  color: var(--ink-muted);
  text-decoration: line-through;
}

.imp-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--blue-primary);
  flex-shrink: 0;
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 4px;
  opacity: 0;
  transition: opacity 0.15s;
}

.task-row:hover .task-actions {
  opacity: 1;
}

.task-mini-btn {
  padding: 3px 7px;
  border-radius: 6px;
  font-size: 11.5px;
  color: var(--ink-secondary);
  background: var(--bg-surface);
  border: 1px solid var(--border);
}

.task-mini-btn:hover {
  border-color: var(--blue-primary);
  color: var(--blue-primary);
}

/* 晚间收口双句卡 */
.closing-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
}

@media (max-width: 780px) {
  .closing-grid {
    grid-template-columns: 1fr;
  }
}

.closing-slot {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 12px 13px;
  background: var(--bg-subtle);
  display: flex;
  flex-direction: column;
  gap: 6px;
  transition: all 0.2s;
}

.closing-slot.filled {
  background: var(--bg-surface);
  border-color: var(--border-hover);
}

.closing-slot.flash {
  border-color: var(--blue-primary);
  background: var(--blue-tint);
}

.closing-label {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  font-weight: 600;
  color: var(--ink-primary);
}

.closing-label span {
  font-weight: 400;
  color: var(--ink-muted);
  font-size: 11px;
}

.closing-input {
  width: 100%;
  border: none;
  background: transparent;
  font-size: 13px;
  color: var(--ink-primary);
  resize: none;
  line-height: 1.5;
  min-height: 42px;
}

.closing-input::placeholder {
  color: var(--ink-muted);
}

/* ==================== 右侧伴随栏（参照参考图 Ask Tempra + Open requests） ==================== */
.ask-card {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.ask-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.ask-brand {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14.5px;
  font-weight: 600;
}

.ask-logo {
  width: 20px;
  height: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 2px;
}

.ask-logo span {
  border-radius: 2px;
  background: var(--ink-primary);
}

.ask-logo span:nth-child(2) {
  background: var(--blue-primary);
}

.chat-stream {
  display: flex;
  flex-direction: column;
  gap: 11px;
  max-height: 360px;
  overflow-y: auto;
  padding-right: 2px;
}

.msg-user {
  background: var(--bg-subtle);
  color: var(--ink-primary);
  padding: 10px 13px;
  border-radius: 11px;
  font-size: 13px;
  line-height: 1.5;
}

.extract-strip {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 8px;
  font-size: 12px;
  color: var(--blue-primary);
  padding: 2px 2px;
}

.extract-strip-left {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  line-height: 1.45;
}

.extract-undo {
  font-size: 11.5px;
  color: var(--ink-muted);
  text-decoration: underline;
  flex-shrink: 0;
}

.extract-undo:hover {
  color: var(--ink-primary);
}

.msg-bot {
  font-size: 13px;
  color: var(--ink-secondary);
  line-height: 1.55;
  padding: 0 2px;
}

.msg-bot strong {
  color: var(--ink-primary);
  font-weight: 600;
}

.try-chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.try-chip {
  font-size: 11.5px;
  padding: 4px 9px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg-surface);
  color: var(--ink-secondary);
  transition: all 0.15s;
}

.try-chip:hover {
  border-color: var(--blue-primary);
  color: var(--blue-primary);
  background: var(--blue-tint);
}

.chat-composer {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 5px 6px 5px 11px;
  border: 1px solid var(--border);
  border-radius: 11px;
  background: var(--bg-surface);
  transition: border-color 0.15s, box-shadow 0.15s;
}

.chat-composer:focus-within {
  border-color: var(--blue-primary);
  box-shadow: 0 0 0 3px var(--blue-ring);
}

.chat-composer input {
  flex: 1;
  border: none;
  background: transparent;
  font-size: 13px;
  min-width: 0;
}

.send-circle {
  width: 28px;
  height: 28px;
  border-radius: 8px;
  background: var(--ink-primary);
  color: var(--ink-inverse);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: opacity 0.15s;
}

.send-circle:hover { opacity: 0.85; }

/* 晚间复盘一次一项卡片 */
.review-step-box {
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 13px 14px;
  background: var(--bg-surface);
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.review-progress-meta {
  display: flex;
  justify-content: space-between;
  font-size: 11.5px;
  color: var(--ink-muted);
}

.review-question {
  font-size: 13.5px;
  font-weight: 500;
  color: var(--ink-primary);
  line-height: 1.5;
}

.review-cta-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

/* 右下卡 · 规则与提醒（参照参考图 Open requests） */
.rule-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 11px;
  border-radius: var(--radius-md);
  background: var(--bg-subtle);
}

.rule-item + .rule-item {
  margin-top: 8px;
}

.rule-item.plain {
  background: transparent;
  border: 1px solid var(--border);
}

.rule-title {
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-primary);
}

.rule-sub {
  font-size: 11.5px;
  color: var(--ink-muted);
  margin-top: 1px;
}

.status-pill {
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 7px;
  flex-shrink: 0;
}

.status-pill.blue {
  background: var(--blue-tint);
  color: var(--blue-primary);
  border: 1px solid var(--blue-light);
}

.status-pill.gray {
  background: var(--bg-surface);
  color: var(--ink-secondary);
  border: 1px solid var(--border);
}

/* ==================== 汇总页：热力矩阵 & 分布条（致敬参考图主视觉） ==================== */
.matrix-legend {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  color: var(--ink-muted);
}

.legend-swatches {
  display: flex;
  gap: 3px;
}

.legend-swatches span {
  width: 10px;
  height: 10px;
  border-radius: 3px;
}

.matrix-wrap {
  position: relative;
  overflow-x: auto;
  padding-bottom: 4px;
}

.matrix-grid {
  display: grid;
  gap: 6px;
  align-items: center;
}

.matrix-col-head {
  font-size: 11.5px;
  font-weight: 500;
  color: var(--ink-muted);
  text-align: center;
  padding-bottom: 4px;
}

.matrix-col-head.today-col {
  color: var(--blue-primary);
  font-weight: 600;
}

.matrix-row-label {
  font-size: 12.5px;
  font-weight: 500;
  color: var(--ink-secondary);
  padding-right: 8px;
  white-space: nowrap;
}

.m-cell {
  height: 36px;
  border-radius: 8px;
  background: var(--bg-subtle);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11.5px;
  font-weight: 600;
  color: transparent;
  transition: transform 0.12s ease, box-shadow 0.15s ease;
  position: relative;
}

.m-cell:hover {
  transform: translateY(-1px);
  box-shadow: 0 0 0 2px var(--blue-primary);
  z-index: 2;
}

.m-cell.l0 { background: var(--hatch); }
.m-cell.l1 { background: #e8eefc; }
.m-cell.l2 { background: #bfdbfe; }
.m-cell.l3 { background: #60a5fa; color: #ffffff; }
.m-cell.l4 { background: #2563eb; color: #ffffff; }

html.dark .m-cell.l1 { background: rgba(59, 130, 246, 0.16); }
html.dark .m-cell.l2 { background: rgba(59, 130, 246, 0.34); }
html.dark .m-cell.l3 { background: rgba(59, 130, 246, 0.65); }
html.dark .m-cell.l4 { background: #3b82f6; }

/* 月视图紧凑方块 */
.month-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 7px;
}

.month-cell {
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 8px 9px;
  min-height: 62px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  transition: all 0.15s;
}

.month-cell:hover {
  border-color: var(--blue-primary);
  transform: translateY(-1px);
}

.month-cell.is-today {
  border-color: var(--blue-primary);
  box-shadow: 0 0 0 1px var(--blue-primary);
}

.month-day-num {
  font-size: 12px;
  font-weight: 600;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.month-mini-bar {
  height: 5px;
  border-radius: 99px;
  background: var(--bg-track);
  overflow: hidden;
}

.month-mini-bar i {
  display: block;
  height: 100%;
  border-radius: 99px;
  background: var(--blue-primary);
}

/* 悬浮详情气泡（完全复刻参考图 Thu 29 浮层卡） */
.matrix-popover {
  position: fixed;
  z-index: 60;
  width: 248px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px 14px;
  box-shadow: var(--shadow-popover);
  pointer-events: none;
  opacity: 0;
  transform: translateY(4px);
  transition: opacity 0.14s ease, transform 0.14s ease;
}

.matrix-popover.visible {
  opacity: 1;
  transform: translateY(0);
}

.pop-head {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink-primary);
  margin-bottom: 6px;
  display: flex;
  justify-content: space-between;
}

.pop-line {
  font-size: 12px;
  color: var(--ink-secondary);
  margin-top: 4px;
  line-height: 1.45;
}

.pop-hint {
  margin-top: 8px;
  padding-top: 6px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--blue-primary);
  font-weight: 500;
}

/* 分布水平条（参照参考图 Load per person） */
.dist-list {
  display: flex;
  flex-direction: column;
  gap: 11px;
}

.dist-row {
  display: grid;
  grid-template-columns: 126px 1fr 94px;
  align-items: center;
  gap: 12px;
}

.dist-name {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ink-primary);
}

.dist-badge {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  color: var(--ink-secondary);
  font-size: 11px;
  font-weight: 600;
  display: grid;
  place-items: center;
  flex-shrink: 0;
}

.dist-track {
  height: 7px;
  border-radius: var(--radius-pill);
  background: var(--bg-subtle);
  overflow: hidden;
  display: flex;
}

.dist-fill-main {
  height: 100%;
  background: var(--blue-primary);
  border-radius: var(--radius-pill);
}

.dist-fill-part {
  height: 100%;
  background: var(--blue-soft);
}

.dist-stat {
  text-align: right;
  font-size: 12px;
  color: var(--ink-secondary);
}

.dist-stat strong {
  color: var(--ink-primary);
  font-weight: 600;
}

/* 周/月右侧回看卡 */
.log-review-item {
  padding: 11px 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-md);
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.log-review-item + .log-review-item {
  margin-top: 9px;
}

.log-review-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  font-weight: 600;
}

.log-review-line {
  font-size: 12.5px;
  color: var(--ink-secondary);
  line-height: 1.5;
}

.log-review-line b {
  font-weight: 600;
  color: var(--ink-primary);
  margin-right: 5px;
}

/* ==================== 番茄专注 / 规则 / 设置等二级视图 ==================== */
.pomo-layout {
  display: grid;
  grid-template-columns: 1.35fr 1fr;
  gap: 16px;
}

@media (max-width: 960px) {
  .pomo-layout { grid-template-columns: 1fr; }
}

.pomo-stage {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 32px 24px;
  gap: 20px;
}

.pomo-ring-wrap {
  position: relative;
  width: 210px;
  height: 210px;
  display: grid;
  place-items: center;
}

.pomo-ring-wrap svg {
  transform: rotate(-90deg);
}

.pomo-time {
  position: absolute;
  text-align: center;
}

.pomo-time strong {
  display: block;
  font-size: 40px;
  font-weight: 600;
  letter-spacing: -0.03em;
  line-height: 1.1;
}

.pomo-time span {
  font-size: 12px;
  color: var(--ink-muted);
}

.switch-pill {
  width: 36px;
  height: 20px;
  border-radius: var(--radius-pill);
  background: var(--bg-track);
  position: relative;
  transition: background 0.2s;
  flex-shrink: 0;
}

.switch-pill::after {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  transition: transform 0.2s;
}

.switch-pill.on {
  background: var(--blue-primary);
}

.switch-pill.on::after {
  transform: translateX(16px);
}

/* ==================== 悬浮桌宠联动预览 ==================== */
.pet-float {
  position: fixed;
  right: 22px;
  bottom: 22px;
  z-index: 50;
  display: none;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.pet-float.open {
  display: flex;
}

.pet-bubble {
  width: 278px;
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 12px 13px;
  box-shadow: var(--shadow-popover);
}

.pet-avatar-btn {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: linear-gradient(145deg, #eff6ff 0%, #dbeafe 55%, #bfdbfe 100%);
  border: 2px solid #ffffff;
  box-shadow: 0 10px 26px rgba(37, 99, 235, 0.22);
  display: grid;
  place-items: center;
  transition: transform 0.2s;
}

.pet-avatar-btn:hover {
  transform: translateY(-2px) scale(1.03);
}

/* ==================== 模态框（⌘K 速记 / 导出 MD） ==================== */
.modal-mask {
  position: fixed;
  inset: 0;
  background: rgba(17, 19, 24, 0.36);
  backdrop-filter: blur(2px);
  z-index: 80;
  display: none;
  align-items: flex-start;
  justify-content: center;
  padding-top: 11vh;
}

.modal-mask.open {
  display: flex;
}

.modal-box {
  width: min(540px, 92vw);
  background: var(--bg-surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  box-shadow: var(--shadow-popover);
  overflow: hidden;
}

.md-pre {
  background: var(--bg-subtle);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 12px 14px;
  font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
  font-size: 12px;
  line-height: 1.6;
  max-height: 360px;
  overflow: auto;
  white-space: pre-wrap;
  color: var(--ink-primary);
}

/* 轻 Toast */
.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(16px);
  background: var(--ink-primary);
  color: var(--ink-inverse);

  opacity: 0;
  pointer-events: none;
  transition: all 0.22s ease;
  z-index: 90;
  box-shadow: var(--shadow-popover);
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.hidden { display: none !important; }

/* 计算今日统计 */
function calcDayMetrics(day) {
  const hTotal = day.habits.length;
  const hDone = day.habits.filter((h) => h.status === "done").length;
  const hPartial = day.habits.filter((h) => h.status === "partial").length;
  const hPending = day.habits.filter((h) => h.status === "pending").length;

  const s = day.signals;
  const sigSlots = [
    s.sleepHours !== null,
    s.mood !== null,
    s.energy !== null,
    s.meals.breakfast !== null,
    s.meals.lunch !== null,
    s.meals.dinner !== null,
    s.exercise.length > 0 || s.exerciseNone
  ];
  const sFilled = sigSlots.filter(Boolean).length;
  const sPending = sigSlots.length - sFilled;

  const tTotal = day.tasks.length;
  const tDone = day.tasks.filter((t) => t.done).length;

  const closingDone = (day.output.trim() ? 1 : 0) + (day.nextAdjustment.trim() ? 1 : 0);
  const totalUnits = hTotal + sigSlots.length + 2;
  const completedUnits = (hDone + hPartial * 0.5) + sFilled + closingDone;
  const pct = Math.min(100, Math.round((completedUnits / totalUnits) * 100));

  return { hTotal, hDone, hPartial, hPending, sFilled, sTotal: sigSlots.length, sPending, sigSlots, tTotal, tDone, closingDone, pct };
}

  day.habits.filter((h) => h.status === "pending").forEach((h) => {

/* 自然语言捕捉引擎（原型演示用：精准演示三对象分离 + 双行写入 + 额外信号） */
function handleCaptureUtterance(rawText, source = "panel") {
  const text = rawText.trim();
  if (!text) return;
  const day = currentDay();
  const actions = [];
  const undoOps = [];
  const flashTargets = [];

  // 1. 识别运动 + 同步核对跑步习惯（不把时长塞进习惯备注，两行分写！）
  if (/跑|慢跑|健身|游泳|骑车|拉伸|散步/.test(text)) {
    const durMatch = text.match(/(\d+)\s*(分钟|分|m|小时|h)/i);
    const actName = text.match(/(跑步|慢跑|健身|游泳|骑车|拉伸|散步)/)?.[1] || "运动";
    const dur = durMatch ? (durMatch[2].includes("小时") || durMatch[2] === "h" ? `${durMatch[1]}h` : `${durMatch[1]}m`) : "30m";
    const entry = `${actName} ${dur}`;
    day.signals.exercise.push(entry);
    day.signals.exerciseNone = false;
    actions.push({ label: `信号·运动 (${entry})`, target: "sig-exercise" });
    flashTargets.push("sig-exercise");
    undoOps.push(() => { day.signals.exercise.pop(); });

    if (/跑/.test(text)) {
      const runHabit = day.habits.find((h) => h.title.includes("跑步"));
      if (runHabit && runHabit.status !== "done") {
        const prev = runHabit.status;
        runHabit.status = "done";
        actions.push({ label: `习惯·${runHabit.title} (完成)`, target: `habit-${runHabit.id}` });
        flashTargets.push(`habit-${runHabit.id}`);
        undoOps.push(() => { runHabit.status = prev; });
      }
    }
  }

  // 2. 识别三餐
  if (/午饭|午餐|中午吃/.test(text)) {
    const prev = day.signals.meals.lunch;
    const cleaned = text.replace(/^(刚|今天)?(午饭|午餐|中午)(吃了|喝了|吃|是)?/, "").trim() || text;
    day.signals.meals.lunch = cleaned;
    actions.push({ label: `信号·午餐 (${cleaned})`, target: "sig-lunch" });
    flashTargets.push("sig-lunch");
    undoOps.push(() => { day.signals.meals.lunch = prev; });
  } else if (/晚饭|晚餐|晚上吃/.test(text)) {
    const prev = day.signals.meals.dinner;
    const cleaned = text.replace(/^(刚|今天)?(晚饭|晚餐|晚上)(吃了|喝了|吃|是)?/, "").trim() || text;
    day.signals.meals.dinner = cleaned;
    actions.push({ label: `信号·晚餐 (${cleaned})`, target: "sig-dinner" });
    flashTargets.push("sig-dinner");
    undoOps.push(() => { day.signals.meals.dinner = prev; });
  } else if (/早饭|早餐|早上吃/.test(text)) {
    const prev = day.signals.meals.breakfast;
    const cleaned = text.replace(/^(刚|今天)?(早饭|早餐|早上)(吃了|喝了|吃|是)?/, "").trim() || text;
    day.signals.meals.breakfast = cleaned;
    actions.push({ label: `信号·早餐 (${cleaned})`, target: "sig-breakfast" });
    flashTargets.push("sig-breakfast");
    undoOps.push(() => { day.signals.meals.breakfast = prev; });
  }

  // 3. 识别加餐 / 额外信号
  if (/加餐|咖啡|美式|拿铁|苹果|水果|零食|奶茶|酸奶/.test(text) && !/早饭|午饭|晚饭/.test(text)) {
    const item = `加餐 · ${text.replace(/^(下午|刚才|刚)?(加餐)?(喝了杯|喝了|吃了点|吃了|吃)?/, "").trim() || text}`;
    day.signals.extraSignals.push(item);
    actions.push({ label: `额外信号 (${item})`, target: "sig-meals" });
    flashTargets.push("sig-meals");
    undoOps.push(() => { day.signals.extraSignals.pop(); });
  }

  // 4. 识别喝水习惯
  if (/喝水|温水/.test(text)) {
    const waterHabit = day.habits.find((h) => h.title.includes("温水"));
    if (waterHabit) {
      const prev = waterHabit.status;
      waterHabit.status = "done";
      actions.push({ label: `习惯·${waterHabit.title} (完成)`, target: `habit-${waterHabit.id}` });
      flashTargets.push(`habit-${waterHabit.id}`);
      undoOps.push(() => { waterHabit.status = prev; });
    }
  }

  // 5. 识别任务
  if (/任务|待办|记得|明天要|别忘了/.test(text)) {
    const title = text.replace(/^(记个任务|加个任务|任务|待办|记得|别忘了)[：:\s]*/g, "").trim() || text;
    const newTask = { id: "t" + Date.now(), title, tag: /AI|模型|语音|原型|代码/.test(title) ? "AI 手艺" : "日常", important: false, done: false };
    day.tasks.unshift(newTask);
    actions.push({ label: `今日任务 (${title})`, target: `task-${newTask.id}` });
    flashTargets.push(`task-${newTask.id}`);
    undoOps.push(() => { day.tasks = day.tasks.filter((t) => t.id !== newTask.id); });
  }

  // 6. 识别身体 / 睡眠
  if (/睡了\s*(\d+(\.\d+)?)/.test(text)) {
    const hrs = parseFloat(text.match(/睡了\s*(\d+(\.\d+)?)/)[1]);
    const prev = day.signals.sleepHours;
    day.signals.sleepHours = hrs;
    actions.push({ label: `信号·睡眠 (${hrs}h)`, target: "sig-sleep" });
    flashTargets.push("sig-sleep");
    undoOps.push(() => { day.signals.sleepHours = prev; });
  }
  if (/头疼|累|精神不错|放松|腰酸|胃|舒服|犯困/.test(text)) {
    const label = text.slice(0, 14);
    day.signals.body.push(label);
    actions.push({ label: `信号·身体 (${label})`, target: "sig-body" });
    flashTargets.push("sig-body");
    undoOps.push(() => { day.signals.body.pop(); });
  }

  // 默认兜底：作为额外信号写入，演示“对话捕捉”的即时反馈
  if (actions.length === 0) {
    const note = `记录 · ${text.slice(0, 18)}`;
    day.signals.extraSignals.push(note);
    actions.push({ label: `额外信号 (${note})`, target: "sig-meals" });
    flashTargets.push("sig-meals");
    undoOps.push(() => { day.signals.extraSignals.pop(); });
  }

  const msgId = "m" + Date.now();
  state.chat.push({ id: msgId + "u", role: "user", text });
  state.chat.push({
    id: msgId + "b",
    role: "bot",
    extracted: actions,
    undo: () => {
      undoOps.forEach((fn) => fn());
      state.chat = state.chat.filter((m) => m.id !== msgId + "b");
      showToast("已撤销刚才的清单写入");
      render();
    },
    text: actions.length > 1
      ? "已经按事实与承诺分开填进左侧清单了（两行独立记录，互不混写）。"
      : "已实时写入今天的清单，你可以随时点「撤销」改回去。"
  });

  if (source === "pet") {
    $("#petReplyText").textContent = "收到啦，已经同步填进今天的清单。";
    const tag = $("#petConfirmTag");
    tag.textContent = "✓ 已填入 · " + actions.map((a) => a.label).join(" · ");
    tag.classList.remove("hidden");
  }

  triggerFlash(flashTargets);
  render();
  setTimeout(() => {
    const stream = $("#chatStream");
    if (stream) stream.scrollTop = stream.scrollHeight;
  }, 20);
}

/* ==================== 更新侧边栏同步态 & 顶栏 ==================== */
function syncChrome() {
  const day = currentDay();
  const m = calcDayMetrics(day);

  // 侧边栏激活项
  $$(".nav-item").forEach((btn) => {
    const key = btn.dataset.nav;
    const isActive = (state.nav === key) || (state.nav === "today" && state.period !== "day" && key === "summary");
    btn.classList.toggle("active", state.nav === "today" && state.period !== "day" ? key === "summary" : key === state.nav);
  });

  // 待核对角标
  const pendingCount = m.hPending + m.sPending;
  const badge = $("#navPendingBadge");
  badge.textContent = pendingCount > 0 ? pendingCount : "✓";
  badge.classList.toggle("muted", pendingCount === 0);

  $("#sideLoopSummary").innerHTML = `${m.hDone} 习惯 <span>· ${m.sFilled} 信号 · ${day.signals.pomodoros} 番茄</span>`;
  $("#sideLoopBar").style.width = `${m.pct}%`;

  // 桌宠与主题按钮态
  $("#togglePetBtn").classList.toggle("active", state.petOpen);
  $("#petStatusSub").textContent = state.petOpen ? "服务在线 · 桌宠展开中" : "服务在线 · 桌宠待机";

  // 顶栏文案与控件显隐
  const isLoopView = state.nav === "today" || state.nav === "summary";
  $("#dateNavGroup").classList.toggle("hidden", !isLoopView || state.period !== "day");
  $("#periodSwitch").classList.toggle("hidden", !isLoopView);
  $("#exportMdBtn").classList.toggle("hidden", !isLoopView);

  $$("#periodSwitch button").forEach((b) => b.classList.toggle("active", b.dataset.period === state.period));

  if (state.nav === "today" && state.period === "day") {
    $("#pageTitle").textContent = day.label;
    $("#pageSub").textContent = `${day.fullDateLabel || day.date} · 第 ${day.loopDay} 天正循环 · 晚间复盘 21:30`;
    $("#todayJumpBtn").textContent = state.dayIndex === 2 ? "今天" : day.date.slice(5);
    $("#prevDayBtn").disabled = state.dayIndex <= 0;
    $("#nextDayBtn").disabled = state.dayIndex >= state.days.length - 1;
  } else if (state.period === "week" && isLoopView) {
    $("#pageTitle").textContent = "本周汇总";
    $("#pageSub").textContent = "2026年11月16日 – 11月22日 · 事实聚合（不产生第二条调整，不下 AI 建议）";
  } else if (state.period === "month" && isLoopView) {
    $("#pageTitle").textContent = "本月汇总";
    $("#pageSub").textContent = "2026年11月 · 22 天循环轨迹与信号分布";
  } else {
    const titles = {
      focus: ["番茄专注", "结束一轮后自动累计写入今日「信号 · 番茄钟个数」"],
      chat: ["对话与通话", "支持长对话、语音输入与实时语音通话 · 对话中仍自动捕捉可记录事实"],
      manage: ["习惯与任务", "重复承诺走习惯，一次性事务走任务池 · 淘汰「学习成长」混用分类"],
      rules: ["规则", "第一版零内置 · 主人用一句话定义触发条件，成立时仅做克制蓝标"],
      settings: ["记忆与设置", "统一白蓝黑表单体系 · 保留大模型、语音、离线唤醒与桌宠全部工程能力"]
    };
    $("#pageTitle").textContent = titles[state.nav][0];
    $("#pageSub").textContent = titles[state.nav][1];
  }
}

function renderMealPill(short, key, val, flashCls) {
  if (val === "__NONE__") {
    return `<span class="sig-pill none-today${flashCls}" data-edit-meal="${key}" style="cursor:pointer"><strong>${short}</strong>今天没有</span>`;
  }
  if (!val) {
    return `<button class="sig-pill empty${flashCls}" data-edit-meal="${key}"><strong>${short}</strong>待记录</button>`;
  }
  return `<span class="sig-pill${flashCls}" data-edit-meal="${key}" style="cursor:pointer" title="点击修改"><strong>${short}</strong>${val}</span>`;
}

function renderEveningReviewPanel(day) {
  const queue = getReviewQueue(day);
  if (queue.length === 0) {
    return `
      <div class="review-step-box" style="background:var(--blue-tint);border-color:var(--blue-light)">
        <div style="display:flex;align-items:center;gap:8px;color:var(--blue-primary);font-weight:600;font-size:13.5px">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="m3 8.5 3.2 3.2L13 4.8"/></svg>
          今天的正循环已全部收口
        </div>
        <p style="font-size:12.5px;color:var(--ink-secondary);line-height:1.55">
          所有空格都已确认，明日调整已写入。明天打开「今天」时，它会置顶提醒你。
        </p>
        <button class="btn-outline" data-right-mode="capture" style="align-self:flex-start">切回自由对话捕捉</button>
      </div>
    `;
  }
  const idx = Math.min(state.reviewStep, queue.length - 1);
  const item = queue[idx];
  const pct = Math.round(((idx + 1) / queue.length) * 100);

  return `
    <div class="review-step-box">
      <div class="review-progress-meta tnum">
        <span>${item.title}</span>
        <span>剩余 ${queue.length} 项 · 一次一项</span>
      </div>
      <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>

function bindTodayEvents() {
  const day = currentDay();

  $$("[data-adj]").forEach((btn) => btn.addEventListener("click", () => {
    const val = btn.dataset.adj;
    day.prevAdjustment.status = day.prevAdjustment.status === val ? "pending" : val;
    showToast(day.prevAdjustment.status === "done" ? "昨日调整已标为「已践行」" : "已更新昨日调整状态");
    render();
  }));

  $$("[data-habit]").forEach((btn) => btn.addEventListener("click", () => {
    const h = day.habits.find((x) => x.id === btn.dataset.habit);
    if (!h) return;
    h.status = h.status === btn.dataset.status ? "pending" : btn.dataset.status;
    render();
  }));

  $$("[data-score-field]").forEach((btn) => btn.addEventListener("click", () => {
    day.signals[btn.dataset.scoreField] = Number(btn.dataset.score);
    render();
  }));

  $("#sig-sleep")?.addEventListener("click", () => {
    const val = prompt("输入昨晚睡眠时长（小时，例如 5.8 或 7.5）：", day.signals.sleepHours ?? "");
    if (val === null) return;
    const num = parseFloat(val);
    if (!Number.isNaN(num)) {
      day.signals.sleepHours = num;
      triggerFlash(["sig-sleep"]);
      showToast(num < 6 ? `睡眠已改为 ${num}h（触发规则标记）` : `睡眠已改为 ${num}h`);
      render();
    }
  });

  $$("[data-edit-meal]").forEach((el) => el.addEventListener("click", () => {
    const key = el.dataset.editMeal;
    const names = { breakfast: "早餐", lunch: "午餐", dinner: "晚餐" };
    const cur = day.signals.meals[key];
    const val = prompt(`记录今日${names[key]}（留空清除，输入「没有」标为今天没有）：`, cur === "__NONE__" ? "" : (cur || ""));
    if (val === null) return;
    day.signals.meals[key] = val.trim() === "没有" ? "__NONE__" : (val.trim() || null);
    triggerFlash(["sig-" + key]);
    render();
  }));

  $("#quickExtraSigBtn")?.addEventListener("click", () => {
    const val = prompt("新增一条额外信号（例如：加餐 · 苹果一个）：");
    if (val && val.trim()) {
      day.signals.extraSignals.push(val.trim());
      triggerFlash(["sig-meals"]);
      render();
    }
  });

  $("#addExerciseBtn")?.addEventListener("click", () => {
    const val = prompt("记录运动事实（例如：跑步 30m）：");
    if (val && val.trim()) {
      day.signals.exercise.push(val.trim());
      day.signals.exerciseNone = false;
      triggerFlash(["sig-exercise"]);
      render();
    }
  });

  $("#addBodyBtn")?.addEventListener("click", () => {
    const val = prompt("记录身体状态（例如：眼睛微干 / 精力充沛）：");
    if (val && val.trim()) {
      day.signals.body.push(val.trim());
      triggerFlash(["sig-body"]);
      render();
    }
  });

  $("#taskAddForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const text = $("#taskAddInput").value.trim();
    if (!text) return;
    day.tasks.unshift({ id: "t" + Date.now(), title: text, tag: "日常", important: false, done: false });
    render();
  });

  $$("[data-toggle-task]").forEach((el) => el.addEventListener("click", () => {
    const t = day.tasks.find((x) => x.id === el.dataset.toggleTask);
    if (t) { t.done = !t.done; render(); }
  }));

  $$("[data-del-task]").forEach((btn) => btn.addEventListener("click", () => {
    day.tasks = day.tasks.filter((x) => x.id !== btn.dataset.delTask);
    render();
  }));

  $$("[data-bind-pomo]").forEach((btn) => btn.addEventListener("click", () => {
    state.pomo.taskTitle = btn.dataset.bindPomo;
    state.nav = "focus";
    showToast(`已绑定专注任务：${state.pomo.taskTitle}`);
    render();
  }));

  $("#outputInput")?.addEventListener("change", (e) => {
    day.output = e.target.value;
    syncChrome();
    render();
  });

  $("#nextAdjInput")?.addEventListener("change", (e) => {
    day.nextAdjustment = e.target.value;
    syncChrome();
    render();
  });

  $$("[data-right-mode]").forEach((btn) => btn.addEventListener("click", () => {
    state.rightMode = btn.dataset.rightMode;
    state.reviewStep = 0;
    render();
  }));

  $("#startReviewNowBtn")?.addEventListener("click", () => {
    state.rightMode = "review";
    state.reviewStep = 0;
    render();
  });

  $$("[data-try]").forEach((btn) => btn.addEventListener("click", () => {
    handleCaptureUtterance(btn.dataset.try);
  }));

  $("#chatForm")?.addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#chatInput");
    handleCaptureUtterance(input.value);
  });

  $("#mockVoiceBtn")?.addEventListener("click", () => {
    showToast("模拟语音识别完成：已填入输入栏");
    const input = $("#chatInput");
    if (input) {
      input.value = "午饭吃了番茄鸡蛋面，然后散步 20 分钟";
      input.focus();
    }
  });

  $$("[data-undo-msg]").forEach((btn) => btn.addEventListener("click", () => {
    const msg = state.chat.find((m) => m.id === btn.dataset.undoMsg);
    if (msg?.undo) msg.undo();
  }));

  // 晚间复盘一次一项绑定
  const queue = getReviewQueue(day);
  const curItem = queue[Math.min(state.reviewStep, Math.max(0, queue.length - 1))];

  $$("[data-rev-habit]").forEach((btn) => btn.addEventListener("click", () => {
    const h = day.habits.find((x) => x.id === btn.dataset.revHabit);
    if (h) {
      h.status = btn.dataset.revVal;
      triggerFlash(["habit-" + h.id]);
      render();
    }
  }));

  $("#reviewConfirmBtn")?.addEventListener("click", () => {
    const val = $("#reviewTextInput")?.value.trim();
    if (!val) { showToast("请先输入一句话，或点击右侧「今天没有 / 先跳过」"); return; }
    if (curItem.kind === "meal") {
      day.signals.meals[curItem.key] = val;
      triggerFlash(["sig-" + curItem.key]);
    } else if (curItem.kind === "exercise") {
      day.signals.exercise.push(val);
      triggerFlash(["sig-exercise"]);
    } else if (curItem.kind === "output") {
      day.output = val;
      triggerFlash(["close-output"]);
    } else if (curItem.kind === "adjustment") {
      day.nextAdjustment = val;
      triggerFlash(["close-adj"]);
    }
    render();
  });

  $("#reviewNoneBtn")?.addEventListener("click", () => {
    if (!curItem) return;
    if (curItem.kind === "meal") {
      day.signals.meals[curItem.key] = "__NONE__";
      triggerFlash(["sig-" + curItem.key]);
      showToast("已记为「今天没有」");
    } else if (curItem.kind === "exercise") {
      day.signals.exerciseNone = true;
      triggerFlash(["sig-exercise"]);
      showToast("已记为「今天没有」");
    } else {
      state.reviewStep = (state.reviewStep + 1) % Math.max(1, queue.length);
      showToast("已暂时跳过这一项");
    }
    render();
  });

  $$("[data-jump]").forEach((btn) => btn.addEventListener("click", () => {
    state.nav = btn.dataset.jump;
    render();
  }));
}

      <span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span>
    </div>
    <div class="month-grid">

        const sc = scores[idx];
        const future = d > 22;
        const isToday = d === 22;
        return `
          <div class="month-cell ${isToday ? "is-today" : ""}" style="${future ? "opacity:0.42" : ""}" data-month-day="${d}">
            <div class="month-day-num tnum">
              <span>${d}</span>

                <div class="month-mini-bar"><i style="width:${sc}%"></i></div>

      }).join("")}

}

function bindSummaryEvents() {
  const pop = $("#matrixPopover");

  $$("[data-day-col]").forEach((cell) => {
    cell.addEventListener("mouseenter", (e) => {
      const col = Number(cell.dataset.dayCol);
      const info = summaries[col];
      pop.innerHTML = `
        <div class="pop-head tnum"><span>${info.date}</span><span style="color:var(--blue-primary)">${info.habits}</span></div>
        <div class="pop-line"><b>${cell.dataset.rowName}</b>：${cell.dataset.rowVal}</div>
        <div class="pop-line">睡眠 ${info.sleep} · 番茄 ${info.pomo}</div>
        <div class="pop-line">调整：${info.adj}</div>
        <div class="pop-hint">点击跳入当天日视图 →</div>
      `;
      const rect = cell.getBoundingClientRect();
      pop.style.left = Math.min(window.innerWidth - 266, Math.max(16, rect.left - 90)) + "px";
      pop.style.top = Math.max(16, rect.top - 138) + "px";
      pop.classList.add("visible");
    });
    cell.addEventListener("mouseleave", () => pop.classList.remove("visible"));
    cell.addEventListener("click", () => {
      pop.classList.remove("visible");
      const col = Number(cell.dataset.dayCol);
      state.dayIndex = col >= 4 ? col - 4 : 2;
      state.nav = "today";
      state.period = "day";
      showToast(`已切换至 ${summaries[col].date} 清单`);
      render();
    });
  });

  $$("[data-goto-today], [data-month-day]").forEach((el) => el.addEventListener("click", () => {
    state.nav = "today";
    state.period = "day";
    state.dayIndex = 2;
    render();
  }));
}

          ${[15, 25, 45].map((min) => `<button class="chip-btn tnum ${p.minutes === min ? "active-blue" : ""}" data-pmin="${min}">${min} 分钟</button>`).join("")}
        </div>

        <div style="display:flex;gap:10px">
          <button class="btn-primary" id="pomoToggleBtn" style="min-width:116px">${p.running ? "暂停" : "开始专注"}</button>
          <button class="btn-outline" id="pomoCompleteDemoBtn">模拟完成 1 轮 (+1 信号)</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <div class="card-title-group">
            <h2 class="card-title">今日番茄记录</h2>
            <span class="card-sub tnum">共 ${p.sessions.length} 个 · 自动同步到信号</span>
          </div>
        </div>
        ${p.sessions.map((s) => `
          <div class="rule-item plain" style="margin-bottom:8px">
            <div>
              <div class="rule-title">${s.task}</div>
              <div class="rule-sub tnum">${s.time} · 专注 ${s.duration} 分钟</div>
            </div>
            <span class="status-pill blue tnum">+1</span>
          </div>
        `).join("")}
      </section>
    </div>
  `;

  $$("[data-pmode]").forEach((b) => b.addEventListener("click", () => { p.mode = b.dataset.pmode; render(); }));
  $$("[data-pmin]").forEach((b) => b.addEventListener("click", () => {
    p.minutes = Number(b.dataset.pmin);
    p.remaining = p.minutes * 60;
    p.running = false;
    clearInterval(pomoTimer);
    render();
  }));
  $("#pomoToggleBtn").addEventListener("click", () => {
    p.running = !p.running;
    clearInterval(pomoTimer);
    if (p.running) {
      pomoTimer = setInterval(() => {
        if (p.remaining > 0) { p.remaining--; syncChrome(); if (state.nav === "focus") renderFocusView(); }
      }, 1000);
    }
    render();
  });
  $("#pomoCompleteDemoBtn").addEventListener("click", () => {
    const now = new Date();
    const tStr = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    p.sessions.unshift({ time: tStr, duration: p.minutes, task: p.taskTitle });
    state.days[2].signals.pomodoros += 1;
    p.running = false;
    clearInterval(pomoTimer);
    p.remaining = p.minutes * 60;
    showToast(`完成 1 轮番茄！今日「信号 · 番茄钟」已自动 +1（当前 ${state.days[2].signals.pomodoros} 个）`);
    render();
  });
}

  }));
}

/* ==================== 导出 Markdown 生成 ==================== */
function buildMarkdown() {
  const day = currentDay();
  const s = day.signals;
  return `# 灵儿每日清单 · ${day.date}

## 昨日调整
- [${day.prevAdjustment.status === "done" ? "x" : " "}] ${day.prevAdjustment.text}

## 习惯（重复承诺）
${day.habits.map((h) => `- ${h.title}（${h.cat}）：${h.status === "done" ? "完成" : h.status === "partial" ? "部分完成" : h.status === "missed" ? "未做" : "待核对"}`).join("\n")}

## 信号（观察事实）
- 睡眠：${s.sleepHours ?? "未记"}h（${s.sleepNote || "-"}）
- 心情：${s.mood ?? "-"}/5 · 精力：${s.energy ?? "-"}/5 · 番茄钟：${s.pomodoros} 个
- 三餐：早=${s.meals.breakfast || "待记录"} ｜ 午=${s.meals.lunch === "__NONE__" ? "今天没有" : (s.meals.lunch || "待记录")} ｜ 晚=${s.meals.dinner === "__NONE__" ? "今天没有" : (s.meals.dinner || "待记录")}
- 运动：${s.exercise.length ? s.exercise.join("、") : (s.exerciseNone ? "今天没有" : "待记录")}
- 身体：${s.body.length ? s.body.join("、") : "—"}
${s.extraSignals.length ? `- 额外信号：${s.extraSignals.join("、")}` : ""}

## 今日任务
${day.tasks.map((t) => `- [${t.done ? "x" : " "}] ${t.title}（${t.tag}）`).join("\n")}

## 晚间收口
- **今日输出**：${day.output || "（待写）"}
- **明日调整**：${day.nextAdjustment || "（待写）"}
`;
}

/* ==================== 全局事件绑定 ==================== */
function bindGlobal() {
  $$(".nav-item").forEach((btn) => btn.addEventListener("click", () => {
    const key = btn.dataset.nav;
    state.nav = key;
    if (key === "today") state.period = "day";
    if (key === "summary" && state.period === "day") state.period = "week";
    render();
  }));

  $$("#periodSwitch button").forEach((btn) => btn.addEventListener("click", () => {
    state.period = btn.dataset.period;
    state.nav = state.period === "day" ? "today" : "summary";
    render();
  }));

  $("#prevDayBtn").addEventListener("click", () => { if (state.dayIndex > 0) { state.dayIndex--; render(); } });
  $("#nextDayBtn").addEventListener("click", () => { if (state.dayIndex < state.days.length - 1) { state.dayIndex++; render(); } });
  $("#todayJumpBtn").addEventListener("click", () => { state.dayIndex = 2; render(); });

  $("#sideAdjToggle").addEventListener("click", () => {
    const d = currentDay();
    d.prevAdjustment.status = d.prevAdjustment.status === "done" ? "pending" : "done";
    render();
  });
  $("#sideReviewToggle").addEventListener("click", () => {
    state.nav = "today"; state.period = "day";
    state.rightMode = state.rightMode === "review" ? "capture" : "review";
    render();
  });
  $("#sideDndToggle").addEventListener("click", () => {
    state.dnd = !state.dnd;
    showToast(state.dnd ? "已开启免打扰模式" : "已关闭免打扰模式");
    render();
  });

  $("#toggleThemeBtn").addEventListener("click", () => {
    state.dark = !state.dark;
    document.documentElement.classList.toggle("dark", state.dark);
    showToast(state.dark ? "已切换至暗黑蓝基调" : "已切换至纯净白蓝黑基调");
  });

  $("#togglePetBtn").addEventListener("click", () => {
    state.petOpen = !state.petOpen;
    $("#petFloat").classList.toggle("open", state.petOpen);
    syncChrome();
  });
  $("#closePetBtn").addEventListener("click", () => {
    state.petOpen = false;
    $("#petFloat").classList.remove("open");
    syncChrome();
  });
  $("#petForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = $("#petInput");
    if (!input.value.trim()) return;
    handleCaptureUtterance(input.value, "pet");
    input.value = "";
  });

  // 导出 MD
  $("#exportMdBtn").addEventListener("click", () => {
    $("#mdPreview").textContent = buildMarkdown();
    $("#mdModal").classList.add("open");
  });
  $("#closeMdBtn").addEventListener("click", () => $("#mdModal").classList.remove("open"));
  $("#copyMdBtn").addEventListener("click", () => {
    navigator.clipboard?.writeText($("#mdPreview").textContent);
    showToast("已复制 Markdown 到剪贴板");
  });
  $("#downloadMdBtn").addEventListener("click", () => {
    const blob = new Blob([$("#mdPreview").textContent], { type: "text/markdown;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `${currentDay().date}-灵儿清单.md`;
    a.click();
    showToast("已开始下载 .md 文件");
  });

  $("#bellBtn").addEventListener("click", () => {
    showToast("今日节点：早安 08:30 · 午间 12:30 · 晚间复盘 21:30 · 睡前 23:00");
  });

  // ⌘K 快捷面板
  const openCmd = () => {
    $("#cmdModal").classList.add("open");
    $("#cmdInput").value = "";
    renderCmdOptions();
    setTimeout(() => $("#cmdInput").focus(), 30);
  };
  $("#openCmdBtn").addEventListener("click", openCmd);
  window.addEventListener("keydown", (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); }
    if (e.key === "Escape") { $("#cmdModal").classList.remove("open"); $("#mdModal").classList.remove("open"); }
  });
  $("#cmdModal").addEventListener("click", (e) => { if (e.target === $("#cmdModal")) $("#cmdModal").classList.remove("open"); });
  $("#mdModal").addEventListener("click", (e) => { if (e.target === $("#mdModal")) $("#mdModal").classList.remove("open"); });

  $("#cmdInput").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && $("#cmdInput").value.trim()) {
      const txt = $("#cmdInput").value.trim();
      $("#cmdModal").classList.remove("open");
      state.nav = "today"; state.period = "day"; state.rightMode = "capture";
      handleCaptureUtterance(txt);
    }
  });
}

function renderCmdOptions() {
  const actions = [
    ["直接速记一句话：刚跑了 30 分钟", () => { state.nav = "today"; state.period = "day"; handleCaptureUtterance("刚跑了 30 分钟"); }],
    ["切换至「本周汇总」热力矩阵", () => { state.nav = "summary"; state.period = "week"; render(); }],
    ["开启今晚「一次一项」晚间复盘", () => { state.nav = "today"; state.period = "day"; state.rightMode = "review"; render(); }],
    ["打开桌面宠物快捷捕捉预览", () => { state.petOpen = true; $("#petFloat").classList.add("open"); syncChrome(); }],
    ["进入 25 分钟番茄专注", () => { state.nav = "focus"; render(); }]
  ];
  $("#cmdOptions").innerHTML = actions.map(([label], i) => `
    <button class="nav-item" data-cmd-idx="${i}" style="justify-content:flex-start;gap:10px">
      <span style="width:6px;height:6px;border-radius:50%;background:var(--blue-primary)"></span>
      <span>${label}</span>
    </button>
  `).join("");
  $$("[data-cmd-idx]").forEach((btn) => btn.addEventListener("click", () => {
    $("#cmdModal").classList.remove("open");
    actions[Number(btn.dataset.cmdIdx)][1]();
  }));
}

function render() {
  syncChrome();
  if (state.nav === "today" && state.period === "day") renderTodayView();
  else if (state.nav === "summary" || (state.nav === "today" && state.period !== "day")) renderSummaryView();
  else if (state.nav === "focus") renderFocusView();
  else if (state.nav === "rules") renderRulesView();
  else if (state.nav === "manage") renderManageView();
  else if (state.nav === "chat") renderChatView();
  else if (state.nav === "settings") renderSettingsView();
}

bindGlobal();
render();
</script>
